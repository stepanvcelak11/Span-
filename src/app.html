<title>Span Poznámky</title>
<meta name="theme-color" content="#2D5BD3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=Caveat:wght@500;600&family=Lora:wght@400;600&display=swap">
<style>
/* Layout: knihovna sešitů (mřížka obálek) → celoobrazovkový editor: horní lišta, plátno se stránkami, kolečko nástrojů u hrotu pera */
:root{
  --desk:#E4E8EE; --surface:#FFFFFF; --surface-2:#F2F4F8; --ink:#161C29; --muted:#5D6678;
  --line:#D4DAE4; --accent:#2D5BD3; --accent-soft:#E2E9FB; --accent-ink:#FFFFFF; --danger:#C2253A;
  --shadow:0 12px 36px rgba(18,28,56,.18);
  --f-display:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#111318; --surface:#1B1E25; --surface-2:#242832; --ink:#E7EAF0; --muted:#9AA2B2;
  --line:#313744; --accent:#88A7FF; --accent-soft:#25304E; --accent-ink:#0C1430; --danger:#FF7083;
  --shadow:0 12px 36px rgba(0,0,0,.55); color-scheme:dark } }
:root[data-theme="dark"]{
  --desk:#111318; --surface:#1B1E25; --surface-2:#242832; --ink:#E7EAF0; --muted:#9AA2B2;
  --line:#313744; --accent:#88A7FF; --accent-soft:#25304E; --accent-ink:#0C1430; --danger:#FF7083;
  --shadow:0 12px 36px rgba(0,0,0,.55); color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:14px;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;position:relative;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- knihovna ---------- */
#lib{height:100%;display:flex}
#lib[hidden]{display:none}
.side{width:250px;flex:none;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding-block:24px 30px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;box-sizing:border-box;display:flex;flex-direction:column;gap:22px}
.side .brand{padding:0 8px}
#sideNav{display:flex;flex-direction:column;gap:2px}
.nav-h{display:flex;align-items:center;justify-content:space-between;font:700 11.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav-h:first-child{padding-top:0}
.nav-h .ib{width:30px;height:30px;border-radius:8px}
.nav-h .ib svg{width:18px;height:18px}
.nav-it{display:flex;align-items:center;gap:11px;border:0;background:transparent;border-radius:10px;padding:0 6px 0 10px;height:42px;text-align:left;font-weight:500;width:100%}
.nav-it:hover{background:var(--surface-2)}
.nav-it[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-it .lbl2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-it .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:20px;text-align:right}
.nav-it .cdot2{width:12px;height:12px;border-radius:4px;flex:none;margin:0 5px}
.nav-row{display:flex;align-items:center}
.nav-row .nav-it{flex:1;min-width:0}
.nav-row .ib{width:32px;height:32px;border-radius:8px;opacity:.55}
.nav-row .ib:hover{opacity:1}
.nav-row .ib svg{width:18px;height:18px}
.lib-main{flex:1;min-width:0;overflow-y:auto;padding-block:26px 60px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));box-sizing:border-box}
.lib-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.lib-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-right:auto;min-width:0;font:700 22px/1.2 var(--f-display);letter-spacing:-.01em}
.crumbs button{border:0;background:transparent;padding:4px 6px;border-radius:8px;font:inherit;color:var(--muted)}
.crumbs button:hover{background:var(--surface-2);color:var(--ink)}
.crumbs .here{padding:4px 6px;display:inline-flex;align-items:center;gap:10px}
.crumbs .sepc{color:var(--muted);font-weight:500}
.crumbs .cdot2{width:14px;height:14px;border-radius:5px}
.lib-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sort{display:flex;align-items:center;gap:8px;margin-left:auto;color:var(--muted);font-size:13px}
.sort select{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;padding:0 10px}
.empty{grid-column:1/-1;border:1.5px dashed var(--line);border-radius:16px;padding:28px;color:var(--muted);text-align:center;line-height:1.55}
.folder{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:14px;border:1px solid color-mix(in srgb,var(--fc) 35%,var(--line));background:color-mix(in srgb,var(--fc) 13%,var(--surface));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--fc);padding:12px}
.folder svg{width:64px;height:64px;stroke-width:1.4}
.folder .fcount{font-size:12px;color:var(--muted);font-weight:500;text-align:center}
.folder:active{transform:scale(.98)}
.fav-badge{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#E8A400}
.fav-badge svg{width:16px;height:16px;fill:currentColor}
.cat-tag{display:inline-flex;align-items:center;gap:5px}
.cat-tag i{width:8px;height:8px;border-radius:3px;display:inline-block}
.snip{font-size:12px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.snip mark{background:#FFE58A;color:#1B2232;border-radius:3px;padding:0 2px}
.tree{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow-y:auto}
.tree button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;height:42px;text-align:left;font-weight:500;padding-right:10px}
.tree button:hover{background:var(--surface-2)}
.tree button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tree button:disabled{opacity:.4}
@media (max-width:760px){
  #lib{flex-direction:column}
  .side{width:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px max(14px,env(safe-area-inset-left,0px)) 10px;gap:10px;overflow:visible}
  #sideNav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none;padding-bottom:4px}
  .nav-h{display:none}
  .nav-row,.nav-it{flex:none;width:auto}
  .nav-row .ib{display:none}
  .nav-it{border:1px solid var(--line);height:38px;padding:0 12px;white-space:nowrap}
  .nav-it .lbl2{overflow:visible}
  .sort{margin-left:0}
  .crumbs{font-size:19px}
}
.brand{display:flex;align-items:center;gap:10px}
.only-m{display:none!important}
@media (max-width:760px){.only-m{display:flex!important}}
#app{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app input,#app textarea,#app select{user-select:text;-webkit-user-select:text}
.lib-main,.side,.pages-list,.modal-body{overscroll-behavior:contain}
.pop .sizes{display:flex}
@media (max-width:900px){ #tb .sizes,#bImage{display:none} .tb-title{max-width:130px} .tb-title button{max-width:120px} .tb-tools{margin:0} }
@media (pointer:coarse){ .ib{width:46px;height:46px} .nav-it{height:46px} .menu button{padding:13px 12px} .chip{height:40px} }
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand h1{font:800 24px/1 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.brand small{display:block;font:500 12px/1.2 var(--f-body);color:var(--muted);letter-spacing:.02em;margin-top:3px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px;min-width:0;flex:0 1 260px}
.search input{border:0;background:transparent;outline:none;font:inherit;color:var(--ink);width:100%;min-width:0}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:hover{filter:brightness(.97)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 22px}
.card{display:flex;flex-direction:column;gap:9px;min-width:0}
.cover{position:relative;aspect-ratio:3/4;border-radius:6px 14px 14px 6px;border:0;padding:0;background:var(--cv);box-shadow:0 2px 0 rgba(0,0,0,.08),0 10px 22px rgba(18,28,56,.16);overflow:hidden;text-align:left;max-width:100%}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:14px;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,.05) 70%,rgba(255,255,255,.08))}
.cover .lbl{position:absolute;left:24px;right:14px;top:22%;background:rgba(255,255,255,.92);color:#1b2130;border-radius:6px;padding:9px 10px;font:700 13px/1.25 var(--f-display);word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cover:active{transform:scale(.98)}
.cover.new{background:transparent;border:2px dashed var(--line);box-shadow:none;display:grid;place-items:center;color:var(--muted)}
.cover.new::before{display:none}
.cover.new span{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600}
.card-meta{display:flex;align-items:flex-start;gap:6px}
.card-meta>div{flex:1;min-width:0}
.card-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-date{color:var(--muted);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.lib-note{color:var(--muted);font-size:12.5px;line-height:1.5;max-width:70ch}

/* ---------- editor ---------- */
#editor{height:100%;display:flex;flex-direction:column}
.tb{display:flex;align-items:center;gap:3px;padding-block:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none;position:relative;z-index:5}
.tb::-webkit-scrollbar{display:none}
.ib{width:42px;height:42px;border-radius:11px;border:0;background:transparent;display:grid;place-items:center;flex:none;position:relative}
.ib:hover{background:var(--surface-2)}
.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default}
.ib .dot{position:absolute;bottom:5px;right:7px;width:6px;height:6px;border-radius:50%}
.sep{width:1px;height:26px;background:var(--line);margin:0 5px;flex:none}
.tb-title{display:flex;flex-direction:column;min-width:0;max-width:200px;padding:0 6px;flex:none}
.tb-title button{border:0;background:transparent;padding:0;font:700 15px/1.2 var(--f-display);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.tb-title span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tb-title span button{font:inherit;color:inherit;display:inline;max-width:none}
.tb-tools{display:flex;align-items:center;gap:2px;margin:0 auto}
.swatch-btn span{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 0 0 1px var(--line)}
.sizes{display:flex;gap:1px}
.sz{width:34px;height:42px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed="true"]{background:var(--accent-soft)}
.sz[aria-pressed="true"] i{background:var(--accent)}
.stage{flex:1;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:var(--desk)}
.stage canvas{position:absolute;left:0;top:0;touch-action:none}
#radial{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#radial .rg{transform-origin:0 0;animation:pop .16s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){#radial .rg{animation:none}}
.r-bg{fill:var(--surface);opacity:.55;filter:drop-shadow(0 10px 24px rgba(10,20,50,.28))}
.r-sec{fill:var(--surface);stroke:var(--line);stroke-width:1}
.r-sec.on{fill:var(--accent-soft)}
.r-sec.hot{fill:var(--accent)}
.r-ic{color:var(--ink)} .r-ic.on{color:var(--accent)} .r-ic.hot{color:var(--accent-ink)}
.r-ic path,.r-ic rect,.r-ic circle{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.r-col{stroke:var(--surface);stroke-width:2}
.r-col.on{stroke:var(--ink);stroke-width:3}
.r-dot{fill:var(--ink)}
.r-center{fill:var(--surface);stroke:var(--line)}
.r-center.hot{fill:var(--surface-2)}
.r-lab{fill:var(--ink)}
.r-labt{fill:var(--surface);font:600 12.5px var(--f-body)}
.selbar{position:absolute;display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:4;align-items:center}
.selbar .ib{width:38px;height:38px}
.selbar .cdot{width:20px;height:20px;border-radius:50%;border:0;margin:0 2px;box-shadow:0 0 0 1px var(--line);flex:none;padding:0}
.selbar .ib.del{color:var(--danger)}
#ta{position:absolute;z-index:3;border:1.5px dashed var(--accent);background:transparent;outline:none;resize:none;overflow:hidden;padding:0;margin:0;line-height:1.3;white-space:pre-wrap;word-wrap:break-word;box-sizing:content-box}
.pages{position:absolute;top:0;right:0;bottom:0;width:230px;background:var(--surface);border-left:1px solid var(--line);z-index:6;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .2s ease;box-shadow:var(--shadow);padding-right:env(safe-area-inset-right,0px)}
.pages.open{transform:none}
.pages-head{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 16px;font:700 15px var(--f-display)}
.pages-head span{margin-right:auto}
.pages-list{flex:1;overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:14px}
.pg{display:flex;flex-direction:column;gap:6px;align-items:center}
.pg canvas{position:static;width:150px;height:auto;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 4px 12px rgba(18,28,56,.14);cursor:pointer;outline:2px solid transparent;outline-offset:3px}
.pg.cur canvas{outline-color:var(--accent)}
.pg-row{display:flex;align-items:center;gap:0}
.pg-row .ib{width:30px;height:30px;border-radius:8px}
.pg-row .ib svg{width:17px;height:17px}
.pg-row b{font-size:12px;color:var(--muted);width:26px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.pg-row .ib.marked{color:#E8A400}
.pages-foot{padding:10px 16px 14px;border-top:1px solid var(--line)}
.pages-foot .btn{width:100%;justify-content:center}

/* ---------- popovery, dialogy, toast ---------- */
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;max-width:min(340px,calc(100vw - 24px));box-sizing:border-box}
.pop h4{margin:2px 2px 8px;font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pop .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pop .row:last-child{margin-bottom:0}
.cbtn{width:30px;height:30px;border-radius:50%;border:0;padding:0;box-shadow:0 0 0 1px var(--line)}
.cbtn[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.chip{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.menu{display:flex;flex-direction:column;min-width:230px;padding:4px}
.menu button{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:10px 10px;border-radius:10px;font-weight:500}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.menu button.danger{color:var(--danger)}
.modal-ov{position:fixed;inset:0;z-index:60;background:rgba(10,14,24,.42);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal h2{margin:0;padding:20px 22px 6px;font:700 19px var(--f-display);text-wrap:balance}
.modal-body{padding:10px 22px 6px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;line-height:1.5}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input[type=text],.field select{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font:inherit;padding:0 12px}
.field input[type=range]{width:100%}
.check{display:flex;align-items:center;gap:10px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.tpl{border:0;background:transparent;padding:0;display:flex;flex-direction:column;gap:5px;align-items:center;font-size:12px;font-weight:500}
.tpl canvas{width:100%;height:auto;border-radius:4px;box-shadow:0 0 0 1px var(--line);display:block}
.tpl[aria-pressed="true"] canvas{box-shadow:0 0 0 2.5px var(--accent)}
.help{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.help b{font-weight:600}
.kbd{font:600 11px var(--f-body);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-weight:500;z-index:80;box-shadow:var(--shadow);max-width:calc(100vw - 40px);text-align:center}
@media (max-width:700px){ .tb-title{max-width:120px} .tb-title button{max-width:110px} .sizes .sz:nth-child(4){display:none} }
</style>

<div id="app">
  <section id="lib" aria-label="Knihovna sešitů">
    <aside class="side">
      <div class="brand">
        <div class="brand-mark"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg></div>
        <div><h1>Span</h1><small>Ručně psané poznámky</small></div>
      </div>
      <nav id="sideNav" aria-label="Kategorie a filtry"></nav>
    </aside>
    <main class="lib-main">
      <div class="lib-in">
        <div class="lib-head">
          <div class="crumbs" id="crumbs"></div>
          <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><input id="q" type="text" placeholder="Hledat v názvech i textu" aria-label="Hledat"></label>
        </div>
        <div class="lib-actions">
          <button class="btn primary" id="bNew"></button>
          <button class="btn" id="bNewFolder"></button>
          <button class="btn" id="bImpPdf"></button>
          <button class="btn" id="bImpBak"></button>
          <label class="sort"><span>Řadit</span><select id="sort" aria-label="Řazení"><option value="updated">Naposledy upravené</option><option value="title">Podle názvu</option><option value="created">Nejnovější</option></select></label>
          <button class="ib" id="bLibSettings" title="Nastavení" aria-label="Nastavení"></button>

/* ---------- matice ---------- */

function finalize(it){

  return it;
}
function processPts(p){
  let pts=p;

  return pts.map(q=>[Math.round(q[0]*100)/100,Math.round(q[1]*100)/100,Math.round(q[2]*1000)/1000]);

function densify(pts,step){const out=[];for(let i=0;i<pts.length;i++){const b=pts[i];if(i>0){const a=pts[i-1],d=dist(a,b);if(d>step){const n=Math.ceil(d/step);for(let k=1;k<n;k++){const t=k/n;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]);}}}out.push(b);}return out;}
function curveThrough(path,arr){for(let i=1;i<arr.length-1;i++){const a=arr[i],b=arr[i+1];path.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}const l=arr[arr.length-1];path.lineTo(l[0],l[1]);}
function pathOf(it){
  let p=pathCache.get(it); if(p) return p;
  p=new Path2D(); const pts=it.p, n=pts.length;
  if(it.k==='pen'){
    const inf=it.ps==='ball'?0.3:0.8;
    const rad=q=>Math.max(0.3,it.w/2*((1-inf)+inf*clamp(q[2],0.05,1)*1.5));
    if(n<2){const q=pts[0];p.arc(q[0],q[1],rad(q),0,Math.PI*2);}
    else{
      const r=pts.map(rad);for(let i=1;i<n-1;i++)r[i]=(r[i-1]+2*r[i]+r[i+1])/4;
      const L=[],R=[],A=[];
      for(let i=0;i<n;i++){const a=pts[Math.max(0,i-2)],b=pts[Math.min(n-1,i+2)];const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l,q=pts[i];L.push([q[0]+nx*r[i],q[1]+ny*r[i]]);R.push([q[0]-nx*r[i],q[1]-ny*r[i]]);A.push(Math.atan2(ny,nx));}

      p.arc(pts[n-1][0],pts[n-1][1],r[n-1],A[n-1],A[n-1]-Math.PI,true);
      curveThrough(p,R.slice().reverse());
      p.arc(pts[0][0],pts[0][1],r[0],A[0]+Math.PI,A[0],true);
      p.closePath();
    }
  }else{
    p.moveTo(pts[0][0],pts[0][1]);
    if(n===1)p.lineTo(pts[0][0]+0.01,pts[0][1]);
    else if(it.k==='sh'){for(let i=1;i<n;i++)p.lineTo(pts[i][0],pts[i][1]);}
    else curveThrough(p,pts);
  }
  pathCache.set(it,p); return p;
}
function textLayout(it){
  let L=tlCache.get(it); if(L) return L;
  mctx.font=`${it.s}px ${FONTS[it.f||'sans']}`;
  const lines=[];
  for(const para of String(it.text||'').split('\n')){
    const words=para.split(/(\s+)/); let line='';
    for(const w of words){const test=line+w;if(mctx.measureText(test).width>it.w&&line.trim()){lines.push(line.trimEnd());line=w.trimStart();}else line=test;}
    lines.push(line);
  }
  const lh=it.s*1.3; L={lines,lh,h:Math.max(lh,lines.length*lh)}; tlCache.set(it,L); return L;
}
function getImg(src){let im=imgCache.get(src);if(!im){im=new Image();im.onload=()=>{pcache.clear();scheduleRender();if(pagesOpen())schedulePanel();};im.src=src;imgCache.set(src,im);}return im;}

  if(!r) return [it.x,it.y,it.x+it.w,it.y+h];

function drawItem(c,it,page){
  if(it.t==='s'){

    c.save();
    if(it.k==='hl'){c.globalAlpha=0.42;if(!isDark(page))c.globalCompositeOperation='multiply';}

    const L=textLayout(it); c.save();

function drawTemplate(c,p){

  c.save();c.lineWidth=1.2;c.strokeStyle=line;c.fillStyle=line;
  const ruled=(gap,from)=>{c.beginPath();for(let y=from;y<h-40;y+=gap){c.moveTo(0,y);c.lineTo(w,y);}c.stroke();};
  switch(p.tpl){
    case 'lined': case 'narrow':{ruled(p.tpl==='lined'?40:30,150);c.strokeStyle=dark?'rgba(255,120,120,.32)':'rgba(220,70,70,.42)';c.beginPath();c.moveTo(100,0);c.lineTo(100,h);c.stroke();break;}
    case 'grid':{c.lineWidth=1;c.beginPath();for(let x=40;x<w;x+=40){c.moveTo(x,0);c.lineTo(x,h);}for(let y=40;y<h;y+=40){c.moveTo(0,y);c.lineTo(w,y);}c.stroke();break;}
    case 'dots':{c.beginPath();for(let x=40;x<w;x+=40)for(let y=40;y<h;y+=40){c.moveTo(x+1.9,y);c.arc(x,y,1.9,0,Math.PI*2);}c.fill();break;}
    case 'cornell':{ruled(40,160);c.lineWidth=2.2;c.beginPath();c.moveTo(0,120);c.lineTo(w,120);c.moveTo(270,120);c.lineTo(270,h-290);c.moveTo(0,h-290);c.lineTo(w,h-290);c.stroke();break;}
    case 'todo':{ruled(50,150);c.lineWidth=1.6;for(let y=150;y<h-60;y+=50){c.strokeRect(60,y-33,22,22);}break;}
    case 'music':{c.beginPath();for(let y0=140;y0<h-110;y0+=120){for(let k=0;k<5;k++){const y=y0+k*13;c.moveTo(60,y);c.lineTo(w-60,y);}}c.stroke();break;}

function drawPage(c,p,opt={}){
  c.save();c.beginPath();c.rect(0,0,p.w,p.h);c.clip();

  if(p.bg){const im=getImg(p.bg);if(im.complete&&im.naturalWidth)c.drawImage(im,0,0,p.w,p.h);}
  drawTemplate(c,p);
  const v=opt.vis, ex=opt.exclude, ed=opt.editId;
  for(const it of p.items){
    if(ex&&ex.has(it.id))continue; if(ed&&it.id===ed)continue;
    if(v){const b=getBounds(it);if(b[2]<v[0]||b[0]>v[2]||b[3]<v[1]||b[1]>v[3])continue;}
    drawItem(c,it,p);

/* ---------- rozpoznání tvarů ---------- */
function rdp(pts,eps){if(pts.length<3)return pts.slice();let md=0,mi=0;const a=pts[0],b=pts[pts.length-1];for(let i=1;i<pts.length-1;i++){const d=distSeg(pts[i][0],pts[i][1],a[0],a[1],b[0],b[1]);if(d>md){md=d;mi=i;}}if(md>eps){const l=rdp(pts.slice(0,mi+1),eps),r=rdp(pts.slice(mi),eps);return l.slice(0,-1).concat(r);}return [a,b];}
function poly2pts(vs,closed){const arr=vs.map(v=>[v[0],v[1],0.5]);if(closed)arr.push([vs[0][0],vs[0][1],0.5]);return densify(arr,4);}
function ellipsePts(cx,cy,rx,ry){const o=[];for(let i=0;i<=96;i++){const a=i/96*Math.PI*2;o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry,0.5]);}return o;}
function genShape(kind,a,b){
  const x0=Math.min(a[0],b[0]),y0=Math.min(a[1],b[1]),x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]);
  switch(kind){
    case 'line':return poly2pts([a,b]);
    case 'arrow':{const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),L=Math.min(36,Math.max(12,dist(a,b)*0.25));const h1=[b[0]-L*Math.cos(ang-0.45),b[1]-L*Math.sin(ang-0.45)],h2=[b[0]-L*Math.cos(ang+0.45),b[1]-L*Math.sin(ang+0.45)];return poly2pts([a,b,h1,b,h2]);}
    case 'rect':return poly2pts([[x0,y0],[x1,y0],[x1,y1],[x0,y1]],true);
    case 'ellipse':return ellipsePts((x0+x1)/2,(y0+y1)/2,(x1-x0)/2,(y1-y0)/2);
    case 'triangle':return poly2pts([[(x0+x1)/2,y0],[x1,y1],[x0,y1]],true);
  }
  return null;
}
function recognize(raw){
  if(raw.length<4)return null;
  const P=raw.map(q=>[q[0],q[1]]), n=P.length;
  let len=0;for(let i=1;i<n;i++)len+=dist(P[i-1],P[i]);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of P){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1]);}
  const diag=Math.hypot(x1-x0,y1-y0); if(diag<14)return null;
  const a=P[0], b=P[n-1];
  const closed=dist(a,b)<Math.max(22,diag*0.24)&&len>diag*1.5;
  if(!closed){
    if(dist(a,b)/len>0.9){
      let e=b.slice();const ang=Math.atan2(e[1]-a[1],e[0]-a[0]),L=dist(a,e),sn=Math.round(ang/(Math.PI/4))*(Math.PI/4);
      if(Math.abs(ang-sn)<0.1)e=[a[0]+Math.cos(sn)*L,a[1]+Math.sin(sn)*L];
      return poly2pts([a,e]);
    }
    const s=rdp(P,diag*0.08);
    if(s.length===3&&dist(s[0],s[1])>dist(s[1],s[2])*2.2){const q=s[1];const r=rdp(P.slice(P.findIndex(v=>v===q)),diag*0.06);if(r.length<=3)return genShape('arrow',s[0],q);}
    return null;
  }
  const cx=(x0+x1)/2,cy=(y0+y1)/2,rx=Math.max(1,(x1-x0)/2),ry=Math.max(1,(y1-y0)/2);
  let err=0;for(const q of P)err+=Math.abs(Math.hypot((q[0]-cx)/rx,(q[1]-cy)/ry)-1);err/=n;
  let s=rdp(P,diag*0.075); s=s.slice(0,-1);
  let changed=true;
  while(changed&&s.length>3){changed=false;for(let i=0;i<s.length;i++){const p0=s[(i-1+s.length)%s.length],p1=s[i],p2=s[(i+1)%s.length];const a1=Math.atan2(p1[1]-p0[1],p1[0]-p0[0]),a2=Math.atan2(p2[1]-p1[1],p2[0]-p1[0]);let d=Math.abs(a2-a1);if(d>Math.PI)d=2*Math.PI-d;if(d<0.42||dist(p0,p1)<diag*0.07){s.splice(i,1);changed=true;break;}}}
  if(err<0.1&&s.length>=4&&!(s.length===4&&err>0.06))return ellipsePts(cx,cy,rx,ry);
  if(s.length===3)return poly2pts(s,true);
  if(s.length===4){
    let axis=true;for(let i=0;i<4;i++){const p0=s[i],p1=s[(i+1)%4];const ang=Math.abs(Math.atan2(p1[1]-p0[1],p1[0]-p0[0]))%(Math.PI/2);if(Math.min(ang,Math.PI/2-ang)>0.22)axis=false;}
    if(axis){let a0=1e9,b0=1e9,a1=-1e9,b1=-1e9;for(const q of s){a0=Math.min(a0,q[0]);b0=Math.min(b0,q[1]);a1=Math.max(a1,q[0]);b1=Math.max(b1,q[1]);}return genShape('rect',[a0,b0],[a1,b1]);}
    return poly2pts(s,true);
  }
  if(err<0.2)return ellipsePts(cx,cy,rx,ry);
  if(s.length<=8)return poly2pts(s,true);
  return null;
}

/* =========================================================
   Pohled a vykreslování
   ========================================================= */
function layoutPages(){let y=0;maxPW=0;for(const p of nb.pages){p._top=y;p._left=-p.w/2;y+=p.h+GAP;maxPW=Math.max(maxPW,p.w);}docH=Math.max(0,y-GAP);}
function resize(){
  if(!nb)return;
  const r=stage.getBoundingClientRect(); if(r.width<10)return;
  const first=!W; W=r.width; H=r.height; dpr=Math.min(window.devicePixelRatio||1,3);
  for(const c of [board,live]){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);c.style.width=W+'px';c.style.height=H+'px';}
  if(first)fitWidth(); clampView(); render();
}
new ResizeObserver(()=>resize()).observe(stage);
function fitWidth(keepCenter){
  const cy=keepCenter?(H/2-oy)/z:null;
  z=clamp((W-28)/maxPW,0.2,1.3); ox=W/2;
  oy=cy==null?16:H/2-cy*z; clampView();
}
function clampView(){
  const cw=maxPW*z; if(cw<=W-20)ox=W/2; else ox=clamp(ox,W-cw/2-30,cw/2+30);
  const ch=docH*z; oy=clamp(oy,Math.min(16,H-100-ch),100);
}
function zoomAt(sx,sy,nz){nz=clamp(nz,0.2,6);ox=sx-(sx-ox)*nz/z;oy=sy-(sy-oy)*nz/z;z=nz;clampView();scheduleRender();}
function pageAtWorld(wx,wy,strict=true){
  for(const p of nb.pages){if(wy>=p._top&&wy<=p._top+p.h&&(!strict||(wx>=p._left&&wx<=p._left+p.w)))return p;}
  return null;
}
function curPageIndex(){const wy=(H*0.45-oy)/z;let best=0;nb.pages.forEach((p,i)=>{if(wy>=p._top-GAP)best=i;});return best;}
function toLocal(sx,sy,p){return [(sx-ox)/z-p._left,(sy-oy)/z-p._top];}
function pageMat(p){return [z,0,0,z,p._left*z+ox,p._top*z+oy];}
function setTf(c,m){c.setTransform(m[0]*dpr,m[1]*dpr,m[2]*dpr,m[3]*dpr,m[4]*dpr,m[5]*dpr);}
/* Rychlý režim: při posunu/zoomu se stránky kreslí z bitmapové mezipaměti, po gestu znovu ostře vektorově. */
let fastMode=false,fastT=0;const pcache=new Map();
function setFast(){fastMode=true;clearTimeout(fastT);}
function endFast(delay=0){clearTimeout(fastT);fastT=setTimeout(()=>{if(!fastMode)return;fastMode=false;render();},delay);}
function pageBitmap(p){
  const want=clamp(z*dpr,0.4,2);let c=pcache.get(p.id);
  if(c&&c.items===p.items&&c.tpl===p.tpl&&c.paper===p.paper&&c.bg===p.bg&&c.w===p.w&&c.scale>=want*0.6)return c.cv;
  const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(p.w*want));cv.height=Math.max(1,Math.round(p.h*want));
  const x=cv.getContext('2d');x.scale(want,want);drawPage(x,p,{});
  pcache.delete(p.id);pcache.set(p.id,{cv,items:p.items,tpl:p.tpl,paper:p.paper,bg:p.bg,w:p.w,scale:want});
  if(pcache.size>8)pcache.delete(pcache.keys().next().value);
  return cv;
}
function scheduleRender(){if(needRender)return;needRender=true;requestAnimationFrame(()=>{if(needRender)render();});}
function render(){
  needRender=false; if(!nb||!W)return;
  const c=bctx; c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle=getDesk(); c.fillRect(0,0,W,H);
  const wy0=-oy/z, wy1=(H-oy)/z;
  for(const p of nb.pages){
    if(p._top+p.h<wy0||p._top>wy1)continue;
    const m=pageMat(p);
    c.save();c.shadowColor='rgba(18,28,56,.20)';c.shadowBlur=14;c.shadowOffsetY=3;c.fillStyle=PAPERS[p.paper]||'#fff';c.fillRect(m[4],m[5],p.w*z,p.h*z);c.restore();
    if(fastMode&&!(sel&&sel.page===p)&&!(editing&&editing.page===p)){c.drawImage(pageBitmap(p),m[4],m[5],p.w*z,p.h*z);continue;}
    c.save(); setTf(c,m);
    drawPage(c,p,{vis:[-m[4]/z,-m[5]/z,(W-m[4])/z,(H-m[5])/z],exclude:sel&&sel.page===p?sel.ids:null,editId:editing&&editing.page===p?editing.id:null});
    c.restore();
  }
  drawOverlay(); updatePageInd(); if(editing)positionTA(); if(sel&&!(act&&act.type==='seldrag'))showSelBar();
}
let deskCol=null; function getDesk(){if(!deskCol)deskCol=getComputedStyle(document.documentElement).getPropertyValue('--desk').trim()||'#E4E8EE';return deskCol;}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{deskCol=null;scheduleRender();});
function drawOnMain(p,it){const c=bctx;c.save();setTf(c,pageMat(p));c.beginPath();c.rect(0,0,p.w,p.h);c.clip();drawItem(c,it,p);c.restore();}

function drawOverlay(){
  const c=lctx; c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,live.width,live.height);
  if(!nb)return;
  if(sel){
    c.save(); setTf(c,mul(pageMat(sel.page),sel.m));
    for(const it of selItems())drawItem(c,it,sel.page);
    c.restore(); drawSelFrame(c);
  }
  if(act){
    const p=act.page;
    if(act.type==='draw'){
      c.save();setTf(c,pageMat(p));c.beginPath();c.rect(0,0,p.w,p.h);c.clip();
      const it=act.pred&&act.pred.length?Object.assign({},act.it,{p:act.it.p.concat(act.pred)}):act.it;
      drawItem(c,it,p);c.restore();
    }else if(act.type==='shape'){
      c.save();setTf(c,pageMat(p));
      const pts=act.kind==='auto'?act.raw:genShape(act.kind,act.a,act.b);
      if(pts&&pts.length)drawItem(c,{t:'s',k:'sh',c:T.shape.color,w:T.shape.size,p:pts},p);
      c.restore();
    }else if(act.type==='lasso'){
      c.save();setTf(c,pageMat(p));c.beginPath();act.poly.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));
      c.fillStyle='rgba(45,91,211,.07)';c.fill();c.setLineDash([6/z,5/z]);c.lineWidth=1.6/z;c.strokeStyle='#2D5BD3';c.stroke();c.restore();
    }else if(act.type==='erase'&&act.cur){
      const s=[(p._left+act.cur[0])*z+ox,(p._top+act.cur[1])*z+oy];
      c.setTransform(dpr,0,0,dpr,0,0);c.beginPath();c.arc(s[0],s[1],T.eraser.size/2,0,Math.PI*2);c.fillStyle='rgba(255,255,255,.35)';c.fill();c.lineWidth=1.5;c.strokeStyle='rgba(30,40,60,.6)';c.stroke();
    }
    if(!act.far&&holdable(act)&&S.radial){
      const el=performance.now()-act.t0;
      if(el>140){const k=clamp((el-140)/(S.holdMs-140),0,1);c.setTransform(dpr,0,0,dpr,0,0);c.beginPath();c.arc(act.sx0,act.sy0,24,-Math.PI/2,-Math.PI/2+k*Math.PI*2);c.lineWidth=3;c.lineCap='round';c.strokeStyle='rgba(45,91,211,.75)';c.stroke();}
    }
  }
  if(hoverPt&&!act&&T.tool==='eraser'){c.setTransform(dpr,0,0,dpr,0,0);c.beginPath();c.arc(hoverPt[0],hoverPt[1],T.eraser.size/2,0,Math.PI*2);c.lineWidth=1.5;c.strokeStyle='rgba(30,40,60,.45)';c.setLineDash([4,3]);c.stroke();c.setLineDash([]);}
  if(laser.length)drawLaser(c);
}
const holdable=a=>['draw','shape','erase','lasso','text','none'].includes(a.type);

/* ---------- laser ---------- */
const laser=[]; let laserRAF=0;
function laserAdd(x,y){laser.push({x,y,t:performance.now()});if(!laserRAF)laserRAF=requestAnimationFrame(laserTick);}
function laserTick(){const now=performance.now();while(laser.length&&now-laser[0].t>850)laser.shift();drawOverlay();laserRAF=laser.length?requestAnimationFrame(laserTick):0;}
function drawLaser(c){
  const now=performance.now(); c.setTransform(dpr,0,0,dpr,0,0); c.lineCap='round'; c.lineJoin='round';
  for(let i=1;i<laser.length;i++){const a=laser[i-1],b=laser[i];if(b.t-a.t>120)continue;const k=1-(now-b.t)/850;c.strokeStyle=`rgba(255,40,60,${0.9*k})`;c.lineWidth=6*k+1;c.shadowColor='rgba(255,40,60,.8)';c.shadowBlur=12;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();}
  c.shadowBlur=0;
}

   Historie (zpět / znovu)
   ========================================================= */
const pageById=id=>nb.pages.find(p=>p.id===id);
function pushUndo(e){H_.undo.push(e);if(H_.undo.length>250)H_.undo.shift();H_.redo.length=0;updUndo();}
const snapItems=p=>pushUndo({k:'items',pid:p.id,items:p.items});
const capPages=()=>({k:'pages',pages:nb.pages.slice(),items:nb.pages.map(p=>p.items),meta:nb.pages.map(p=>({tpl:p.tpl,paper:p.paper,mark:p.mark}))});
const snapPages=()=>pushUndo(capPages());
function capture(e){if(e.k==='multi')return {k:'multi',list:e.list.map(capture)};if(e.k==='items'){const p=pageById(e.pid);return {k:'items',pid:e.pid,items:p?p.items:[]};}return capPages();}
function applyH(e){if(e.k==='multi'){e.list.forEach(applyH);return;}if(e.k==='items'){const p=pageById(e.pid);if(p)p.items=e.items;return;}nb.pages=e.pages;e.pages.forEach((p,i)=>{p.items=e.items[i];Object.assign(p,e.meta[i]);});}
function histStep(from,to){commitText();if(act)abortAct();clearSel();const e=from.pop();if(!e){toast(from===H_.undo?'Není co vrátit':'Není co opakovat');return;}to.push(capture(e));applyH(e);layoutPages();clampView();changed();render();updUndo();if(pagesOpen())schedulePanel();}
const undo=()=>histStep(H_.undo,H_.redo), redo=()=>histStep(H_.redo,H_.undo);
function updUndo(){$('#bUndo').disabled=!H_.undo.length;$('#bRedo').disabled=!H_.redo.length;}

/* ---------- ukládání ---------- */
let saveTimer=0;
function changed(){if(!nb)return;nb.updated=Date.now();clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,500);if(pagesOpen())schedulePanel();}
function flushSave(){clearTimeout(saveTimer);if(nb)DB.put(nb).then(ok=>{if(!ok)toast('Uložení se nepodařilo – zálohujte sešit.');});}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){commitText();flushSave();}});

const fingerDraws=()=>S.finger==='on'||(S.finger==='auto'&&!S.penSeen);
const pressureOf=e=>e.pointerType==='pen'?(e.pressure>0?e.pressure:0.5):0.5;
const sp=e=>[e.clientX-stageRect.left,e.clientY-stageRect.top];
const vibrate=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};

stage.addEventListener('pointerdown',onDown);
stage.addEventListener('pointermove',onMove);
stage.addEventListener('pointerup',onUp);
stage.addEventListener('pointercancel',onCancel);
stage.addEventListener('contextmenu',e=>e.preventDefault());
stage.addEventListener('wheel',e=>{e.preventDefault();stageRect=stage.getBoundingClientRect();if(e.ctrlKey||e.metaKey){setFast();const[sx,sy]=sp(e);zoomAt(sx,sy,z*Math.exp(-e.deltaY*0.01));}else{setFast();ox-=e.deltaX;oy-=e.deltaY;clampView();scheduleRender();}endFast(180);},{passive:false});

function onDown(e){
  if(e.target.closest('.selbar,textarea,.pages'))return;

  if(e.pointerType==='pen'){lastPen=performance.now();if(!S.penSeen){S.penSeen=true;saveS();}}

    if(act&&act.ptype!=='touch')return;                 // dlaň při psaní perem

    const key=e=>{if(e.key==='Escape')done(null);};document.addEventListener('keydown',key);
    actions.forEach(a=>{const b=el('button',{class:'btn '+(a.cls||'')},esc(a.label));b.onclick=()=>done(typeof a.value==='function'?a.value(body):(a.value===undefined?null:a.value));foot.append(b);});

const scripts={};

  if(dl){try{await dl.save({filename:name,data:blob});toast('Soubor uložen');}catch(e){if(e&&e.code!=='declined')toast('Soubor se nepodařilo uložit ('+(e.code||'chyba')+').');}return;}
  if(window.claude&&window.claude.use){toast('Stahování zde není povoleno. Otevřete aplikaci přes odkaz z GitHub Pages.');return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);

const safeName=s=>(s||'sesit').replace(/[\\/:*?"<>|]+/g,'').trim().slice(0,80)||'sesit';
function preload(p){const srcs=[p.bg].concat(p.items.filter(i=>i.t==='i').map(i=>i.src)).filter(Boolean);return Promise.all(srcs.map(s=>{const im=getImg(s);return im.complete&&im.naturalWidth?0:new Promise(r=>{im.addEventListener('load',r,{once:true});im.addEventListener('error',r,{once:true});});}));}

async function editCategory(c){

async function editFolder(f){

async function pickFolder(title,exclude,cur){
  let chosen=cur&&folderById(cur)?cur:null;
  return modal(title,b=>{
    const t=el('div',{class:'tree'});
    const mk=(id,label,depth,color)=>{const x=el('button',{'aria-pressed':String(id===chosen)},`${id?`<span style="color:${color}">${ic('folder')}</span>`:ic('book')}<span>${esc(label)}</span>`);x.style.paddingLeft=(10+depth*22)+'px';if(exclude&&id&&exclude.has(id))x.disabled=true;x.onclick=()=>{chosen=id;t.querySelectorAll('button').forEach(y=>y.setAttribute('aria-pressed',String(y===x)));};t.append(x);};
    mk(null,'Knihovna (bez složky)',0);
    const walk=(parent,d)=>lib.folders.filter(f=>(f.parent||null)===parent).sort((a,c)=>a.name.localeCompare(c.name,'cs')).forEach(f=>{mk(f.id,f.name,d,f.color);walk(f.id,d+1);});
    walk(null,1);
    if(!lib.folders.length)b.append(el('p',{class:'lib-note'},'Zatím nemáte žádné složky. Vytvoříte je tlačítkem „Nová složka“ v knihovně.'));

let wake=null;
async function requestWake(){try{if(navigator.wakeLock&&!wake&&document.visibilityState==='visible'){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&nb)requestWake();});
function toggleFullscreen(){try{if(document.fullscreenElement)document.exitFullscreen();else{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>toast('Celá obrazovka tady není dostupná.'));else if(!r)toast('Celá obrazovka tady není dostupná.');}}catch(e){toast('Celá obrazovka tady není dostupná.');}}
function openNotebook(n){requestWake();pcache.clear();
  commitText();nb=n;nb.pages.forEach(p=>{p.items=(p.items||[]).map(finalizeLoaded);});
  H_.undo=[];H_.redo=[];sel=null;act=null;W=0;
  layoutPages();$('#lib').hidden=true;$('#editor').hidden=false;$('#nbTitle').textContent=n.title;
  togglePanel(false);updateToolbar();updUndo();
  requestAnimationFrame(()=>{resize();if(n._lastY!=null){oy=n._lastY;clampView();render();}});
}
function closeNotebook(){try{if(wake){wake.release();wake=null;}}catch(e){}commitText();clearSel();if(nb){nb._lastY=oy;flushSave();}closeRadial();nb=null;$('#editor').hidden=true;$('#lib').hidden=false;renderLib();}

function openHelp(){

<li><b>Kolečko nástrojů:</b> přiložte pero a chvíli ho nechte stát. Kolem hrotu se objeví kolečko – přejeďte perem na nástroj, barvu nebo tloušťku a zvedněte. Boční tlačítko pera otevře kolečko okamžitě.</li>
<li><b>Přesný tvar:</b> nakreslete kruh, čáru, obdélník nebo trojúhelník a na konci pero podržte – tah se srovná.</li>
<li><b>Přesun objektů:</b> nástroj Laso – zakroužkujte, pak táhněte, zvětšujte za rohy a otáčejte horním úchytem. Přetažením na jinou stránku objekt přesunete tam.</li>
<li><b>Rychlý přesun prstem:</b> podržte prst na čemkoli napsaném a rovnou to posouvejte.</li>
<li><b>Prsty:</b> jeden prst posouvá, dva přibližují. Klepnutí dvěma prsty vrátí krok, třemi ho zopakuje. Dlaň při psaní perem se ignoruje.</li>
<li><b>Opakované klepnutí na aktivní nástroj</b> otevře jeho volby (typ pera, režim gumy, tvary, písmo).</li>
<li><b>Klávesy:</b> <span class="kbd">P</span> pero, <span class="kbd">H</span> zvýrazňovač, <span class="kbd">E</span> guma, <span class="kbd">L</span> laso, <span class="kbd">S</span> tvary, <span class="kbd">T</span> text, <span class="kbd">K</span> laser, <span class="kbd">Ctrl+Z</span> zpět. Na počítači otevře kolečko pravé tlačítko myši.</li></ul>`;},[{label:'Rozumím',cls:'primary',value:true}]);

document.addEventListener('keydown',e=>{
  if(!nb||editing||e.target.closest('input,textarea,select,.modal-ov'))return;
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==='y'){e.preventDefault();redo();return;}
  if(mod&&k==='c'&&sel){copySel(false);return;} if(mod&&k==='x'&&sel){copySel(true);return;}
  if(mod&&k==='v'&&clip){pasteAt(W/2,H/2);return;}
  if(mod&&k==='a'){e.preventDefault();setTool('lasso');const pg=nb.pages[curPageIndex()];if(pg.items.length)makeSel(pg,pg.items.map(i=>i.id));return;}
  if((k==='delete'||k==='backspace')&&sel){delSel();return;}
  if(k==='escape'){if(radial.open)closeRadial();else clearSel();return;}
  if(mod)return;
  const map={p:'pen',h:'hl',e:'eraser',l:'lasso',s:'shape',t:'text',k:'laser'};if(map[k])setTool(map[k]);
  if(k==='+'||k==='=')zoomAt(W/2,H/2,z*1.2);if(k==='-')zoomAt(W/2,H/2,z/1.2);
});
document.addEventListener('paste',e=>{if(!nb||editing)return;const f=[...(e.clipboardData&&e.clipboardData.files||[])].find(f=>f.type.startsWith('image/'));if(f){e.preventDefault();insertImage(f);}});

function makeWelcome(){
  const p1=newPage('lined','white'),p2=newPage('dots','white');
  const tx=(x,y,s,text,o={})=>Object.assign({t:'x',id:uid(),x,y,w:820,s,c:'#1B2232',f:'sans',text},o);
  const str=(k,c,w,pts)=>finalize({t:'s',id:uid(),k,c,w,ps:'fountain',p:pts});
  const line=(x0,y0,x1,y1)=>densify([[x0,y0,.5],[x1,y1,.5]],4);
  const wave=[];for(let i=0;i<=120;i++){const x=120+i*3.2;wave.push([x,1100+Math.sin(i/7)*14,0.35+0.5*Math.abs(Math.sin(i/18))]);}
  p1.items=[
    str('hl','#FFD43B',30,line(118,196,610,196)),
    tx(120,160,46,'Vítejte ve Span',{f:'serif'}),
    tx(120,268,25,'Toto je ukázkový sešit. Můžete do něj rovnou psát – nebo ho smazat v knihovně.',{c:'#495057'}),
    tx(120,388,26,'1. Přiložte pero a chvíli ho nechte stát → kolem hrotu se otevře kolečko s nástroji, barvami a tloušťkou.'),
    tx(120,508,26,'2. Nakreslete kruh nebo obdélník a na konci pero podržte → tvar se srovná.'),
    tx(120,588,26,'3. Laso: zakroužkujte cokoli, pak to přesuňte, zvětšete nebo otočte.'),
    tx(120,708,26,'4. Podržte prst na objektu → rovnou ho posouváte. Dva prsty přibližují, klepnutí dvěma prsty = Zpět.'),
    tx(120,828,26,'5. Boční tlačítko pera otevře kolečko okamžitě.'),
    str('sh','#2D5BD3',3,ellipsePts(760,1110,120,70)),
    str('sh','#D6336C',3,genShape('arrow',[560,1180],[640,1130])),
    str('pen','#2F9E44',3,wave),
    tx(600,1230,34,'zkuste mě přesunout!',{f:'hand',c:'#2D5BD3',w:340}),
  ];
  p2.items=[tx(80,60,30,'Volná stránka na zkoušení',{f:'hand',c:'#868E96'})];
  return {id:uid(),title:'Vítejte ve Span',cover:'#2D5BD3',created:Date.now(),updated:Date.now(),pages:[p1,p2]};
}
async function init(){
  applyTheme();

  const m=await DB.getMeta('lib');
  if(m)lib=Object.assign({id:'lib',folders:[],cats:[]},m);
  else{lib.cats=[{id:uid(),name:'Škola',color:'#2D5BD3'},{id:uid(),name:'Práce',color:'#1F7A5C'},{id:uid(),name:'Osobní',color:'#D9822B'}];await saveLib();}
  if(!notebooks.length&&!store.get('welcomed',false)){const w=makeWelcome();await DB.put(w);notebooks=[w];store.set('welcomed',true);}
  renderLib();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{tlCache=new WeakMap();if(nb)render();});
  try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!(window.claude&&window.claude.use)&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
}
