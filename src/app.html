<title>Span Poznámky</title>
<meta name="theme-color" content="#2D5BD3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=Caveat:wght@500;600&family=Lora:wght@400;500;600&display=swap">
<style>
/* Layout: knihovna sešitů (mřížka obálek) → celoobrazovkový editor: horní lišta, plátno se stránkami, kolečko nástrojů u hrotu pera */
:root{
  --desk:#EDEDF0; --surface:#FFFFFF; --surface-2:#F1F1F4; --ink:#151517; --muted:#6B6B73;
  --line:#E1E1E6; --accent:#D9603F; --accent-2:#1593A8; --accent-soft:#FBE7E1; --accent-ink:#FFFFFF; --danger:#C2253A;
  --bar:#FFFFFF; --bar-2:#EBEEF4; --bar-ink:#23262D; --bar-line:rgba(20,24,40,.10);
  --shadow:0 12px 36px rgba(0,0,0,.18);
  --f-display:"Lora", Georgia, "Times New Roman", serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#000000; --surface:#1C1C1E; --surface-2:#2A2A2D; --ink:#F2F2F4; --muted:#9C9CA3;
  --line:#2F2F33; --accent:#E3735C; --accent-2:#3EC3DB; --accent-soft:#3A2520; --accent-ink:#FFFFFF; --danger:#FF6B7D;
  --shadow:0 12px 36px rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --desk:#000000; --surface:#1C1C1E; --surface-2:#2A2A2D; --ink:#F2F2F4; --muted:#9C9CA3;
  --line:#2F2F33; --accent:#E3735C; --accent-2:#3EC3DB; --accent-soft:#3A2520; --accent-ink:#FFFFFF; --danger:#FF6B7D;
  --shadow:0 12px 36px rgba(0,0,0,.6); color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:14px;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;position:relative;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- knihovna ---------- */
#lib{height:100%;display:flex;background:var(--desk);position:relative}
#lib[hidden]{display:none}
.side{width:320px;flex:none;background:var(--surface);overflow-y:auto;padding-block:24px 40px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--line)}
#lib.noside .side{display:none}
.brand-t{font:600 36px/1.1 var(--f-display);letter-spacing:-.015em;margin:6px 8px 8px}
#sideNav{display:flex;flex-direction:column;gap:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;height:92px;padding:14px 14px 13px;border-radius:14px;border:0;background:var(--surface-2);text-align:left;font-weight:500;font-size:15px;box-sizing:border-box}
.tile svg{color:var(--c)}
.tile[aria-current="true"]{background:var(--accent);color:#fff}
.tile[aria-current="true"] svg{color:#fff}
.sec{display:flex;align-items:center;gap:2px;padding:14px 2px 6px 8px}
.sec h3{margin:0;font:600 24px/1.2 var(--f-display);flex:1;min-width:0}
.sec h3 button{border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left}
.sec .ib{width:38px;height:38px;color:var(--accent-2)}
.sec .chev svg{transition:transform .2s}
.sec.closed .chev svg{transform:rotate(-90deg)}
.fit{display:flex;align-items:center;gap:14px;min-height:54px;border:0;background:transparent;border-radius:27px;padding:0 20px;text-align:left;font-weight:600;font-size:15.5px;width:100%;box-sizing:border-box}
.fit:hover{background:var(--surface-2)}
.fit[aria-current="true"]{background:var(--accent);color:#fff}
.fit .lbl2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fit .cnt{font-size:14px;font-variant-numeric:tabular-nums;opacity:.85}
.fit .cdot2{width:14px;height:14px;border-radius:5px;flex:none;margin:0 4px}
.fit.sub{min-height:46px;font-weight:500}
.side-empty{color:var(--muted);font-size:13px;padding:2px 20px 8px;line-height:1.5}
.lib-main{flex:1;min-width:0;overflow-y:auto;padding-block:16px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));box-sizing:border-box}
.lib-in{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.topbar .grow{flex:1}
.ib.acc{color:var(--accent-2)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px;min-width:0;flex:0 1 280px;color:var(--accent-2)}
.search input{border:0;background:transparent;outline:none;font:inherit;color:var(--ink);width:100%;min-width:0}
.sortsel{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;padding:0 10px;max-width:190px}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.crumbs:empty{display:none}
.crumbs button{border:0;background:transparent;padding:4px 6px;border-radius:8px;font:inherit;color:var(--accent-2);font-weight:600}
.ltitle{margin:0 0 4px;font:600 42px/1.15 var(--f-display);letter-spacing:-.015em;text-wrap:balance;display:flex;align-items:center;gap:14px}
.ltitle .cdot2{width:18px;height:18px;border-radius:6px;flex:none}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.quick:empty{display:none}
.qa{display:flex;align-items:center;gap:16px;min-height:86px;padding:0 22px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:16px;text-align:left;box-sizing:border-box}
.qa:hover{background:var(--surface-2)}
.qa .qi{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:10px}
.qa .qi svg{width:28px;height:28px}
.qa.danger{color:var(--danger)}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:34px 26px;margin-top:12px}
.tcard{display:flex;flex-direction:column;gap:12px;min-width:0;position:relative}
.fthumb{width:100%;aspect-ratio:.72;border:0;border-radius:14px;background:var(--surface-2);padding:14px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;max-width:100%}
.fthumb>img,.fthumb>canvas{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:3px;display:block;min-height:0;min-width:0;background:#fff}
.fthumb>.ph{border-radius:3px;background:var(--surface);opacity:.6}
.nthumb{position:relative;width:100%;aspect-ratio:.72;border:0;padding:0;border-radius:4px 10px 10px 4px;overflow:hidden;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.1),0 8px 20px rgba(0,0,0,.22);max-width:100%}
.nthumb>img,.nthumb>canvas{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.nthumb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--cv);z-index:1}
.fthumb:active,.nthumb:active{transform:scale(.98)}
.cap{display:flex;align-items:flex-start;gap:8px;justify-content:center;min-width:0}
.cap>svg{flex:none;margin-top:1px}
.cap .ct{min-width:0;text-align:center}
.cap .t{font-weight:600;font-size:16px;line-height:1.3;word-break:break-word}
.cap .s{color:var(--accent-2);font-size:14px;margin-top:3px;font-variant-numeric:tabular-nums}
.tcard .more{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:10px;background:rgba(20,20,22,.6);color:#fff;opacity:0;transition:opacity .15s;z-index:2}
.tcard:hover .more,.tcard .more:focus-visible{opacity:1}
@media (pointer:coarse){.tcard .more{display:none}}
.fav-badge{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:#E8A400;z-index:1}
.fav-badge svg{width:16px;height:16px;fill:currentColor}
.cat-tag{display:inline-flex;align-items:center;gap:5px}
.cat-tag i{width:8px;height:8px;border-radius:3px;display:inline-block}
.snip{font-size:12.5px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.snip mark{background:#FFE58A;color:#1B2232;border-radius:3px;padding:0 2px}
.empty{grid-column:1/-1;border:1.5px dashed var(--line);border-radius:16px;padding:28px;color:var(--muted);text-align:center;line-height:1.55}
.tree{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow-y:auto}
.tree button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;min-height:44px;text-align:left;font-weight:500;padding-right:10px}
.tree button:hover{background:var(--surface-2)}
.tree button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tree button:disabled{opacity:.4}
.lib-note{color:var(--muted);font-size:12.5px;line-height:1.5;max-width:70ch}
.side-shade{display:none}
@media (max-width:1100px){.side{width:280px}}
@media (max-width:760px){
  .side{position:absolute;inset:0 auto 0 0;z-index:20;box-shadow:var(--shadow);width:min(300px,86vw)}
  #lib:not(.noside) .side-shade{display:block;position:absolute;inset:0;z-index:19;background:rgba(0,0,0,.35)}
  .ltitle{font-size:32px} .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:24px 16px}
  .quick{gap:10px} .qa{min-height:68px;padding:0 14px;font-size:14.5px} .sortsel{display:none}
}

/* ---------- editor (plovoucí tmavé lišty jako v Noteshelf) ---------- */
#editor{height:100%;position:relative;overflow:hidden}
#editor[hidden]{display:none}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:var(--desk)}
.stage canvas{position:absolute;left:0;top:0;touch-action:none}
.fbar{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:2px;padding:5px;background:var(--bar);color:var(--bar-ink);border-radius:12px;border:1px solid var(--bar-line);box-shadow:0 4px 18px rgba(20,24,40,.12);z-index:5}
.fbar .ib{color:var(--bar-ink);width:46px;height:46px}
.fbar .ib:hover{background:var(--bar-2)}
.fbar .ib[aria-pressed="true"]{background:var(--bar-2)}
.fbar .ib[aria-pressed="true"] svg{color:var(--tool-c,var(--bar-ink))}
.fbar .ib:disabled{opacity:.35}
.fl{left:max(12px,env(safe-area-inset-left,0px))}
.fr{right:max(12px,env(safe-area-inset-right,0px))}
.fc{left:50%;transform:translateX(-50%)}
@media (max-width:880px){.fc{top:calc(70px + env(safe-area-inset-top,0px))} .fbar .ib{width:42px;height:42px}}
.vpal{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);z-index:5;background:var(--bar);border-radius:28px;padding:10px 7px;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--bar-line);box-shadow:0 4px 18px rgba(20,24,40,.12)}
.vpal[hidden]{display:none}
.vdot{width:34px;height:34px;border-radius:50%;border:0;padding:0;flex:none}
.vdot{box-shadow:inset 0 0 0 1px rgba(20,24,40,.12)}
.vdot[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bar),0 0 0 5.5px var(--bar-ink)}
.vadd{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(20,24,40,.22);background:transparent;color:var(--bar-ink);display:grid;place-items:center;padding:0;flex:none}
.vadd svg{width:18px;height:18px}
.vsep{width:30px;height:1px;background:var(--bar-line);margin:2px 0;flex:none}
.vsz{width:44px;height:40px;border:0;background:transparent;border-radius:20px;display:grid;place-items:center;padding:0;flex:none}
.vsz i{display:block;width:22px;border-radius:3px;background:rgba(20,24,40,.45)}
.vsz[aria-pressed="true"]{background:var(--bar-ink)}
.vsz[aria-pressed="true"] i{background:var(--bar)}
@media (max-height:640px){.vdot,.vadd{width:28px;height:28px}.vsz{height:32px}.vpal{gap:6px}}
.pgchip{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
.pgchip.show{opacity:.92}
.sz{width:34px;height:42px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed="true"]{background:var(--accent-soft)}
.sz[aria-pressed="true"] i{background:var(--accent)}
.sep{width:1px;height:26px;background:var(--bar-line);margin:0 4px;flex:none}
#radial{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#radial .rg{transform-origin:0 0;animation:pop .16s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){#radial .rg{animation:none}}
.r-bg{fill:var(--surface);opacity:.55;filter:drop-shadow(0 10px 24px rgba(10,20,50,.28))}
.r-sec{fill:var(--surface);stroke:var(--line);stroke-width:1}
.r-sec.on{fill:var(--accent-soft)}
.r-sec.hot{fill:var(--accent)}
.r-ic{color:var(--ink)} .r-ic.on{color:var(--accent)} .r-ic.hot{color:var(--accent-ink)}
.r-ic path,.r-ic rect,.r-ic circle{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.r-col{stroke:var(--surface);stroke-width:2}
.r-col.on{stroke:var(--ink);stroke-width:3}
.r-dot{fill:var(--ink)}
.r-center{fill:var(--surface);stroke:var(--line)}
.r-center.hot{fill:var(--surface-2)}
.r-lab{fill:var(--ink)}
.r-labt{fill:var(--surface);font:600 12.5px var(--f-body)}
.selbar{position:absolute;display:flex;gap:2px;padding:4px;background:var(--bar);color:var(--bar-ink);border:1px solid var(--bar-line);border-radius:14px;box-shadow:var(--shadow);z-index:4;align-items:center}
.selbar .ib{width:38px;height:38px}
.selbar .ib{color:var(--bar-ink)} .selbar .ib:hover{background:var(--bar-2)}
.selbar .cdot{width:22px;height:22px;border-radius:50%;border:0;margin:0 3px;box-shadow:0 0 0 1.5px rgba(20,24,40,.18);flex:none;padding:0}
.selbar .ib.del{color:var(--danger)}
#ta{position:absolute;z-index:3;border:1.5px dashed var(--accent);background:transparent;outline:none;resize:none;overflow:hidden;padding:0;margin:0;line-height:1.3;white-space:pre-wrap;word-wrap:break-word;box-sizing:content-box}
.pages{position:absolute;top:0;right:0;bottom:0;width:240px;padding-top:env(safe-area-inset-top,0px);background:var(--surface);border-left:1px solid var(--line);z-index:6;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .2s ease;box-shadow:var(--shadow);padding-right:env(safe-area-inset-right,0px)}
.pages.open{transform:none}
.pages-head{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 16px;font:700 15px var(--f-display)}
.pages-head span{margin-right:auto}
.pages-list{flex:1;overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:14px}
.pg{display:flex;flex-direction:column;gap:6px;align-items:center}
.pg canvas{position:static;width:150px;height:auto;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 4px 12px rgba(18,28,56,.14);cursor:pointer;outline:2px solid transparent;outline-offset:3px}
.pg.cur canvas{outline-color:var(--accent)}
.pg-row{display:flex;align-items:center;gap:0}
.pg-row .ib{width:30px;height:30px;border-radius:8px}
.pg-row .ib svg{width:17px;height:17px}
.pg-row b{font-size:12px;color:var(--muted);width:26px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.pg-row .ib.marked{color:#E8A400}
.pages-foot{padding:10px 16px 14px;border-top:1px solid var(--line)}
.pages-foot .btn{width:100%;justify-content:center}
.brand{display:flex;align-items:center;gap:10px}
.only-m{display:none!important}
@media (max-width:760px){.only-m{display:flex!important}}
#app{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app input,#app textarea,#app select{user-select:text;-webkit-user-select:text}
.lib-main,.side,.pages-list,.modal-body{overscroll-behavior:contain}
.pop .sizes{display:flex}
.ib{width:42px;height:42px;border-radius:11px;border:0;background:transparent;display:grid;place-items:center;flex:none;position:relative}
.ib:hover{background:var(--surface-2)}
.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default}
.ib .dot{position:absolute;bottom:5px;right:7px;width:6px;height:6px;border-radius:50%}
@media (pointer:coarse){ .ib{width:46px;height:46px} .nav-it{height:46px} .menu button{padding:13px 12px} .chip{height:40px} }

/* ---------- popovery, dialogy, toast ---------- */
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;max-width:min(340px,calc(100vw - 24px));box-sizing:border-box}
.pop h4{margin:2px 2px 8px;font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pop .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pop .row:last-child{margin-bottom:0}
.cbtn{width:30px;height:30px;border-radius:50%;border:0;padding:0;box-shadow:0 0 0 1px var(--line)}
.cbtn[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.chip{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.menu{display:flex;flex-direction:column;min-width:230px;padding:4px}
.menu button{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:10px 10px;border-radius:10px;font-weight:500}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.menu button.danger{color:var(--danger)}
.modal-ov{position:fixed;inset:0;z-index:60;background:rgba(10,14,24,.42);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal h2{margin:0;padding:20px 22px 6px;font:700 19px var(--f-display);text-wrap:balance}
.modal-body{padding:10px 22px 6px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;line-height:1.5}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input[type=text],.field select{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font:inherit;padding:0 12px}
.field input[type=range]{width:100%}
.check{display:flex;align-items:center;gap:10px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.tpl{border:0;background:transparent;padding:0;display:flex;flex-direction:column;gap:5px;align-items:center;font-size:12px;font-weight:500}
.tpl canvas{width:100%;height:auto;border-radius:4px;box-shadow:0 0 0 1px var(--line);display:block}

/* ---------- matice ---------- */
const I=()=>[1,0,0,1,0,0];
const tf=(m,x,y)=>[m[0]*x+m[2]*y+m[4],m[1]*x+m[3]*y+m[5]];
const mul=(a,b)=>[a[0]*b[0]+a[2]*b[1],a[1]*b[0]+a[3]*b[1],a[0]*b[2]+a[2]*b[3],a[1]*b[2]+a[3]*b[3],a[0]*b[4]+a[2]*b[5]+a[4],a[1]*b[4]+a[3]*b[5]+a[5]];
const Tm=(x,y)=>[1,0,0,1,x,y];
const Rm=a=>{const c=Math.cos(a),s=Math.sin(a);return [c,s,-s,c,0,0];};
const Sm=s=>[s,0,0,s,0,0];
const about=(x,y,m)=>mul(Tm(x,y),mul(m,Tm(-x,-y)));
const isId=m=>Math.abs(m[0]-1)<1e-9&&Math.abs(m[1])<1e-9&&Math.abs(m[2])<1e-9&&Math.abs(m[3]-1)<1e-9&&Math.abs(m[4])<1e-6&&Math.abs(m[5])<1e-6;
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy);}
function inPoly(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}

function finalize(it){
  if(it.t==='s'){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of it.p){if(q[0]<x0)x0=q[0];if(q[1]<y0)y0=q[1];if(q[0]>x1)x1=q[0];if(q[1]>y1)y1=q[1];}const m=it.w*0.85+1;it.bb=[x0-m,y0-m,x1+m,y1+m];}
  return it;
}
function processPts(p){
  let pts=p;
  if(pts.length>3){const o=[pts[0]];for(let i=1;i<pts.length-1;i++){const a=pts[i-1],b=pts[i],c=pts[i+1];o.push([(a[0]+2*b[0]+c[0])/4,(a[1]+2*b[1]+c[1])/4,b[2]]);}o.push(pts[pts.length-1]);pts=o;}
  pts=densify(pts,2.5);
  return pts.map(q=>[Math.round(q[0]*100)/100,Math.round(q[1]*100)/100,Math.round(q[2]*1000)/1000]);
}
function densify(pts,step){const out=[];for(let i=0;i<pts.length;i++){const b=pts[i];if(i>0){const a=pts[i-1],d=dist(a,b);if(d>step){const n=Math.ceil(d/step);for(let k=1;k<n;k++){const t=k/n;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]);}}}out.push(b);}return out;}
function curveThrough(path,arr){for(let i=1;i<arr.length-1;i++){const a=arr[i],b=arr[i+1];path.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}const l=arr[arr.length-1];path.lineTo(l[0],l[1]);}
function pathOf(it){
  let p=pathCache.get(it); if(p) return p;
  p=new Path2D(); const pts=it.p, n=pts.length;
  if(it.k==='pen'){
    const inf=it.pi!=null?it.pi:(it.ps==='ball'?0.3:0.8);
    const rad=q=>Math.max(0.3,it.w/2*((1-inf)+inf*clamp(q[2],0.05,1)*1.5));
    if(n<2){const q=pts[0];p.arc(q[0],q[1],rad(q),0,Math.PI*2);}
    else{
      const r=pts.map(rad);for(let i=1;i<n-1;i++)r[i]=(r[i-1]+2*r[i]+r[i+1])/4;
      const L=[],R=[],A=[];
      for(let i=0;i<n;i++){const a=pts[Math.max(0,i-2)],b=pts[Math.min(n-1,i+2)];const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l,q=pts[i];L.push([q[0]+nx*r[i],q[1]+ny*r[i]]);R.push([q[0]-nx*r[i],q[1]-ny*r[i]]);A.push(Math.atan2(ny,nx));}
      p.moveTo(L[0][0],L[0][1]); curveThrough(p,L);
      p.arc(pts[n-1][0],pts[n-1][1],r[n-1],A[n-1],A[n-1]-Math.PI,true);
      curveThrough(p,R.slice().reverse());
      p.arc(pts[0][0],pts[0][1],r[0],A[0]+Math.PI,A[0],true);
      p.closePath();
    }
  }else{
    p.moveTo(pts[0][0],pts[0][1]);
    if(n===1)p.lineTo(pts[0][0]+0.01,pts[0][1]);
    else if(it.k==='sh'){for(let i=1;i<n;i++)p.lineTo(pts[i][0],pts[i][1]);}
    else curveThrough(p,pts);
  }
  pathCache.set(it,p); return p;
}
const fontOf=it=>`${it.i?'italic ':''}${it.b?'700 ':''}${it.s}px ${FONTS[it.f||'sans']}`;
function textLayout(it){
  let L=tlCache.get(it); if(L) return L;
  mctx.font=fontOf(it);
  const lines=[];
  for(const para of String(it.text||'').split('\n')){
    const words=para.split(/(\s+)/); let line='';
    for(const w of words){const test=line+w;if(mctx.measureText(test).width>it.w&&line.trim()){lines.push(line.trimEnd());line=w.trimStart();}else line=test;}
    lines.push(line);
  }
  const lh=it.s*1.3; L={lines,lh,h:Math.max(lh,lines.length*lh)}; tlCache.set(it,L); return L;
}
function getImg(src){let im=imgCache.get(src);if(!im){im=new Image();im.onload=()=>{pcache.clear();scheduleRender();if(pagesOpen())schedulePanel();};im.src=src;imgCache.set(src,im);}return im;}
function itemH(it){return it.t==='x'?textLayout(it).h:it.h;}
function getBounds(it){
  if(it.t==='s') return it.bb;
  const h=itemH(it), r=it.r||0;
  if(it.t==='x'&&it.bg){const pd=it.s*0.6;if(!r)return [it.x-pd,it.y-pd,it.x+it.w+pd,it.y+h+pd];}
  if(!r) return [it.x,it.y,it.x+it.w,it.y+h];
  const cx=it.x+it.w/2, cy=it.y+h/2, m=about(cx,cy,Rm(r));
  const cs=[[it.x,it.y],[it.x+it.w,it.y],[it.x+it.w,it.y+h],[it.x,it.y+h]].map(q=>tf(m,q[0],q[1]));
  return [Math.min(...cs.map(c=>c[0])),Math.min(...cs.map(c=>c[1])),Math.max(...cs.map(c=>c[0])),Math.max(...cs.map(c=>c[1]))];
}
function drawItem(c,it,page){
  if(it.t==='s'){
    if(it.k==='pen'){c.fillStyle=it.c;c.fill(pathOf(it));return;}
    c.save();
    if(it.k==='hl'){c.globalAlpha=0.42;if(!isDark(page))c.globalCompositeOperation='multiply';}
    if(it.fl){c.save();c.globalAlpha=0.2;c.fillStyle=it.c;c.fill(pathOf(it));c.restore();}
    if(it.da)c.setLineDash([it.w*3,it.w*2.4]);
    c.strokeStyle=it.c;c.lineWidth=it.w;c.lineCap='round';c.lineJoin='round';c.stroke(pathOf(it));c.restore();
  }else if(it.t==='x'){
    const L=textLayout(it); c.save();
    if(it.r){const cx=it.x+it.w/2,cy=it.y+L.h/2;c.translate(cx,cy);c.rotate(it.r);c.translate(-cx,-cy);}
    if(it.bg){const pd=it.s*0.6,x=it.x-pd,y=it.y-pd,w=it.w+pd*2,h=L.h+pd*2;
      c.save();c.shadowColor='rgba(20,30,50,.18)';c.shadowBlur=14;c.shadowOffsetY=4;c.fillStyle=it.bg;c.beginPath();c.moveTo(x,y);c.lineTo(x+w,y);c.lineTo(x+w,y+h-pd*1.2);c.lineTo(x+w-pd*1.2,y+h);c.lineTo(x,y+h);c.closePath();c.fill();c.restore();
      c.fillStyle='rgba(0,0,0,.08)';c.beginPath();c.moveTo(x+w,y+h-pd*1.2);c.lineTo(x+w-pd*1.2,y+h-pd*1.2);c.lineTo(x+w-pd*1.2,y+h);c.closePath();c.fill();}
    c.font=fontOf(it);c.fillStyle=it.c;c.textBaseline='top';
    L.lines.forEach((ln,i)=>c.fillText(ln,it.x,it.y+i*L.lh+(L.lh-it.s)/2));
    c.restore();
  }else if(it.t==='i'){
    const im=getImg(it.src); c.save();
    const cx=it.x+it.w/2,cy=it.y+it.h/2;
    if(it.r){c.translate(cx,cy);c.rotate(it.r);c.translate(-cx,-cy);}
    c.imageSmoothingQuality='high';if(im.complete&&im.naturalWidth)c.drawImage(im,it.x,it.y,it.w,it.h);else{c.fillStyle='rgba(120,130,150,.15)';c.fillRect(it.x,it.y,it.w,it.h);}
    c.restore();
  }
}
function drawTemplate(c,p){
  const dark=isDark(p), w=p.w, h=p.h;
  const line=dark?'rgba(255,255,255,.15)':'rgba(60,100,170,.27)';
  c.save();c.lineWidth=1.2;c.strokeStyle=line;c.fillStyle=line;
  const ruled=(gap,from)=>{c.beginPath();for(let y=from;y<h-40;y+=gap){c.moveTo(0,y);c.lineTo(w,y);}c.stroke();};
  switch(p.tpl){
    case 'lined': case 'narrow':{ruled(p.tpl==='lined'?40:30,150);c.strokeStyle=dark?'rgba(255,120,120,.32)':'rgba(220,70,70,.42)';c.beginPath();c.moveTo(100,0);c.lineTo(100,h);c.stroke();break;}
    case 'grid':{c.lineWidth=1;c.beginPath();for(let x=40;x<w;x+=40){c.moveTo(x,0);c.lineTo(x,h);}for(let y=40;y<h;y+=40){c.moveTo(0,y);c.lineTo(w,y);}c.stroke();break;}
    case 'dots':{c.beginPath();for(let x=40;x<w;x+=40)for(let y=40;y<h;y+=40){c.moveTo(x+1.9,y);c.arc(x,y,1.9,0,Math.PI*2);}c.fill();break;}
    case 'cornell':{ruled(40,160);c.lineWidth=2.2;c.beginPath();c.moveTo(0,120);c.lineTo(w,120);c.moveTo(270,120);c.lineTo(270,h-290);c.moveTo(0,h-290);c.lineTo(w,h-290);c.stroke();break;}
    case 'todo':{ruled(50,150);c.lineWidth=1.6;for(let y=150;y<h-60;y+=50){c.strokeRect(60,y-33,22,22);}break;}
    case 'math':{const g=PW/210*5;c.lineWidth=0.9;c.beginPath();for(let x=g;x<w;x+=g){c.moveTo(x,0);c.lineTo(x,h);}for(let y=g;y<h;y+=g){c.moveTo(0,y);c.lineTo(w,y);}c.stroke();break;}
    case 'mm':{const m=PW/210,col=dark?'255,180,120':'230,120,60';[[1,.09,.45],[5,.2,.7],[10,.34,1.1]].forEach(([st,al,lw])=>{c.strokeStyle=`rgba(${col},${al})`;c.lineWidth=lw;c.beginPath();for(let i=st;i*m<w;i+=st){c.moveTo(i*m,0);c.lineTo(i*m,h);}for(let i=st;i*m<h;i+=st){c.moveTo(0,i*m);c.lineTo(w,i*m);}c.stroke();});break;}
    case 'timetable':{const txt=dark?'rgba(255,255,255,.55)':'rgba(40,60,110,.62)';const x0=50,y0=120,hw=110,hh=60,cols=8,rows=5,cw=(w-x0*2-hw)/cols,rh=Math.min(200,(h-y0-80-hh)/rows);
      c.lineWidth=1.4;c.beginPath();for(let i=0;i<=cols;i++){const x=x0+hw+i*cw;c.moveTo(x,y0);c.lineTo(x,y0+hh+rows*rh);}c.moveTo(x0,y0);c.lineTo(x0,y0+hh+rows*rh);
      for(let j=0;j<=rows+1;j++){const y=j===0?y0:y0+hh+(j-1)*rh;c.moveTo(x0,y);c.lineTo(x0+hw+cols*cw,y);}c.stroke();
      c.fillStyle=txt;c.textAlign='center';c.textBaseline='middle';const T0=['8:00','8:55','10:00','10:55','11:50','12:45','13:40','14:35'];
      for(let i=0;i<cols;i++){c.font='600 22px Inter, sans-serif';c.fillText((i+1)+'.',x0+hw+i*cw+cw/2,y0+hh/2-9);c.font='13px Inter, sans-serif';c.fillText(T0[i],x0+hw+i*cw+cw/2,y0+hh/2+14);}
      c.font='600 22px Inter, sans-serif';['Po','Út','St','Čt','Pá'].forEach((d,j)=>c.fillText(d,x0+hw/2,y0+hh+j*rh+rh/2));
      c.font='600 30px Lora, Georgia, serif';c.textAlign='left';c.fillText('Rozvrh hodin',x0,64);break;}
    case 'week':{const txt=dark?'rgba(255,255,255,.55)':'rgba(40,60,110,.62)';const x0=50,y0=110,gw=w-100,bh=(h-y0-60)/4,bw=gw/2;
      c.lineWidth=1.4;const D=['Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota','Neděle','Poznámky'];
      D.forEach((d,k)=>{const x=x0+(k%2)*bw,y=y0+Math.floor(k/2)*bh;c.strokeRect(x,y,bw,bh);c.fillStyle=txt;c.font='600 20px Inter, sans-serif';c.textAlign='left';c.textBaseline='top';c.fillText(d,x+14,y+12);
        c.beginPath();for(let ly=y+80;ly<y+bh-10;ly+=40){c.moveTo(x+14,ly);c.lineTo(x+bw-14,ly);}c.stroke();});
      c.font='600 30px Lora, Georgia, serif';c.textBaseline='middle';c.fillText('Týden',x0,64);c.font='18px Inter, sans-serif';c.textAlign='right';c.fillText('od ____________  do ____________',x0+gw,64);break;}
    case 'music':{c.beginPath();for(let y0=140;y0<h-110;y0+=120){for(let k=0;k<5;k++){const y=y0+k*13;c.moveTo(60,y);c.lineTo(w-60,y);}}c.stroke();break;}
  }
  c.restore();
}
function drawPage(c,p,opt={}){
  c.save();c.beginPath();c.rect(0,0,p.w,p.h);c.clip();
  c.fillStyle=PAPERS[p.paper]||'#fff';c.fillRect(0,0,p.w,p.h);
  if(p.bg){const im=getImg(p.bg);c.imageSmoothingQuality='high';if(im.complete&&im.naturalWidth)c.drawImage(im,0,0,p.w,p.h);}
  drawTemplate(c,p);
  const v=opt.vis, ex=opt.exclude, ed=opt.editId;
  const list=T.hl.behind!==false?p.items.filter(i=>i.k==='hl').concat(p.items.filter(i=>i.k!=='hl')):p.items;
  for(const it of list){
    if(ex&&ex.has(it.id))continue; if(ed&&it.id===ed)continue;
    if(v){const b=getBounds(it);if(b[2]<v[0]||b[0]>v[2]||b[3]<v[1]||b[1]>v[3])continue;}
    drawItem(c,it,p);
  }
  c.restore();
}

/* ---------- rozpoznání tvarů ---------- */
function rdp(pts,eps){if(pts.length<3)return pts.slice();let md=0,mi=0;const a=pts[0],b=pts[pts.length-1];for(let i=1;i<pts.length-1;i++){const d=distSeg(pts[i][0],pts[i][1],a[0],a[1],b[0],b[1]);if(d>md){md=d;mi=i;}}if(md>eps){const l=rdp(pts.slice(0,mi+1),eps),r=rdp(pts.slice(mi),eps);return l.slice(0,-1).concat(r);}return [a,b];}
function poly2pts(vs,closed){const arr=vs.map(v=>[v[0],v[1],0.5]);if(closed)arr.push([vs[0][0],vs[0][1],0.5]);return densify(arr,4);}
function ellipsePts(cx,cy,rx,ry){const o=[];for(let i=0;i<=96;i++){const a=i/96*Math.PI*2;o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry,0.5]);}return o;}
function genShape(kind,a,b){
  const x0=Math.min(a[0],b[0]),y0=Math.min(a[1],b[1]),x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]);
  switch(kind){
    case 'line':return poly2pts([a,b]);
    case 'arrow':{const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),L=Math.min(36,Math.max(12,dist(a,b)*0.25));const h1=[b[0]-L*Math.cos(ang-0.45),b[1]-L*Math.sin(ang-0.45)],h2=[b[0]-L*Math.cos(ang+0.45),b[1]-L*Math.sin(ang+0.45)];return poly2pts([a,b,h1,b,h2]);}
    case 'rect':return poly2pts([[x0,y0],[x1,y0],[x1,y1],[x0,y1]],true);
    case 'ellipse':return ellipsePts((x0+x1)/2,(y0+y1)/2,(x1-x0)/2,(y1-y0)/2);
    case 'triangle':return poly2pts([[(x0+x1)/2,y0],[x1,y1],[x0,y1]],true);
  }
  return null;
}
function recognize(raw){
  if(raw.length<4)return null;
  const P=raw.map(q=>[q[0],q[1]]), n=P.length;
  let len=0;for(let i=1;i<n;i++)len+=dist(P[i-1],P[i]);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of P){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1]);}
  const diag=Math.hypot(x1-x0,y1-y0); if(diag<14)return null;
  const a=P[0], b=P[n-1];
  const closed=dist(a,b)<Math.max(22,diag*0.24)&&len>diag*1.5;
  if(!closed){
    if(dist(a,b)/len>0.9){
      let e=b.slice();const ang=Math.atan2(e[1]-a[1],e[0]-a[0]),L=dist(a,e),sn=Math.round(ang/(Math.PI/4))*(Math.PI/4);
      if(Math.abs(ang-sn)<0.1)e=[a[0]+Math.cos(sn)*L,a[1]+Math.sin(sn)*L];
      return poly2pts([a,e]);
    }
    const s=rdp(P,diag*0.08);
    if(s.length===3&&dist(s[0],s[1])>dist(s[1],s[2])*2.2){const q=s[1];const r=rdp(P.slice(P.findIndex(v=>v===q)),diag*0.06);if(r.length<=3)return genShape('arrow',s[0],q);}
    return null;
  }
  const cx=(x0+x1)/2,cy=(y0+y1)/2,rx=Math.max(1,(x1-x0)/2),ry=Math.max(1,(y1-y0)/2);
  let err=0;for(const q of P)err+=Math.abs(Math.hypot((q[0]-cx)/rx,(q[1]-cy)/ry)-1);err/=n;
  let s=rdp(P,diag*0.075); s=s.slice(0,-1);
  let changed=true;
  while(changed&&s.length>3){changed=false;for(let i=0;i<s.length;i++){const p0=s[(i-1+s.length)%s.length],p1=s[i],p2=s[(i+1)%s.length];const a1=Math.atan2(p1[1]-p0[1],p1[0]-p0[0]),a2=Math.atan2(p2[1]-p1[1],p2[0]-p1[0]);let d=Math.abs(a2-a1);if(d>Math.PI)d=2*Math.PI-d;if(d<0.42||dist(p0,p1)<diag*0.07){s.splice(i,1);changed=true;break;}}}
  if(err<0.1&&s.length>=4&&!(s.length===4&&err>0.06))return ellipsePts(cx,cy,rx,ry);
  if(s.length===3)return poly2pts(s,true);
  if(s.length===4){
    let axis=true;for(let i=0;i<4;i++){const p0=s[i],p1=s[(i+1)%4];const ang=Math.abs(Math.atan2(p1[1]-p0[1],p1[0]-p0[0]))%(Math.PI/2);if(Math.min(ang,Math.PI/2-ang)>0.22)axis=false;}

   ========================================================= */
const pageById=id=>nb.pages.find(p=>p.id===id);

function onLong(elm,fn){
  let t=0,fired=false,x0=0,y0=0;
  elm.addEventListener('pointerdown',e=>{fired=false;x0=e.clientX;y0=e.clientY;clearTimeout(t);t=setTimeout(()=>{fired=true;vibrate(10);fn(elm);},520);});
  elm.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-x0,e.clientY-y0)>10)clearTimeout(t);});

      path.slice(0,-1).forEach(x=>{cr.append(el('span',{},'›'));const b=el('button',{},esc(x.name));b.onclick=()=>goView('folder',x.id);cr.append(b);});
      folders=lib.folders.filter(x=>x.parent===f.id);list=live.filter(n=>n.folder===f.id);empty='Složka je prázdná. Vytvořte v ní sešit, nebo sem přesuňte existující (podržte sešit → Přesunout do složky).';break;}

  }

    else qk.append(qa('quick','Rychlá poznámka','#F5C518',quickNote),qa('book','Sešit','#3EC3DB',newNotebook),qa('table','Tabulka (Excel)','#2FA36B',newSheetDoc),qa('down','Importovat soubor','var(--accent-2)',importAny),qa('folderPlus','Nová složka','var(--accent)',()=>editFolder()));}

function folderCard(f){

let FN_EN2CS=null,FN_CS2EN=null;
function fnMaps(){if(FN_EN2CS)return;const d=window.HyperFormula.languages.csCZ.functions;FN_EN2CS={};FN_CS2EN={};for(const k in d){FN_EN2CS[k.toUpperCase()]=d[k];FN_CS2EN[d[k].toUpperCase()]=k;}}
function xlTranslate(f,toCs){
  fnMaps();let out='',i=0;const n=f.length;
  while(i<n){
    const ch=f[i];
    if(ch==='"'){let j=i+1;while(j<n){if(f[j]==='"'){if(f[j+1]==='"'){j+=2;continue;}break;}j++;}out+=f.slice(i,j+1);i=j+1;continue;}
    if(ch==="'"){let j=f.indexOf("'",i+1);if(j<0)j=n-1;out+=f.slice(i,j+1);i=j+1;continue;}
    const rest=f.slice(i),m=/^[A-Za-z_À-ſ][A-Za-z0-9_.À-ſ]*/.exec(rest);
    if(m){const w=m[0];if(f[i+w.length]==='('){const up=w.toUpperCase().replace(/^_XLFN\./,'').replace(/^_XLWS\./,'');out+=(toCs?FN_EN2CS[up]:FN_CS2EN[up])||up;}else out+=w;i+=w.length;continue;}
    if(/[0-9]/.test(ch)){const m2=(toCs?/^\d+(\.\d+)?([eE][-+]?\d+)?/:/^\d+(,\d+)?([eE][-+]?\d+)?/).exec(rest);out+=toCs?m2[0].replace('.',','):m2[0].replace(',','.');i+=m2[0].length;continue;}
    out+=toCs&&ch===','?';':(!toCs&&ch===';'?',':ch);i++;
  }
  return out;
}

/* ---------- zobrazení hodnot ---------- */
function xlFmtVal(v,f,dt){
  if(v===null||v===undefined||v==='')return '';
  if(typeof v==='object')return v.value||'#CHYBA';
  if(typeof v==='boolean')return v?'PRAVDA':'NEPRAVDA';
  if(typeof v==='number'){
    let nf=f&&f.nf;const dp=f&&f.dp!=null?f.dp:null;
    if(!nf){if(dt==='NUMBER_DATE')nf='date';else if(dt==='NUMBER_PERCENT')nf='pct';else if(dt==='NUMBER_CURRENCY')nf='czk';else if(dt==='NUMBER_TIME')nf='time';else if(dt==='NUMBER_DATETIME')nf='datetime';}
    const loc=(x,d)=>x.toLocaleString('cs-CZ',{minimumFractionDigits:d,maximumFractionDigits:d});
    switch(nf){
      case 'num2':return loc(v,dp??2);
      case 'int':return loc(v,0);
      case 'pct':return loc(v*100,dp??0)+' %';
      case 'czk':return loc(v,dp??2)+' Kč';
      case 'date':case 'datetime':{try{const d=XL.hf.numberToDate(v);let s=`${d.day}. ${d.month}. ${d.year}`;if(nf==='datetime'){const t=XL.hf.numberToTime(v%1);s+=` ${t.hours}:${String(t.minutes).padStart(2,'0')}`;}return s;}catch(e){return String(v);}}
      case 'time':{try{const t=XL.hf.numberToTime(v%1);return `${t.hours}:${String(t.minutes).padStart(2,'0')}`;}catch(e){return String(v);}}
    }
    if(dp!=null)return loc(v,dp);
    const a=Math.abs(v);if(a!==0&&(a>=1e11||a<1e-9))return v.toExponential(4).replace('.',',');
    return Number(v.toPrecision(11)).toLocaleString('cs-CZ',{maximumFractionDigits:10,useGrouping:false});
  }
  return String(v);
}
function rawText(r,c){
  const s=XL.hf.getCellSerialized(A(r,c));
  if(s===null||s===undefined)return '';
  if(typeof s==='number')return String(s).replace('.',',');
  if(typeof s==='boolean')return s?'PRAVDA':'NEPRAVDA';
  return String(s);
}
function parseInput(raw){
  const s=String(raw==null?'':raw);if(s==='')return {val:null};if(s[0]==='=')return {val:s};
  const t=s.trim(),num=x=>parseFloat(x.replace(/[\s ]/g,'').replace(',','.'));
  let m=t.match(/^(-?[\d\s ]*\d(?:,\d+)?)\s?%$/);if(m)return {val:num(m[1])/100,nf:'pct'};
  m=t.match(/^(-?[\d\s ]*\d(?:,\d+)?)\s?(Kč|,-)$/i);if(m)return {val:num(m[1]),nf:'czk'};
  if(/^-?\d{1,3}([\s ]\d{3})+(,\d+)?$/.test(t))return {val:num(t)};
  if(/^-?\d+,\d+$/.test(t))return {val:num(t)};
  if(/^pravda$/i.test(t))return {val:true};if(/^nepravda$/i.test(t))return {val:false};
  return {val:s};
}

function xlRowHtml(r,cols,frozen){
  const sh=SH(),id=sid(),s=selN(),fz=sh.fz||{r:0,c:0};
  let h=`<div class="xr${frozen?' xr-fz':''}" style="${frozen?'':`top:${XL.CH+r*XL.RH}px;`}width:${XL.xs[sh.cols]}px"><div class="xrh${r>=s.r1&&r<=s.r2?' on':''}" data-r="${r}" style="width:${XL.HW}px">${r+1}</div>`;

function fillTo(tr,tc){
  const s=selN(),sh=sid(),F=SH().fmt,fmtBefore=JSON.stringify(F);
  const dDown=tr-s.r2,dUp=s.r1-tr,dRight=tc-s.c2,dLeft=s.c1-tc;
  const vmax=Math.max(dDown,dUp,0),hmax=Math.max(dRight,dLeft,0);
  if(!vmax&&!hmax)return;
  const vert=vmax>=hmax,ops=[],get=(r,c)=>XL.hf.getCellSerialized({sheet:sh,row:r,col:c});
  const series=src=>{if(src.length<2||!src.every(v=>typeof v==='number'))return null;const st=src[1]-src[0];return src.every((v,i)=>i===0||Math.abs(v-src[i-1]-st)<1e-9)?st:null;};
  const copyOp=(r1,c1,r2,c2,tr_,tc_)=>()=>{XL.hf.copy({start:{sheet:sh,row:r1,col:c1},end:{sheet:sh,row:r2,col:c2}});XL.hf.paste({sheet:sh,row:tr_,col:tc_});};
  if(vert){
    const h=s.r2-s.r1+1,down=dDown>0;
    if(down)for(let r=s.r2+1;r<=tr;r+=h){const cnt=Math.min(h,tr-r+1);ops.push(copyOp(s.r1,s.c1,s.r1+cnt-1,s.c2,r,s.c1));}
    else for(let end=s.r1-1;end>=tr;end-=h){const start=Math.max(tr,end-h+1),cnt=end-start+1;ops.push(copyOp(s.r2-cnt+1,s.c1,s.r2,s.c2,start,s.c1));}
    for(let c=s.c1;c<=s.c2;c++){const src=[];for(let r=s.r1;r<=s.r2;r++)src.push(get(r,c));const st=series(src);
      if(st!==null){const vals=[];if(down)for(let k=1;k<=tr-s.r2;k++)vals.push([src[h-1]+st*k]);else for(let r=tr;r<s.r1;r++)vals.push([src[0]-st*(s.r1-r)]);
        ops.push(()=>XL.hf.setCellContents({sheet:sh,row:down?s.r2+1:tr,col:c},vals));}
      const rows=down?range(s.r2+1,tr):range(tr,s.r1-1);rows.forEach(r=>{const off=down?(r-s.r2-1)%h:(h-1-((s.r1-1-r)%h));const sf=F[(s.r1+off)+','+c];if(sf)F[r+','+c]=Object.assign({},sf);else delete F[r+','+c];});}
    if(down){XL.sel.r=s.r1;XL.sel.r2=tr;}else{XL.sel.r=tr;XL.sel.r2=s.r2;}XL.sel.c=s.c1;XL.sel.c2=s.c2;
  }else{

    else for(let end=s.c1-1;end>=tc;end-=w){const start=Math.max(tc,end-w+1),cnt=end-start+1;ops.push(copyOp(s.r1,s.c2-cnt+1,s.r2,s.c2,s.r1,start));}
    for(let r=s.r1;r<=s.r2;r++){const src=[];for(let c=s.c1;c<=s.c2;c++)src.push(get(r,c));const st=series(src);
      if(st!==null){const row=[];if(right)for(let k=1;k<=tc-s.c2;k++)row.push(src[w-1]+st*k);else for(let c=tc;c<s.c1;c++)row.push(src[0]-st*(s.c1-c));
        ops.push(()=>XL.hf.setCellContents({sheet:sh,row:r,col:right?s.c2+1:tc},[row]));}
      const cols=right?range(s.c2+1,tc):range(tc,s.c1-1);cols.forEach(c=>{const off=right?(c-s.c2-1)%w:(w-1-((s.c1-1-c)%w));const sf=F[r+','+(s.c1+off)];if(sf)F[r+','+c]=Object.assign({},sf);else delete F[r+','+c];});}
    if(right){XL.sel.c=s.c1;XL.sel.c2=tc;}else{XL.sel.c=tc;XL.sel.c2=s.c2;}XL.sel.r=s.r1;XL.sel.r2=s.r2;
  }

  XL.undo.push({hf:true,n:ops.length,sheet:XL.sheet,fmt:fmtBefore,colW:JSON.stringify(SH().colW),rows:SH().rows,cols:SH().cols});XL.redo=[];xlUndoUI();
  ops.forEach(f=>f());xlChanged();xlRender();
}

  SH().fmt=out;

}

function xlSort(asc){

  if(s.r2>s.r1){r1=s.r1;r2=s.r2;c1=s.c1;c2=s.c2;}else{r1=0;r2=dim.height-1;c1=0;c2=dim.width-1;const h=XL.hf.getCellValue({sheet:id,row:0,col:key});const b=XL.hf.getCellValue({sheet:id,row:1,col:key});if(typeof h==='string'&&typeof b!=='string')r1=1;}

  const cmp=(a,b)=>{const x=a.k,y=b.k;if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;if(typeof x==='number'&&typeof y==='number')return asc?x-y:y-x;const r=String(x).localeCompare(String(y),'cs',{numeric:true});return asc?r:-r;};

function autoSum(){
  xlCommit();const s=selN(),id=sid();
  const isNum=(r,c)=>typeof XL.hf.getCellValue({sheet:id,row:r,col:c})==='number';
  if(s.r1===s.r2&&s.c1===s.c2){
    const r=s.r1,c=s.c1;let a=r-1;while(a>=0&&isNum(a,c))a--;
    if(a<r-1){xlStartEdit(`=SUMA(${aName(a+1,c)}:${aName(r-1,c)})`);return;}
    let b=c-1;while(b>=0&&isNum(r,b))b--;
    xlStartEdit(b<c-1?`=SUMA(${aName(r,b+1)}:${aName(r,c-1)})`:'=SUMA()');return;
  }
  xlSnap(true);XL.hf.batch(()=>{for(let c=s.c1;c<=s.c2;c++)XL.hf.setCellContents({sheet:id,row:s.r2+1,col:c},[[`=SUMA(${aName(s.r1,c)}:${aName(s.r2,c)})`]]);});
  xlChanged();xlSelect(s.r2+1,s.c1);
}

function insertFn(name){

async function xlChart(){
  xlCommit();const s=selN();
  if(s.r1===s.r2&&s.c1===s.c2){toast('Nejdřív označte data – tažením perem přes buňky.');return;}
  try{await loadScript(CHART_URL);}catch(e){toast('Graf se nepodařilo načíst. Zkontrolujte připojení.');return;}
  const id=sid(),val=(r,c)=>XL.hf.getCellValue({sheet:id,row:r,col:c});
  let hdr=true;for(let c=s.c1;c<=s.c2;c++){const v=val(s.r1,c);if(typeof v==='number')hdr=false;}
  let lab=true;for(let r=s.r1+(hdr?1:0);r<=s.r2;r++){const v=val(r,s.c1);if(typeof v==='number')lab=false;}
  if(s.c1===s.c2)lab=false;
  const rs=hdr?s.r1+1:s.r1,cs=lab?s.c1+1:s.c1,labels=[],sets=[];
  for(let r=rs;r<=s.r2;r++)labels.push(lab?xlFmtVal(val(r,s.c1),SH().fmt[r+','+s.c1],null):String(r-rs+1));
  const COL=['#1E7145','#2D5BD3','#D9822B','#B23A48','#6C4AB6','#3A86A8','#C2255C','#8A6D3B'];
  for(let c=cs;c<=s.c2;c++){const d=[];for(let r=rs;r<=s.r2;r++){const v=val(r,c);d.push(typeof v==='number'?v:null);}sets.push({label:hdr?String(val(s.r1,c)??colName(c)):colName(c),data:d,backgroundColor:COL[(c-cs)%COL.length],borderColor:COL[(c-cs)%COL.length],borderWidth:2});}
  let chart=null,type='bar';
  const ink=getComputedStyle(document.body).getPropertyValue('--ink').trim()||'#222',line=getComputedStyle(document.body).getPropertyValue('--line').trim()||'#ddd';
  const build=cv=>{if(chart)chart.destroy();const pie=type==='pie'||type==='doughnut';
    const ds=sets.map(x=>Object.assign({},x,pie?{backgroundColor:labels.map((_,i)=>COL[i%COL.length]),borderColor:'#fff'}:{},type==='line'?{backgroundColor:x.borderColor,tension:.25}:{}));
    chart=new window.Chart(cv,{type,data:{labels,datasets:pie?ds.slice(0,1):ds},options:{responsive:false,animation:false,plugins:{legend:{labels:{color:ink}}},scales:pie?{}:{x:{ticks:{color:ink},grid:{color:line}},y:{ticks:{color:ink},grid:{color:line}}}}});};
  await modal('Graf z označených dat',b=>{
    const cv=el('canvas',{width:'640',height:'360'});cv.style.cssText='width:100%;height:auto;max-width:640px;background:var(--surface)';
    chips(b,[['bar','Sloupcový'],['line','Spojnicový'],['pie','Koláčový'],['doughnut','Prstencový']],type,v=>{type=v;build(cv);});
    b.append(cv);setTimeout(()=>build(cv),0);
    const sv=el('button',{class:'btn'},ic('down')+'Uložit jako obrázek');sv.onclick=()=>cv.toBlob(bl=>saveFile(safeName(XL.doc.title)+' - graf.png',bl),'image/png');
    const ins=el('button',{class:'btn'},ic('image')+'Vložit graf do listu');ins.onclick=()=>{const c2=document.createElement('canvas');c2.width=cv.width;c2.height=cv.height;const g2=c2.getContext('2d');g2.fillStyle=getComputedStyle(document.body).getPropertyValue('--surface').trim()||'#fff';g2.fillRect(0,0,c2.width,c2.height);g2.drawImage(cv,0,0);xlAddImg(c2.toDataURL('image/png'),c2.width,c2.height,{x:XL.xs[Math.min(s.c2+1,XL.xs.length-1)]+24,y:XL.CH+s.r1*XL.RH});closeTop();};
    const row=el('div');row.style.cssText='display:flex;gap:8px;flex-wrap:wrap';row.append(sv,ins);b.append(row);
  },[{label:'Zavřít',cls:'primary',value:true}]);

let xlImgSel=null;
function xlImgs(){
  const box=$('#xlImgs');if(!box||!XL.doc)return;box.replaceChildren();const L=SH().imgs||[];
  L.forEach(o=>{
    const d=el('div',{class:'xl-img'+(xlImgSel===o.id?' on':'')});d.style.cssText=`left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px`;
    d.append(el('img',{src:o.src,alt:'',draggable:'false'}));
    if(xlImgSel===o.id){
      const h=el('i',{class:'xl-img-h','aria-label':'Změnit velikost'});
      const bar=el('div',{class:'xl-img-bar'});
      const mk=(i,l,fn,cls='')=>{const b=el('button',{class:'ib '+cls,'aria-label':l,title:l},ic(i));b.addEventListener('pointerdown',e=>e.stopPropagation());b.onclick=e=>{e.stopPropagation();fn();};bar.append(b);};
      mk('front','Do popředí',()=>{xlSnap(false);SH().imgs=L.filter(x=>x!==o).concat([o]);xlImgs();xlChanged();});
      mk('dup','Duplikovat',()=>{xlSnap(false);const n=Object.assign({},o,{id:uid(),x:o.x+24,y:o.y+24});SH().imgs=L.concat([n]);xlImgSel=n.id;xlImgs();xlChanged();});
      mk('down','Uložit obrázek',async()=>{const b=await (await fetch(o.src)).blob();saveFile(safeName(XL.doc.title)+' - obrazek.'+(b.type.split('/')[1]||'png'),b);});
      mk('trash','Smazat',()=>{xlSnap(false);SH().imgs=L.filter(x=>x!==o);xlImgSel=null;xlImgs();xlChanged();},'del');
      d.append(h,bar);
      h.addEventListener('pointerdown',e=>xlImgDrag(e,o,d,'size'));
    }
    d.addEventListener('pointerdown',e=>{if(e.target.closest('.xl-img-bar,.xl-img-h'))return;xlImgDrag(e,o,d,'move');});
    box.append(d);});
}
function xlImgDrag(e,o,d,mode){
  e.stopPropagation();e.preventDefault();xlCommit&&xlCommit();
  const wasSel=xlImgSel===o.id;const x0=e.clientX,y0=e.clientY,ox=o.x,oy=o.y,ow=o.w,oh=o.h,ratio=o.h/o.w;let moved=false;
  if(!wasSel){xlImgSel=o.id;xlImgs();d=[...$('#xlImgs').children][(SH().imgs||[]).indexOf(o)];}
  const tgt=window;
  const mv=ev=>{if(ev.pointerId!==e.pointerId)return;const dx=ev.clientX-x0,dy=ev.clientY-y0;
    if(!moved&&Math.hypot(dx,dy)<4)return;if(!moved){moved=true;xlSnap(false);}
    if(mode==='move'){o.x=Math.max(XL.HW,ox+dx);o.y=Math.max(XL.CH,oy+dy);}else{o.w=Math.max(40,ow+dx);o.h=ev.shiftKey?Math.max(30,oh+dy):o.w*ratio;}
    if(d){d.style.left=o.x+'px';d.style.top=o.y+'px';d.style.width=o.w+'px';d.style.height=o.h+'px';}};
  const up=ev=>{if(ev.pointerId!==e.pointerId)return;tgt.removeEventListener('pointermove',mv);tgt.removeEventListener('pointerup',up);tgt.removeEventListener('pointercancel',up);if(moved){xlImgs();xlChanged();}};
  tgt.addEventListener('pointermove',mv);tgt.addEventListener('pointerup',up);tgt.addEventListener('pointercancel',up);
}
function xlAddImg(src,w,h,pos){
  const g=grid(),k=Math.min(1,380/w,300/h);
  const o={id:uid(),src,x:g.scrollLeft+XL.HW+24,y:g.scrollTop+XL.CH+(SH().fz&&SH().fz.r?SH().fz.r*XL.RH:0)+24,w:Math.round(w*k),h:Math.round(h*k)};if(pos){o.x=pos.x;o.y=pos.y;}
  xlSnap(false);SH().imgs=(SH().imgs||[]).concat([o]);xlImgSel=o.id;xlImgs();xlChanged();toast('Obrázek vložen – táhnutím ho přesunete, za roh zvětšíte');
}
async function xlInsertImage(file){
  try{const url=await readFile(file);const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const k=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const src=/png|gif|webp/.test(file.type)&&c.width*c.height<1.2e6?c.toDataURL('image/png'):c.toDataURL('image/jpeg',0.88);
    xlAddImg(src,c.width,c.height);
  }catch(e){toast('Obrázek se nepodařilo načíst.');}

function hwSize(){const c=$('#hwC'),r=c.getBoundingClientRect();if(!r.width)return;const d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);hwDraw();}
function hwDraw(){

  const W2=c.width/d,H2=c.height/d;g.strokeStyle='rgba(30,113,69,.25)';g.setLineDash([6,6]);g.lineWidth=1;g.beginPath();g.moveTo(16,H2*0.68);g.lineTo(W2-16,H2*0.68);g.stroke();g.setLineDash([]);

function hwImage(){

document.addEventListener('keydown',e=>{
  if($('#sheet').hidden||!XL.doc||e.target.closest('input,textarea,select,.modal-ov'))return;
  const k=e.key,mod=e.ctrlKey||e.metaKey,s=XL.sel;
  if(mod){const l=k.toLowerCase();
    if(l==='z'){e.preventDefault();e.shiftKey?xlRedo():xlUndo();}else if(l==='y'){e.preventDefault();xlRedo();}
    else if(l==='b'){e.preventDefault();xlFmt({b:!curFmt().b});}else if(l==='i'){e.preventDefault();xlFmt({i:!curFmt().i});}
    else if(l==='d'){e.preventDefault();fillDown();}else if(l==='f'){e.preventDefault();xlFind();}else if(l==='a'){e.preventDefault();XL.sel={r:0,c:0,r2:SH().rows-1,c2:SH().cols-1};xlRender();}
    return;}
  const mv={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[k];
  if(mv){e.preventDefault();if(e.shiftKey)xlSelect(s.r2+mv[0],s.c2+mv[1],true);else xlSelect(s.r+mv[0],s.c+mv[1]);return;}
  if(k==='Enter'){e.preventDefault();xlSelect(s.r+(e.shiftKey?-1:1),s.c);return;}
  if(k==='Tab'){e.preventDefault();xlSelect(s.r,s.c+(e.shiftKey?-1:1));return;}
  if(k==='Delete'||k==='Backspace'){e.preventDefault();xlClear();return;}
  if(k==='F2'){e.preventDefault();xlStartEdit();return;}
  if(k.length===1&&!e.altKey){e.preventDefault();xlStartEdit(k);}
});

document.addEventListener('cut',e=>{if($('#sheet').hidden||!XL.doc||e.target.closest('input,textarea'))return;e.preventDefault();const t=xlCopy(true);e.clipboardData&&e.clipboardData.setData('text/plain',t);});

function openHelp(){
  modal('Jak ovládat Span',b=>{b.innerHTML=`<ul class="help">
<li><b>Kolečko nástrojů:</b> přiložte pero a chvíli ho nechte stát. Kolem hrotu se objeví kolečko – přejeďte perem na nástroj, barvu nebo tloušťku a zvedněte. Boční tlačítko pera otevře kolečko okamžitě.</li>
<li><b>Přesný tvar:</b> nakreslete kruh, čáru, obdélník nebo trojúhelník a na konci pero podržte – tah se srovná.</li>
<li><b>Přesun objektů:</b> nástroj Laso – zakroužkujte, pak táhněte, zvětšujte za rohy a otáčejte horním úchytem. Přetažením na jinou stránku objekt přesunete tam.</li>
<li><b>Rychlý přesun prstem:</b> podržte prst na čemkoli napsaném a rovnou to posouvejte.</li>
<li><b>Rovnice a grafy:</b> do kalkulačky (orámovaný příklad nebo menu ⋯ → Kalkulačka a grafy funkcí) napište rovnici s x, např. x^2 − 5x + 6 = 0, a vyřeší ji. Funkci y = … vykreslí jako graf, který vložíte do stránky.</li>
<li><b>Vyšší matematika:</b> int(x^2;0;1) – určitý integrál (i do inf), der(x^3;2) – derivace v bodě (der(f;a;2) druhá), sum(1/x^2;1;100) – součet, lim(sin(x)/x;0) – limita. Proměnná je vždy x.</li>
<li><b>Tabulka a rozvrh:</b> menu ⋯ → Vložit tabulku nakreslí mřížku do stránky. V Pozadí stránky najdete šablony Rozvrh hodin a Týdenní plán.</li>
<li><b>Psaní rukou v tabulce:</b> tlačítko s perem v liště tabulky otevře dole panel. Napište perem text nebo vzorec (např. =SUMA(A1:A5) nebo α = 0,05), po chvilce se převede na znaky a Vložit do buňky ho zapíše a posune se o řádek níž. Nad panelem je řada speciálních znaků (řecká písmena, matematika, indexy ², ₁, jednotky) – klepnutím se přidají do buňky.</li>
<li><b>Obrázky v tabulce:</b> v tabulce tlačítko s obrázkem vloží fotku z galerie nebo z fotoaparátu. Táhnutím ji přesunete, za kulatý roh zvětšíte. Graf z označených dat jde vložit přímo do listu.</li>
<li><b>Záloha všeho:</b> v knihovně tlačítko ⋯ → Zálohovat celou knihovnu uloží všechny sešity, tabulky, složky i kategorie do jednoho souboru.</li>
<li><b>Lepicí poznámky a nahrávky:</b> menu ⋯ → Lepicí poznámka vloží barevný papírek s textem. Nahrát zvuk spustí nahrávání přednášky, nahrávky najdete v menu ⋯ → Nahrávky.</li>
<li><b>Prsty:</b> jeden prst posouvá, dva přibližují. Klepnutí dvěma prsty vrátí krok, třemi ho zopakuje. Dlaň při psaní perem se ignoruje.</li>
<li><b>Kalkulačka:</b> napište příklad, nakreslete kolem něj rámeček (obdélník nebo kruh – podržením pera na konci se srovná) a klepněte na „Spočítat“. Funguje i přes laso. Umí + − × ÷, mocniny, odmocniny, zlomky, závorky i funkce (sin, ln, log…). Pokud příklad přečte špatně, opravte ho – vestavěné rozpoznávání se naučí váš rukopis.</li>
<li><b>Tabulky (Excel):</b> v knihovně „Tabulka“. Vzorce česky (=SUMA, =PRŮMĚR, =KDYŽ…), import a export .xlsx.</li>
<li><b>Pravítko:</b> tlačítko s pravítkem. Posouvejte ho prstem, otáčejte kolečkem na konci; tah perem podél hrany je rovný.</li>
<li><b>Lupa psaní:</b> tlačítko vpravo nahoře – pište velkým písmem do spodního panelu, na stránku se zapíše zmenšeně. Rámeček se sám posouvá; prstem ho přesunete jinam.</li>
<li><b>Volby nástroje:</b> podržte tlačítko nástroje (nebo na aktivní klepněte znovu) – tloušťka, tlak, vyhlazení, výplň tvarů, tučný text, barva laseru…</li>
<li><b>Rukopis na text:</b> označte lasem a klepněte na ikonu T v liště výběru.</li>
<li><b>Opakované klepnutí na aktivní nástroj</b> otevře jeho volby (typ pera, režim gumy, tvary, písmo).</li>
<li><b>Klávesy:</b> <span class="kbd">P</span> pero, <span class="kbd">H</span> zvýrazňovač, <span class="kbd">E</span> guma, <span class="kbd">L</span> laso, <span class="kbd">S</span> tvary, <span class="kbd">T</span> text, <span class="kbd">K</span> laser, <span class="kbd">Ctrl+Z</span> zpět. Na počítači otevře kolečko pravé tlačítko myši.</li></ul>`;},[{label:'Rozumím',cls:'primary',value:true}]);
}

async function insertTable(){
  if(!nb)return;let R=4,C=3;
  const v=await modal('Vložit tabulku',b=>{
    const mk=(lab,val,set)=>{const f=el('label',{class:'field'},'<span>'+lab+'</span>');const i=el('input',{type:'text',inputmode:'numeric',value:String(val)});i.oninput=()=>set(parseInt(i.value)||0);f.append(i);return f;};
    const row=el('div');row.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:12px';row.append(mk('Řádky',R,x=>R=x),mk('Sloupce',C,x=>C=x));b.append(row);
    b.append(el('p',{class:'lib-note'},'Tabulka se nakreslí čarami barvou nástroje Tvary. Lasem ji pak přesunete nebo zvětšíte a do buněk můžete psát perem.'));
  },[{label:'Zrušit'},{label:'Vložit',cls:'primary',value:true}]);
  if(!v)return;R=clamp(R||1,1,30);C=clamp(C||1,1,12);
  const pg=nb.pages[curPageIndex()],tw=Math.min(pg.w-120,C*190),rh=60,th=R*rh;
  const x0=Math.round(pg.w/2-tw/2),y0=clamp((H/2-oy)/z-pg._top-th/2,60,Math.max(60,pg.h-th-60));
  const col=lum(T.shape.color)>0.85?'#1B2232':T.shape.color,ln=(a,b,c,d,w)=>finalize({t:'s',id:uid(),k:'sh',c:col,w,p:[[a,b,0.5],[c,d,0.5]]});
  const its=[];for(let i=0;i<=R;i++)its.push(ln(x0,y0+i*rh,x0+tw,y0+i*rh,i===0||i===R?2.2:1.4));
  for(let j=0;j<=C;j++)its.push(ln(x0+j*tw/C,y0,x0+j*tw/C,y0+th,j===0||j===C?2.2:1.4));
  if(R>1)its.push(ln(x0,y0+rh+3,x0+tw,y0+rh+3,1.4));
  clearSel();snapItems(pg);pg.items=pg.items.concat(its);changed();setTool('lasso');makeSel(pg,its.map(i=>i.id));render();
}

const stripNb=n=>Object.assign({},n,{pages:(n.pages||[]).map(p=>{const q=Object.assign({},p);delete q._top;delete q._left;return q;})});
async function exportAll(){
  const data=JSON.stringify({app:'span',v:1,all:true,lib,notebooks:notebooks.map(stripNb)});
  const d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  await saveFile('span-zaloha-'+ds+'.span.json',new Blob([data],{type:'application/json'}));store.set('lastBackup',Date.now());
}
async function importAll(j){
  (j.lib&&j.lib.folders||[]).forEach(f=>{if(!lib.folders.some(x=>x.id===f.id))lib.folders.push(f);});
  (j.lib&&j.lib.cats||[]).forEach(c=>{if(!lib.cats.some(x=>x.id===c.id))lib.cats.push(c);});
  await saveLib();let n=0,skip=0;
  for(const nbk of j.notebooks||[]){if(!nbk||!Array.isArray(nbk.pages))continue;
    const ex=notebooks.find(x=>x.id===nbk.id);if(ex&&(ex.updated||0)>=(nbk.updated||0)){skip++;continue;}
    nbk.pages.forEach(p=>{p.id=p.id||uid();p.items=(p.items||[]).map(finalizeLoaded);});
    await DB.put(nbk);if(ex)notebooks.splice(notebooks.indexOf(ex),1,nbk);else notebooks.push(nbk);n++;}
  renderLib();toast('Obnoveno '+items(n)+(skip?' · '+skip+' už bylo aktuálních':''));
}

/* ---------- zvukové nahrávky ---------- */
const REC={mr:null,chunks:[],t0:0,timer:0,stream:null};
function fmtDur(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
async function startRec(){
  if(REC.mr)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('Nahrávání zvuku tento prohlížeč neumí.');return;}
  try{REC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
  catch(e){toast(window.claude&&window.claude.use?'Mikrofon tu není povolen – otevřete aplikaci přes odkaz z GitHub Pages.':'Přístup k mikrofonu byl zamítnut.');return;}
  const type=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  try{REC.mr=new MediaRecorder(REC.stream,type?{mimeType:type,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000});}catch(e){REC.mr=new MediaRecorder(REC.stream);}
  REC.chunks=[];REC.nb=nb;REC.page=nb?curPageIndex():0;REC.mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data);};
  REC.mr.onstop=async()=>{const blob=new Blob(REC.chunks,{type:REC.mr.mimeType||type||'audio/webm'});const dur=(Date.now()-REC.t0)/1000;const target=REC.nb;
    REC.stream.getTracks().forEach(t=>t.stop());REC.mr=null;clearInterval(REC.timer);recBar();
    if(blob.size<200||!target){toast('Nahrávka je prázdná.');return;}
    const src=await readFile(blob);target.audio=(target.audio||[]).concat([{id:uid(),src,dur,created:Date.now(),page:REC.page,name:'Nahrávka '+((target.audio||[]).length+1)}]);
    target.updated=Date.now();if(target===nb)changed();else{nb=target;flushSave();nb=null;}toast('Nahrávka uložena ('+fmtDur(dur)+') – najdete ji v menu ⋯ → Nahrávky');};
  REC.mr.start(1000);REC.t0=Date.now();REC.timer=setInterval(recBar,500);recBar();
}
function stopRec(){if(REC.mr&&REC.mr.state!=='inactive')REC.mr.stop();}
function recBar(){
  let b=$('#recBar');
  if(!REC.mr){if(b)b.remove();return;}
  if(!b){b=el('div',{class:'rec-bar',id:'recBar',role:'status'});b.innerHTML='<span class="rec-dot"></span><span id="recT">0:00</span><button class="rec-stop" aria-label="Zastavit nahrávání">'+ic('stop')+'</button>';b.querySelector('button').onclick=stopRec;document.body.append(b);}
  $('#recT').textContent=fmtDur((Date.now()-REC.t0)/1000);
}
let recAudio=null;
function openRecordings(){
  if(!nb)return;const list=()=>nb.audio||[];
  modal('Nahrávky',body=>{
    const draw=()=>{body.replaceChildren();
      const top=el('div',{class:'rec-top'});const nbtn=el('button',{class:'btn primary'},ic(REC.mr?'stop':'mic')+(REC.mr?'Zastavit nahrávání':'Nahrát zvuk'));
      nbtn.onclick=()=>{if(REC.mr)stopRec();else{startRec();closeTop();}};top.append(nbtn);body.append(top);
      if(!list().length){body.append(el('p',{class:'lib-note'},'Zatím tu nejsou žádné nahrávky. Nahrávejte přednášku a pište si k ní poznámky – nahrávka zůstane uložená v tomto sešitě.'));return;}
      list().slice().reverse().forEach(a=>{
        const row=el('div',{class:'rec-row'});const pl=el('button',{class:'ib','aria-label':'Přehrát'},ic('play'));
        const info=el('div',{class:'rec-i'});info.innerHTML=`<b>${esc(a.name)}</b><span>${fmtDur(a.dur)} · ${new Date(a.created).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})} · str. ${a.page+1}</span>`;
        const prog=el('input',{type:'range',min:'0',max:'1000',value:'0',class:'rec-p','aria-label':'Pozice'});
        const go=el('button',{class:'ib','aria-label':'Přejít na stránku'},ic('book'));go.onclick=()=>{closeTop();goToPage(Math.min(a.page,nb.pages.length-1));};
        const rn=el('button',{class:'ib','aria-label':'Přejmenovat'},ic('edit'));
        rn.onclick=async()=>{const v=await modal('Přejmenovat nahrávku',bd=>{const f=el('label',{class:'field'},'<span>Název</span>');f.append(el('input',{type:'text',value:a.name,autofocus:''}));bd.append(f);},[{label:'Zrušit'},{label:'Uložit',cls:'primary',value:bd=>bd.querySelector('input').value}]);if(v&&v.trim()){a.name=v.trim();changed();}openRecordings();};
        const del=el('button',{class:'ib','aria-label':'Smazat'},ic('trash2'));
        del.onclick=()=>{nb.audio=list().filter(x=>x!==a);changed();if(recAudio&&recAudio._id===a.id){recAudio.pause();recAudio=null;}draw();};
        pl.onclick=()=>{
          if(recAudio&&recAudio._id===a.id){if(recAudio.paused)recAudio.play();else recAudio.pause();return;}
          if(recAudio)recAudio.pause();recAudio=new Audio(a.src);recAudio._id=a.id;
          const sync=()=>{if(!recAudio||recAudio._id!==a.id)return;pl.innerHTML=ic(recAudio.paused?'play':'pause');const d=isFinite(recAudio.duration)?recAudio.duration:a.dur;prog.value=String(Math.round(recAudio.currentTime/d*1000)||0);};
          ['play','pause','timeupdate','ended'].forEach(ev=>recAudio.addEventListener(ev,sync));recAudio.play().catch(()=>toast('Nahrávku nelze přehrát.'));
          prog.oninput=()=>{if(recAudio&&recAudio._id===a.id){const d=isFinite(recAudio.duration)?recAudio.duration:a.dur;recAudio.currentTime=prog.value/1000*d;}};
        };
        row.append(pl,info,go,rn,del,prog);body.append(row);});
    };draw();
  },[{label:'Zavřít',value:()=>{if(recAudio){recAudio.pause();recAudio=null;}}}]);
}

document.addEventListener('keydown',e=>{
  if(!nb||editing||e.target.closest('input,textarea,select,.modal-ov'))return;
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==='f'){e.preventDefault();searchNotebook();return;}
  if(mod&&k==='y'){e.preventDefault();redo();return;}
  if(mod&&k==='c'&&sel){copySel(false);return;} if(mod&&k==='x'&&sel){copySel(true);return;}
  if(mod&&k==='v'&&clip){pasteAt(W/2,H/2);return;}
  if(mod&&k==='a'){e.preventDefault();setTool('lasso');const pg=nb.pages[curPageIndex()];if(pg.items.length)makeSel(pg,pg.items.map(i=>i.id));return;}
  if((k==='delete'||k==='backspace')&&sel){delSel();return;}
  if(k==='escape'){if(radial.open)closeRadial();else clearSel();return;}
  if(mod)return;
  const map={p:'pen',h:'hl',e:'eraser',l:'lasso',s:'shape',t:'text',k:'laser'};if(map[k])setTool(map[k]);if(k==='r')toggleRuler();
  if(k==='+'||k==='=')zoomAt(W/2,H/2,z*1.2);if(k==='-')zoomAt(W/2,H/2,z/1.2);
});
document.addEventListener('paste',e=>{if(!nb||editing)return;const f=[...(e.clipboardData&&e.clipboardData.files||[])].find(f=>f.type.startsWith('image/'));if(f){e.preventDefault();insertImage(f);}});

function makeWelcome(){

    tx(120,388,26,'1. Přiložte pero a chvíli ho nechte stát → kolem hrotu se otevře kolečko s nástroji, barvami a tloušťkou.'),
    tx(120,508,26,'2. Nakreslete kruh nebo obdélník a na konci pero podržte → tvar se srovná.'),

    tx(120,708,26,'4. Podržte prst na objektu → rovnou ho posouváte. Dva prsty přibližují, klepnutí dvěma prsty = Zpět.'),
    tx(120,828,26,'5. Boční tlačítko pera otevře kolečko okamžitě.'),
    str('sh','#2D5BD3',3,ellipsePts(760,1110,120,70)),
    str('sh','#D6336C',3,genShape('arrow',[560,1180],[640,1130])),
    str('pen','#2F9E44',3,wave),
    tx(600,1230,34,'zkuste mě přesunout!',{f:'hand',c:'#2D5BD3',w:340}),
  ];
  p2.items=[tx(80,60,30,'Volná stránka na zkoušení',{f:'hand',c:'#868E96'})];
  return {id:uid(),title:'Vítejte ve Span',cover:'#2D5BD3',created:Date.now(),updated:Date.now(),pages:[p1,p2]};

async function init(){

  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}
  await DB.open();
  notebooks=await DB.all();
  const m=await DB.getMeta('lib');
  if(m)lib=Object.assign({id:'lib',folders:[],cats:[]},m);
  else{lib.cats=[{id:uid(),name:'Škola',color:'#2D5BD3'},{id:uid(),name:'Práce',color:'#1F7A5C'},{id:uid(),name:'Osobní',color:'#D9822B'}];await saveLib();}
  if(!notebooks.length&&!store.get('welcomed',false)){const w=makeWelcome();await DB.put(w);notebooks=[w];store.set('welcomed',true);}
  const old=Date.now()-30*864e5;for(const n of notebooks.filter(n=>n.trashed&&n.trashed<old)){await DB.del(n.id);}notebooks=notebooks.filter(n=>!(n.trashed&&n.trashed<old));
  renderLib();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{tlCache=new WeakMap();if(nb)render();});
  try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!(window.claude&&window.claude.use)&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
}
