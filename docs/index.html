<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>html{height:100%;background:#0B0B0D}[hidden]{display:none!important}</style>
</head>
<body>
<title>Span Poznámky</title>
<meta name="theme-color" content="#0B0B0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=Caveat:wght@500;600&family=Lora:wght@400;500;600&display=swap">
<style>
/* Layout: knihovna sešitů (mřížka obálek) → celoobrazovkový editor: horní lišta, plátno se stránkami, kolečko nástrojů u hrotu pera */
:root{
  --desk:#EDEDF0; --surface:#FFFFFF; --surface-2:#F1F1F4; --ink:#151517; --muted:#6B6B73;
  --line:#E1E1E6; --accent:#D9603F; --accent-2:#1593A8; --accent-soft:#FBE7E1; --accent-ink:#FFFFFF; --danger:#C2253A;
  --bar:#FFFFFF; --bar-2:#EBEEF4; --bar-ink:#23262D; --bar-line:rgba(20,24,40,.10);
  --shadow:0 12px 36px rgba(0,0,0,.18);
  --f-display:"Lora", Georgia, "Times New Roman", serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#000000; --surface:#1C1C1E; --surface-2:#2A2A2D; --ink:#F2F2F4; --muted:#9C9CA3;
  --line:#2F2F33; --accent:#E3735C; --accent-2:#3EC3DB; --accent-soft:#3A2520; --accent-ink:#FFFFFF; --danger:#FF6B7D;
  --shadow:0 12px 36px rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --desk:#000000; --surface:#1C1C1E; --surface-2:#2A2A2D; --ink:#F2F2F4; --muted:#9C9CA3;
  --line:#2F2F33; --accent:#E3735C; --accent-2:#3EC3DB; --accent-soft:#3A2520; --accent-ink:#FFFFFF; --danger:#FF6B7D;
  --shadow:0 12px 36px rgba(0,0,0,.6); color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:14px;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;position:relative;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- knihovna ---------- */
#lib{height:100%;display:flex;background:var(--desk);position:relative}
#lib[hidden]{display:none}
.side{width:320px;flex:none;background:var(--surface);overflow-y:auto;padding-block:24px 40px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--line)}
#lib.noside .side{display:none}
.brand-t{font:600 36px/1.1 var(--f-display);letter-spacing:-.015em;margin:6px 8px 8px}
#sideNav{display:flex;flex-direction:column;gap:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;height:92px;padding:14px 14px 13px;border-radius:14px;border:0;background:var(--surface-2);text-align:left;font-weight:500;font-size:15px;box-sizing:border-box}
.tile svg{color:var(--c)}
.tile[aria-current="true"]{background:var(--accent);color:#fff}
.tile[aria-current="true"] svg{color:#fff}
.sec{display:flex;align-items:center;gap:2px;padding:14px 2px 6px 8px}
.sec h3{margin:0;font:600 24px/1.2 var(--f-display);flex:1;min-width:0}
.sec h3 button{border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left}
.sec .ib{width:38px;height:38px;color:var(--accent-2)}
.sec .chev svg{transition:transform .2s}
.sec.closed .chev svg{transform:rotate(-90deg)}
.fit{display:flex;align-items:center;gap:14px;min-height:54px;border:0;background:transparent;border-radius:27px;padding:0 20px;text-align:left;font-weight:600;font-size:15.5px;width:100%;box-sizing:border-box}
.fit:hover{background:var(--surface-2)}
.fit[aria-current="true"]{background:var(--accent);color:#fff}
.fit .lbl2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fit .cnt{font-size:14px;font-variant-numeric:tabular-nums;opacity:.85}
.fit .cdot2{width:14px;height:14px;border-radius:5px;flex:none;margin:0 4px}
.fit.sub{min-height:46px;font-weight:500}
.side-empty{color:var(--muted);font-size:13px;padding:2px 20px 8px;line-height:1.5}
.lib-main{flex:1;min-width:0;overflow-y:auto;padding-block:16px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));box-sizing:border-box}
.lib-in{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.topbar .grow{flex:1}
.ib.acc{color:var(--accent-2)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px;min-width:0;flex:0 1 280px;color:var(--accent-2)}
.search input{border:0;background:transparent;outline:none;font:inherit;color:var(--ink);width:100%;min-width:0}
.sortsel{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;padding:0 10px;max-width:190px}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.crumbs:empty{display:none}
.crumbs button{border:0;background:transparent;padding:4px 6px;border-radius:8px;font:inherit;color:var(--accent-2);font-weight:600}
.ltitle{margin:0 0 4px;font:600 42px/1.15 var(--f-display);letter-spacing:-.015em;text-wrap:balance;display:flex;align-items:center;gap:14px}
.ltitle .cdot2{width:18px;height:18px;border-radius:6px;flex:none}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.quick:empty{display:none}
.qa{display:flex;align-items:center;gap:16px;min-height:86px;padding:0 22px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:16px;text-align:left;box-sizing:border-box}
.qa:hover{background:var(--surface-2)}
.qa .qi{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:10px}
.qa .qi svg{width:28px;height:28px}
.qa.danger{color:var(--danger)}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:34px 26px;margin-top:12px}
.tcard{display:flex;flex-direction:column;gap:12px;min-width:0;position:relative}
.fthumb{width:100%;aspect-ratio:.72;border:0;border-radius:14px;background:var(--surface-2);padding:14px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;max-width:100%}
.fthumb>img,.fthumb>canvas{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:3px;display:block;min-height:0;min-width:0;background:#fff}
.fthumb>.ph{border-radius:3px;background:var(--surface);opacity:.6}
.nthumb{position:relative;width:100%;aspect-ratio:.72;border:0;padding:0;border-radius:4px 10px 10px 4px;overflow:hidden;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.1),0 8px 20px rgba(0,0,0,.22);max-width:100%}
.nthumb>img,.nthumb>canvas{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.nthumb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--cv);z-index:1}
.fthumb:active,.nthumb:active{transform:scale(.98)}
.cap{display:flex;align-items:flex-start;gap:8px;justify-content:center;min-width:0}
.cap>svg{flex:none;margin-top:1px}
.cap .ct{min-width:0;text-align:center}
.cap .t{font-weight:600;font-size:16px;line-height:1.3;word-break:break-word}
.cap .s{color:var(--accent-2);font-size:14px;margin-top:3px;font-variant-numeric:tabular-nums}
.tcard .more{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:10px;background:rgba(20,20,22,.6);color:#fff;opacity:0;transition:opacity .15s;z-index:2}
.tcard:hover .more,.tcard .more:focus-visible{opacity:1}
@media (pointer:coarse){.tcard .more{display:none}}
.fav-badge{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:#E8A400;z-index:1}
.fav-badge svg{width:16px;height:16px;fill:currentColor}
.cat-tag{display:inline-flex;align-items:center;gap:5px}
.cat-tag i{width:8px;height:8px;border-radius:3px;display:inline-block}
.snip{font-size:12.5px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.snip mark{background:#FFE58A;color:#1B2232;border-radius:3px;padding:0 2px}
.empty{grid-column:1/-1;border:1.5px dashed var(--line);border-radius:16px;padding:28px;color:var(--muted);text-align:center;line-height:1.55}
.tree{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow-y:auto}
.tree button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;min-height:44px;text-align:left;font-weight:500;padding-right:10px}
.tree button:hover{background:var(--surface-2)}
.tree button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tree button:disabled{opacity:.4}
.lib-note{color:var(--muted);font-size:12.5px;line-height:1.5;max-width:70ch}
.side-shade{display:none}
@media (max-width:1100px){.side{width:280px}}
@media (max-width:760px){
  .side{position:absolute;inset:0 auto 0 0;z-index:20;box-shadow:var(--shadow);width:min(300px,86vw)}
  #lib:not(.noside) .side-shade{display:block;position:absolute;inset:0;z-index:19;background:rgba(0,0,0,.35)}
  .ltitle{font-size:32px} .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:24px 16px}
  .quick{gap:10px} .qa{min-height:68px;padding:0 14px;font-size:14.5px} .sortsel{display:none}
}

/* ---------- editor (plovoucí tmavé lišty jako v Noteshelf) ---------- */
#editor{height:100%;position:relative;overflow:hidden}
#editor[hidden]{display:none}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:var(--desk)}
.stage canvas{position:absolute;left:0;top:0;touch-action:none}
.fbar{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:2px;padding:5px;background:var(--bar);color:var(--bar-ink);border-radius:12px;border:1px solid var(--bar-line);box-shadow:0 4px 18px rgba(20,24,40,.12);z-index:5}
.fbar .ib{color:var(--bar-ink);width:46px;height:46px}
.fbar .ib:hover{background:var(--bar-2)}
.fbar .ib[aria-pressed="true"]{background:var(--bar-2)}
.fbar .ib[aria-pressed="true"] svg{color:var(--tool-c,var(--bar-ink))}
.fbar .ib:disabled{opacity:.35}
.fl{left:max(12px,env(safe-area-inset-left,0px))}
.fr{right:max(12px,env(safe-area-inset-right,0px))}
.fc{left:50%;transform:translateX(-50%)}
@media (max-width:880px){.fc{top:calc(70px + env(safe-area-inset-top,0px))} .fbar .ib{width:42px;height:42px}}
.vpal{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);z-index:5;background:var(--bar);border-radius:28px;padding:10px 7px;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--bar-line);box-shadow:0 4px 18px rgba(20,24,40,.12)}
.vpal[hidden]{display:none}
.vdot{width:34px;height:34px;border-radius:50%;border:0;padding:0;flex:none}
.vdot{box-shadow:inset 0 0 0 1px rgba(20,24,40,.12)}
.vdot[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bar),0 0 0 5.5px var(--bar-ink)}
.vadd{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(20,24,40,.22);background:transparent;color:var(--bar-ink);display:grid;place-items:center;padding:0;flex:none}
.vadd svg{width:18px;height:18px}
.vsep{width:30px;height:1px;background:var(--bar-line);margin:2px 0;flex:none}
.vsz{width:44px;height:40px;border:0;background:transparent;border-radius:20px;display:grid;place-items:center;padding:0;flex:none}
.vsz i{display:block;width:22px;border-radius:3px;background:rgba(20,24,40,.45)}
.vsz[aria-pressed="true"]{background:var(--bar-ink)}
.vsz[aria-pressed="true"] i{background:var(--bar)}
@media (max-height:640px){.vdot,.vadd{width:28px;height:28px}.vsz{height:32px}.vpal{gap:6px}}
.pgchip{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
.pgchip.show{opacity:.92}
.sz{width:34px;height:42px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed="true"]{background:var(--accent-soft)}
.sz[aria-pressed="true"] i{background:var(--accent)}
.sep{width:1px;height:26px;background:var(--bar-line);margin:0 4px;flex:none}
#radial{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#radial .rg{transform-origin:0 0;animation:pop .16s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){#radial .rg{animation:none}}
.r-bg{fill:var(--surface);opacity:.55;filter:drop-shadow(0 10px 24px rgba(10,20,50,.28))}
.r-sec{fill:var(--surface);stroke:var(--line);stroke-width:1}
.r-sec.on{fill:var(--accent-soft)}
.r-sec.hot{fill:var(--accent)}
.r-ic{color:var(--ink)} .r-ic.on{color:var(--accent)} .r-ic.hot{color:var(--accent-ink)}
.r-ic path,.r-ic rect,.r-ic circle{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.r-col{stroke:var(--surface);stroke-width:2}
.r-col.on{stroke:var(--ink);stroke-width:3}
.r-dot{fill:var(--ink)}
.r-center{fill:var(--surface);stroke:var(--line)}
.r-center.hot{fill:var(--surface-2)}
.r-lab{fill:var(--ink)}
.r-labt{fill:var(--surface);font:600 12.5px var(--f-body)}
.selbar{position:absolute;display:flex;gap:2px;padding:4px;background:var(--bar);color:var(--bar-ink);border:1px solid var(--bar-line);border-radius:14px;box-shadow:var(--shadow);z-index:4;align-items:center}
.selbar .ib{width:38px;height:38px}
.selbar .ib{color:var(--bar-ink)} .selbar .ib:hover{background:var(--bar-2)}
.selbar .cdot{width:22px;height:22px;border-radius:50%;border:0;margin:0 3px;box-shadow:0 0 0 1.5px rgba(20,24,40,.18);flex:none;padding:0}
.selbar .ib.del{color:var(--danger)}
#ta{position:absolute;z-index:3;border:1.5px dashed var(--accent);background:transparent;outline:none;resize:none;overflow:hidden;padding:0;margin:0;line-height:1.3;white-space:pre-wrap;word-wrap:break-word;box-sizing:content-box}
.pages{position:absolute;top:0;right:0;bottom:0;width:240px;padding-top:env(safe-area-inset-top,0px);background:var(--surface);border-left:1px solid var(--line);z-index:6;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .2s ease;box-shadow:var(--shadow);padding-right:env(safe-area-inset-right,0px)}
.pages.open{transform:none}
.pages-head{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 16px;font:700 15px var(--f-display)}
.pages-head span{margin-right:auto}
.pages-list{flex:1;overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:14px}
.pg{display:flex;flex-direction:column;gap:6px;align-items:center}
.pg canvas{position:static;width:150px;height:auto;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 4px 12px rgba(18,28,56,.14);cursor:pointer;outline:2px solid transparent;outline-offset:3px}
.pg.cur canvas{outline-color:var(--accent)}
.pg-row{display:flex;align-items:center;gap:0}
.pg-row .ib{width:30px;height:30px;border-radius:8px}
.pg-row .ib svg{width:17px;height:17px}
.pg-row b{font-size:12px;color:var(--muted);width:26px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.pg-row .ib.marked{color:#E8A400}
.pages-foot{padding:10px 16px 14px;border-top:1px solid var(--line)}
.pages-foot .btn{width:100%;justify-content:center}
.brand{display:flex;align-items:center;gap:10px}
.only-m{display:none!important}
@media (max-width:760px){.only-m{display:flex!important}}
#app{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app input,#app textarea,#app select{user-select:text;-webkit-user-select:text}
.lib-main,.side,.pages-list,.modal-body{overscroll-behavior:contain}
.pop .sizes{display:flex}
.ib{width:42px;height:42px;border-radius:11px;border:0;background:transparent;display:grid;place-items:center;flex:none;position:relative}
.ib:hover{background:var(--surface-2)}
.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default}
.ib .dot{position:absolute;bottom:5px;right:7px;width:6px;height:6px;border-radius:50%}
@media (pointer:coarse){ .ib{width:46px;height:46px} .nav-it{height:46px} .menu button{padding:13px 12px} .chip{height:40px} }

/* ---------- popovery, dialogy, toast ---------- */
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;max-width:min(340px,calc(100vw - 24px));box-sizing:border-box}
.pop h4{margin:2px 2px 8px;font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pop .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pop .row:last-child{margin-bottom:0}
.cbtn{width:30px;height:30px;border-radius:50%;border:0;padding:0;box-shadow:0 0 0 1px var(--line)}
.cbtn[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.chip{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.menu{display:flex;flex-direction:column;min-width:230px;padding:4px}
.menu button{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:10px 10px;border-radius:10px;font-weight:500}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.menu button.danger{color:var(--danger)}
.modal-ov{position:fixed;inset:0;z-index:60;background:rgba(10,14,24,.42);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal h2{margin:0;padding:20px 22px 6px;font:700 19px var(--f-display);text-wrap:balance}
.modal-body{padding:10px 22px 6px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;line-height:1.5}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input[type=text],.field select{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font:inherit;padding:0 12px}
.field input[type=range]{width:100%}
.check{display:flex;align-items:center;gap:10px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.tpl{border:0;background:transparent;padding:0;display:flex;flex-direction:column;gap:5px;align-items:center;font-size:12px;font-weight:500}
.tpl canvas{width:100%;height:auto;border-radius:4px;box-shadow:0 0 0 1px var(--line);display:block}
.tpl[aria-pressed="true"] canvas{box-shadow:0 0 0 2.5px var(--accent)}
.help{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.help b{font-weight:600}
.kbd{font:600 11px var(--f-body);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-weight:500;z-index:80;box-shadow:var(--shadow);max-width:calc(100vw - 40px);text-align:center}
/* ---------- tabulky (Excel) ---------- */
#sheet{height:100%;display:flex;flex-direction:column;background:var(--surface);--xl:#1E7145}
#sheet[hidden]{display:none}
.xl-top{display:flex;align-items:center;gap:4px;padding-block:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--xl);color:#fff;flex:none}
.xl-top .ib{color:#fff}.xl-top .ib:hover{background:rgba(255,255,255,.14)}.xl-top .ib:disabled{opacity:.4}
.xl-title{border:0;background:transparent;color:#fff;font:600 19px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:60vw;padding:4px 8px;border-radius:8px}
.xl-top .grow{flex:1}
.xl-tools{display:flex;align-items:center;gap:2px;padding-block:4px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.xl-tools::-webkit-scrollbar{display:none}
.xl-tools .ib{width:40px;height:40px;flex:none}
.xl-tools .ib[aria-pressed="true"]{background:color-mix(in srgb,var(--xl) 18%,transparent);color:var(--xl)}
.xl-tools select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font:inherit;padding:0 6px;flex:none}
.xl-dec{font:600 12px var(--f-body);width:46px!important}
.vsep2{width:1px;height:24px;background:var(--line);margin:0 5px;flex:none}
.xl-fbar{display:flex;align-items:center;gap:8px;padding-block:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);flex:none}
#xlName{width:96px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font:600 13px var(--f-body);padding:0 8px;text-align:center;box-sizing:border-box;flex:none}
.xl-fx{font:italic 600 16px Georgia,serif;color:var(--muted);padding:0 2px}
#xlFx{flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font:15px var(--f-body);padding:0 10px;box-sizing:border-box}
#xlFx:focus,#xlName:focus{outline:2px solid var(--xl);outline-offset:-1px}
.xl-grid{flex:1;overflow:auto;position:relative;background:var(--surface);touch-action:none;overscroll-behavior:contain;user-select:none;-webkit-user-select:none}
.xl-inner{position:relative}
.xl-ch{position:sticky;top:0;z-index:3;width:max-content;background:var(--surface-2)}
.xl-chr{display:flex;height:30px}
.xr-fz{position:relative;background:var(--surface);box-shadow:0 2px 0 var(--line)}
.xr-fz:last-child{box-shadow:0 2px 0 color-mix(in srgb,var(--xl) 50%,var(--line))}
.xl-corner{position:sticky;left:0;z-index:4;background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);flex:none;box-sizing:border-box}
.xh{flex:none;display:flex;align-items:center;justify-content:center;font:600 12px var(--f-body);color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;box-sizing:border-box}
.xh.on,.xrh.on{background:color-mix(in srgb,var(--xl) 20%,var(--surface-2));color:var(--xl)}
.xh .grip{position:absolute;right:-7px;top:0;bottom:0;width:14px;cursor:col-resize;z-index:2;touch-action:none}
.xr{position:absolute;left:0;display:flex;height:32px}
.xrh{position:sticky;left:0;z-index:2;flex:none;background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:600 12px var(--f-body);color:var(--muted);box-sizing:border-box;font-variant-numeric:tabular-nums}
.xc{flex:none;box-sizing:border-box;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 6px;line-height:31px;font-size:14px;white-space:nowrap;overflow:hidden;color:var(--ink)}
.xc.n{text-align:right;font-variant-numeric:tabular-nums}
.xc.err{color:var(--danger);font-weight:600}
.xl-selbox{position:absolute;border:2px solid var(--xl);box-sizing:border-box;pointer-events:none;z-index:1;background:color-mix(in srgb,var(--xl) 9%,transparent)}
.xl-fill{position:absolute;right:-7px;bottom:-7px;width:12px;height:12px;background:var(--xl);border:2px solid var(--surface);border-radius:2px;pointer-events:auto;touch-action:none;cursor:crosshair}
@media (pointer:coarse){.xl-fill{width:20px;height:20px;right:-12px;bottom:-12px;border-radius:50%}}
.xl-fillbox{position:absolute;border:2px dashed var(--xl);box-sizing:border-box;pointer-events:none;z-index:1}
.xl-ed{position:absolute;z-index:5;border:2px solid var(--xl);box-sizing:border-box;font:14px var(--f-body);padding:0 5px;background:var(--surface);color:var(--ink);outline:none;box-shadow:var(--shadow)}
.xl-tabs{display:flex;align-items:center;gap:4px;padding-top:5px;padding-bottom:max(5px,env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--surface-2);border-top:1px solid var(--line);overflow-x:auto;flex:none}
.xtab{height:36px;padding:0 16px;border:0;border-radius:8px;background:transparent;font-weight:600;color:var(--muted);white-space:nowrap;flex:none}
.xtab[aria-current="true"]{background:var(--surface);color:var(--xl);box-shadow:inset 0 -3px 0 var(--xl)}
.xl-tabs .ib{width:36px;height:36px;color:var(--xl)}
.xl-img{position:absolute;z-index:2;touch-action:none;cursor:move;box-sizing:border-box}
.xl-img img{width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.xl-img.on{outline:2px solid var(--xl);outline-offset:1px}
.xl-img-h{position:absolute;right:-11px;bottom:-11px;width:22px;height:22px;border-radius:50%;background:var(--xl);border:3px solid var(--surface);box-sizing:border-box;cursor:nwse-resize;touch-action:none}
.xl-img-bar{position:absolute;left:0;top:-50px;display:flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.xl-img-bar .ib{width:38px;height:38px}.xl-img-bar .ib.del{color:var(--danger)}
.xl-hw{flex:none;height:min(300px,38vh);display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--surface-2)}
.xl-hw[hidden]{display:none}
.hw-sym{display:flex;flex-direction:column;gap:4px;padding:6px 10px 4px;padding-left:max(10px,env(safe-area-inset-left,0px))}
.hw-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.hw-tab{height:28px;padding:0 12px;border:0;border-radius:14px;background:transparent;font:600 12.5px var(--f-body);color:var(--muted);flex:none}
.hw-tab[aria-pressed="true"]{background:color-mix(in srgb,var(--xl) 16%,transparent);color:var(--xl)}
.hw-keys{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hw-keys::-webkit-scrollbar,.hw-tabs::-webkit-scrollbar{display:none}
.hw-key{min-width:40px;height:40px;padding:0 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font:500 18px var(--f-body);color:var(--ink);flex:none}
.hw-key:active{background:color-mix(in srgb,var(--xl) 18%,var(--surface))}
.hw-main{flex:1;min-height:0;display:flex;gap:10px;padding:4px 10px 10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.hw-pad{flex:1;min-width:0;position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hw-pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hw-ph{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);text-align:center;color:#8A90A0;font-size:14px;pointer-events:none;line-height:1.45}
.hw-side{width:min(280px,36%);display:flex;flex-direction:column;gap:6px}
#hwOut{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 18px var(--f-body);padding:0 10px;box-sizing:border-box;width:100%}
#hwOut:focus{outline:2px solid var(--xl);outline-offset:-1px}
.hw-st{font-size:12px;color:var(--muted);line-height:1.35;min-height:16px;overflow-y:auto;flex:1 1 auto;max-height:64px}
.hw-btns{display:flex;align-items:center;gap:2px;margin-top:auto}.hw-btns .grow{flex:1}.hw-btns .ib{width:36px;height:36px}
#hwIns{flex:1;justify-content:center;background:var(--xl);border-color:var(--xl)}
.hw-insrow{display:flex;gap:6px;align-items:center}.hw-insrow .ib{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);flex:none}
.hw-tr{position:absolute;left:12px;top:10px;display:flex;align-items:baseline;gap:10px;color:#5F6675;font-size:13px;pointer-events:none}
.hw-tr b{font:600 44px/1 Caveat, var(--f-body);color:var(--xl)}
#hwEr[aria-pressed="true"]{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
#hwOut:disabled{opacity:.5}
#xlHwB[aria-pressed="true"]{background:color-mix(in srgb,var(--xl) 18%,transparent);color:var(--xl)}
@media (max-width:640px){.hw-main{flex-direction:column}.hw-side{width:auto}.hw-btns{margin-top:0}}
/* kalkulačka */
.calc{position:absolute;z-index:8;width:min(340px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.calc-h{display:flex;align-items:center;gap:8px;font-size:15px}.calc-h .grow{flex:1}.calc-h .ib{width:34px;height:34px}.calc-h>svg{color:var(--accent-2)}
.calc-l{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#calcIn{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font:500 18px var(--f-body);padding:0 12px;width:100%;box-sizing:border-box}
.calc-r{font:600 30px/1.2 Caveat, var(--f-body);color:var(--accent-2);min-height:36px;word-break:break-word}
.calc-g{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.calc-g canvas{display:block}
.calc-rng{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:12.5px;color:#6B7385;background:#F6F8FB;border-top:1px solid #E6EAF2}.calc-rng input{width:64px;height:30px;border:1px solid #D9DEE8;border-radius:8px;padding:0 8px;font:inherit;color:#1B2232;background:#fff}
.calc-r.sm{font:600 15px/1.35 var(--f-body)}
.calc-r.err{font:500 13.5px var(--f-body);color:var(--danger)}
.calc-st{font-size:12px;color:var(--muted);line-height:1.4}
.calc-a{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.calc-a .btn:disabled{opacity:.45}
.rec-bar{position:fixed;z-index:60;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 14px;border-radius:20px;background:#1B2232;color:#fff;font:600 14px var(--f-body);box-shadow:0 8px 24px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.play-bar{gap:6px;padding:0 6px}.play-bar .pb-n{max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;opacity:.75}.play-bar .rec-stop svg{fill:none;stroke:currentColor}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#FF4D4F;animation:recp 1.2s ease-in-out infinite}
@keyframes recp{50%{opacity:.25}}
.study-bar{gap:8px;padding:0 6px 0 16px;height:46px;border-radius:23px}.study-bar .sb-n{min-width:52px;opacity:.8}
.sb-btn{height:34px;padding:0 14px;border-radius:17px;border:0;background:rgba(255,255,255,.16);color:#fff;font:600 14px var(--f-body)}.sb-btn.ok{background:#2F9E44}.sb-btn.bad{background:#E03131}
.back-chip{position:fixed;z-index:60;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;height:40px;padding:0 16px 0 10px;border:0;border-radius:20px;background:#2D5BD3;color:#fff;font:600 14px var(--f-body);box-shadow:0 8px 24px rgba(0,0,0,.25)}.back-chip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2}
.ol-row{display:flex;align-items:center}.ol-row>button:first-child{flex:1;min-width:0}.ol-row>button.cur{font-weight:700}
.pg-title{font-size:12px;font-weight:600;color:#B07C00;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.pgrid{position:fixed;inset:0;z-index:45;background:var(--desk);display:flex;flex-direction:column}
.pgrid-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.pgrid-bar b{font-size:16px;white-space:nowrap}.pgrid-bar .sp{flex:1}#pgActs{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}#pgActs .del{color:#E03131}
.pgrid-body{flex:1;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;padding:16px;-webkit-overflow-scrolling:touch}
.pgc-th{content-visibility:auto;contain-intrinsic-size:auto 240px}
.pgrid-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;max-width:1400px;margin:0 auto}
.pgc{position:relative;display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none;cursor:pointer}
.pgc-th{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(20,30,50,.18),0 4px 14px rgba(20,30,50,.08);overflow:hidden;border:2px solid transparent}
.pgc-th canvas{width:100%;height:100%;display:block}
.pgc.cur .pgc-th{border-color:var(--accent)}.pgc.on .pgc-th{border-color:#2D5BD3;box-shadow:0 0 0 3px rgba(45,91,211,.3)}
.pgc-l{display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);min-width:0}.pgc-m{color:#B07C00;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgc-ck{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:14px;background:#fff;border:2px solid #2D5BD3;display:grid;place-items:center;color:#2D5BD3}.pgc.on .pgc-ck{background:#2D5BD3;color:#fff}.pgc-ck svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3}
.pgc.dragging{opacity:.3}.pgc.drop-b .pgc-th{box-shadow:-6px 0 0 #2D5BD3}.pgc.drop-a .pgc-th{box-shadow:6px 0 0 #2D5BD3}
.pgc-ghost{position:fixed;z-index:80;pointer-events:none;opacity:.9;transform:rotate(-3deg) scale(1.04)}
.pgrid-tip{text-align:center;margin:18px auto 0;max-width:520px}
.ver-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;margin-top:6px}
.ver-row{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:12px}.ver-row .btn{height:36px;padding:0 12px}
.ver-th canvas{width:44px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.2);display:block}.ver-i{flex:1;display:flex;flex-direction:column;min-width:0}.ver-i span{font-size:13px;color:var(--muted)}
.stk-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:8px 0;max-height:46vh;overflow-y:auto}
.stk{min-width:0;padding:0;height:42px;border:0;border-radius:10px;background:transparent;font-size:26px;line-height:1}.stk:hover{background:var(--surface-2)}
.rec-stop{width:30px;height:30px;border-radius:15px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}.rec-stop svg{width:16px;height:16px;fill:currentColor}
.rec-top{display:flex;margin-bottom:10px}.rec-top .btn{display:inline-flex;align-items:center;gap:8px}.rec-top svg{width:18px;height:18px}
.rec-row{display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:4px 8px;padding:8px 0;border-top:1px solid var(--line)}
.rec-i{display:flex;flex-direction:column;min-width:0}.rec-i b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rec-i span{font-size:12.5px;color:var(--muted)}
.rec-p{grid-column:1/-1;width:100%;accent-color:var(--accent-2)}
.calc-chip{position:absolute;z-index:7;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 10px;border-radius:18px;border:0;background:var(--accent-2);color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:pop .18s ease-out}
.calc-chip svg{width:18px;height:18px}
/* světlé rozhraní v sešitu a tabulce (nezávisle na tmavém vzhledu knihovny) */
body.light-ui{--desk:#E8EBF0;--surface:#FFFFFF;--surface-2:#F2F4F8;--ink:#161A22;--muted:#5F6675;--line:#DDE1E8;--accent:#D9603F;--accent-2:#1593A8;--accent-soft:#FBE7E1;--accent-ink:#FFFFFF;--danger:#C2253A;--shadow:0 12px 32px rgba(20,24,40,.16);color-scheme:light}
.pages{top:10px!important;right:10px!important;bottom:10px!important;border-radius:18px;border:1px solid var(--line);transform:translateX(calc(100% + 20px))}
.pages.open{transform:none}
.pg canvas{border-radius:6px}
.topts{width:320px}.topts .field{margin:10px 2px 4px}.topts .check{margin:8px 2px;font-size:14px;line-height:1.35}.topts .btn{margin-top:10px}.topts .lib-note{margin:8px 2px 0}
input[type=range]{accent-color:var(--accent)}
.qa .qi{background:color-mix(in srgb,currentColor 14%,transparent);border-radius:12px}
.nthumb,.fthumb{transition:transform .15s ease,box-shadow .15s ease}
@media (hover:hover){.nthumb:hover,.fthumb:hover{transform:translateY(-3px)}}
.grid-h{grid-column:1/-1;margin:6px 0 -14px;font:600 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* lupa psaní */
.zoom{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));height:34%;min-height:190px;max-height:400px;background:#fff;border:1px solid var(--bar-line);border-radius:16px;box-shadow:0 -4px 24px rgba(20,24,40,.14);z-index:6;display:flex;overflow:hidden}
.zoom[hidden]{display:none}
.zwrap{flex:1;position:relative;touch-action:none;min-width:0}
.zwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.zctl{display:grid;grid-template-columns:1fr 1fr;align-content:center;gap:2px;padding:6px;border-left:1px solid var(--bar-line);background:var(--bar)}
.zctl .ib{width:40px;height:40px;color:var(--bar-ink)}
#editor.zoomed .vpal{top:calc(33% - 10px)}
#editor.zoomed .pgchip{display:none}
/* kompaktní HUD v sešitu */
.fbar{top:calc(8px + env(safe-area-inset-top,0px));padding:3px;border-radius:10px;gap:1px;transition:opacity .25s}
.fbar .ib{width:38px;height:38px;border-radius:8px}
.fbar .ib svg{width:19px;height:19px}
.fl{left:max(8px,env(safe-area-inset-left,0px))} .fr{right:max(8px,env(safe-area-inset-right,0px))}
@media (max-width:880px){.fc{top:calc(54px + env(safe-area-inset-top,0px))} .fbar .ib{width:36px;height:36px}}
.vpal{left:max(8px,env(safe-area-inset-left,0px));padding:7px 5px;gap:6px;border-radius:22px;transition:opacity .25s}

function processPts(p){
  let pts=p;
  if(pts.length>3){const o=[pts[0]];for(let i=1;i<pts.length-1;i++){const a=pts[i-1],b=pts[i],c=pts[i+1];o.push([(a[0]+2*b[0]+c[0])/4,(a[1]+2*b[1]+c[1])/4,b[2]]);}o.push(pts[pts.length-1]);pts=o;}

function densify(pts,step){const out=[];for(let i=0;i<pts.length;i++){const b=pts[i];if(i>0){const a=pts[i-1],d=dist(a,b);if(d>step){const n=Math.ceil(d/step);for(let k=1;k<n;k++){const t=k/n;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]);}}}out.push(b);}return out;}

function drawTemplate(c,p){

    case 'mm':{const m=PW/210,col=dark?'255,180,120':'230,120,60';[[1,.09,.45],[5,.2,.7],[10,.34,1.1]].forEach(([st,al,lw])=>{c.strokeStyle=`rgba(${col},${al})`;c.lineWidth=lw;c.beginPath();for(let i=st;i*m<w;i+=st){c.moveTo(i*m,0);c.lineTo(i*m,h);}for(let i=st;i*m<h;i+=st){c.moveTo(0,i*m);c.lineTo(w,i*m);}c.stroke();});break;}
    case 'timetable':{const txt=dark?'rgba(255,255,255,.55)':'rgba(40,60,110,.62)';const x0=50,y0=120,hw=110,hh=60,cols=8,rows=5,cw=(w-x0*2-hw)/cols,rh=Math.min(200,(h-y0-80-hh)/rows);

function eraseSeg(a,x,y,scale){

function eraseAt(a,x,y,r){

    if(hlOnly&&it.k!=='hl'){out.push(it);continue;}
    const b=it.bb; if(x<b[0]-r||x>b[2]+r||y<b[1]-r||y>b[3]+r){out.push(it);continue;}

function renderRadial(){

  if(!radial.open){radialSvg.innerHTML='';return;}
  let s=`<g transform="translate(${radial.cx.toFixed(1)} ${radial.cy.toFixed(1)}) scale(${radK()})"><g class="rg"><circle r="${R3+6}" class="r-bg"/>`;
  const inn=radial.inner,ni=inn.length,di=2*Math.PI/ni,ai=-Math.PI/2-di/2;
  inn.forEach((it,i)=>{const a=ai+i*di,b=a+di,on=it.kind==='tool'&&it.id===T.tool;

    const m=(a+b)/2,rr=(R0+R1)/2;s+=`<svg x="${(Math.cos(m)*rr-12).toFixed(1)}" y="${(Math.sin(m)*rr-12).toFixed(1)}" width="24" height="24" viewBox="0 0 24 24" class="r-ic${on?' on':''}" data-k="inner-${i}">${IC[it.icon]}</svg>`;});

    else{const on=Math.abs(it.v-curSize())<0.01;s+=`<path d="${d0}" data-d0="${d0}" data-d1="${d1}" class="r-sec${on?' on':''}" data-k="outer-${i}"/>`;const m=(a+b)/2,rr=(R2+R3)/2;s+=`<circle cx="${(Math.cos(m)*rr).toFixed(1)}" cy="${(Math.sin(m)*rr).toFixed(1)}" r="${2+it.i*2.3}" class="r-dot" data-k="outer-${i}"/>`;}});
  s+=`<circle r="${RC}" class="r-center" id="rCenter"/><circle r="9" fill="${curColor()}" stroke="var(--line)"/>`;
  s+=`<g id="rLab" transform="translate(0 ${-(R3+24)})" visibility="hidden"><rect id="rLabR" y="-14" height="28" rx="14" class="r-lab"/><text id="rLabT" text-anchor="middle" y="4.5" class="r-labt"></text></g>`;

const ruler={on:false,cx:0,cy:0,ang:0,len:760,h:84};

function thumbEl(n){
  if(n.kind==='sheet'){const key=n.id+':'+n.updated,c=thumbs.get(n.id);if(c&&c.key===key){const im=new Image();im.alt='';im.src=c.url;return im;}const cv=sheetThumb(n);try{thumbs.set(n.id,{key,url:cv.toDataURL('image/png')});}catch(e){}return cv;}
  const p=n.pages[0];if(!p)return el('span',{class:'ph'});
  const key=n.id+':'+n.updated+':'+n.pages.length,c=thumbs.get(n.id);
  if(c&&c.key===key){const im=new Image();im.alt='';im.src=c.url;return im;}
  const w=Math.round(240*Math.min(2.5,devicePixelRatio||1)),s=w/p.w,cv=document.createElement('canvas');cv.width=w;cv.height=Math.round(p.h*s);
  const draw=()=>{const x=cv.getContext('2d');x.setTransform(s,0,0,s,0,0);drawPage(x,p,{thumb:true,noBadge:true});};
  draw();Promise.all([preload(p,true),p.bg?bgReady(p,w):0]).then(()=>{draw();try{thumbs.set(n.id,{key,url:cv.toDataURL('image/jpeg',0.93)});}catch(e){}});
  return cv;
}

function xlExtraFns(HF){
  if(HF._spanExtra)return;HF._spanExtra=true;
  const {FunctionPlugin,FunctionArgumentType:FA,SimpleRangeValue:SRV,ArraySize,CellError,ErrorType}=HF;
  const ID=(n)=>Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));
  const lu=m=>{const n=m.length,a=m.map(r=>r.slice());let det=1;const inv=ID(n);
    for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(a[r][c])>Math.abs(a[p][c]))p=r;
      if(Math.abs(a[p][c])<1e-13)return {det:0,inv:null};
      if(p!==c){[a[p],a[c]]=[a[c],a[p]];[inv[p],inv[c]]=[inv[c],inv[p]];det=-det;}
      const d=a[c][c];det*=d;for(let k=0;k<n;k++){a[c][k]/=d;inv[c][k]/=d;}
      for(let r=0;r<n;r++)if(r!==c){const f=a[r][c];if(f){for(let k=0;k<n;k++){a[r][k]-=f*a[c][k];inv[r][k]-=f*inv[c][k];}}}}
    const cl=v=>Math.abs(v)<1e-12?0:v;return {det:cl(det),inv:inv.map(r=>r.map(cl))};};
  const sq=(m,cb)=>{if(!m.hasOnlyNumbers())return new CellError(ErrorType.VALUE,'Matice smí obsahovat jen čísla');if(m.width()!==m.height())return new CellError(ErrorType.VALUE,'Matice musí být čtvercová');return cb(m.rawNumbers());};
  const sizeOf=(pl,ast,state)=>{if(ast.args.length!==1)return ArraySize.error();const st=Object.assign(Object.create(Object.getPrototypeOf(state)),state,{arraysFlag:true});const r=pl.arraySizeForAst(ast.args[0],st);return r.isScalar&&r.isScalar()&&!r.isRef?ArraySize.error():new ArraySize(r.width,r.height);};
  class SpanMatrix extends FunctionPlugin{
    mdeterm(ast,state){return this.runFunction(ast.args,state,this.metadata('MDETERM'),m=>sq(m,a=>lu(a).det));}
    minverse(ast,state){return this.runFunction(ast.args,state,this.metadata('MINVERSE'),m=>sq(m,a=>{const r=lu(a);return r.inv?SRV.onlyNumbers(r.inv):new CellError(ErrorType.NUM,'Matice je singulární (determinant 0)');}));}

    munit(ast,state){return this.runFunction(ast.args,state,this.metadata('MUNIT'),n=>{n=Math.trunc(n);if(n<1||n>500)return new CellError(ErrorType.VALUE,'Rozměr 1–500');return SRV.onlyNumbers(ID(n));});}
    munitSize(ast){const a=ast.args[0];if(ast.args.length===1&&a&&a.type==='NUMBER'&&a.value>=1)return new ArraySize(Math.trunc(a.value),Math.trunc(a.value));return ArraySize.error();}
  }
  SpanMatrix.implementedFunctions={
    MDETERM:{method:'mdeterm',parameters:[{argumentType:FA.RANGE}],vectorizationForbidden:true},
    MINVERSE:{method:'minverse',arraySizeMethod:'minverseSize',parameters:[{argumentType:FA.RANGE}],vectorizationForbidden:true,arrayFunction:true},
    MUNIT:{method:'munit',arraySizeMethod:'munitSize',parameters:[{argumentType:FA.NUMBER}]},
  };
  const cs={MDETERM:'DETERMINANT',MINVERSE:'INVERZE',MUNIT:'MATICE.JEDNOTKOVÁ'};
  Object.assign(HF.languages.csCZ.functions,cs);
  HF.registerFunctionPlugin(SpanMatrix,{enGB:{MDETERM:'MDETERM',MINVERSE:'MINVERSE',MUNIT:'MUNIT'},csCZ:cs});
  /* další funkce z novějšího Excelu */
  const vals=m=>m instanceof SRV?m.data.flat():[m];
  const isNum=v=>typeof v==='number'||(v&&typeof v==='object'&&typeof v.val==='number');
  const num=v=>typeof v==='number'?v:(v&&typeof v.val==='number'?v.val:NaN);
  const pairs=(ys,xs)=>{const a=vals(ys),b=vals(xs);if(a.length!==b.length)return null;const P=[];a.forEach((y,i)=>{if(isNum(y)&&isNum(b[i]))P.push([num(b[i]),num(y)]);});return P;};
  const lin=P=>{const n=P.length;if(n<2)return null;let sx=0,sy=0;P.forEach(([x,y])=>{sx+=x;sy+=y;});const mx=sx/n,my=sy/n;let sxy=0,sxx=0;P.forEach(([x,y])=>{sxy+=(x-mx)*(y-my);sxx+=(x-mx)**2;});if(!sxx)return null;const k=sxy/sxx;return {k,q:my-k*mx};};
  const NA=()=>new CellError(ErrorType.NA,'Hodnota nenalezena'),DIV=()=>new CellError(ErrorType.DIV_BY_ZERO,'Málo dat');
  const eqv=(a,b)=>typeof a==='string'&&typeof b==='string'?a.toLowerCase()===b.toLowerCase():num(a)===num(b)&&isNum(a)&&isNum(b)||a===b;
  const litSize=(ast,i,def)=>{const a=ast.args[i];if(!a)return def;return a.type==='NUMBER'?Math.trunc(a.value):null;};
  const arrSt=st=>Object.assign(Object.create(Object.getPrototypeOf(st)),st,{arraysFlag:true});
  class SpanModern extends FunctionPlugin{
    xlookup(ast,state){return this.runFunction(ast.args,state,this.metadata('XLOOKUP'),(key,look,ret,nf)=>{const L=vals(look),R=ret.data;const i=L.findIndex(v=>eqv(v,key));if(i<0)return nf===undefined?NA():nf;
      const flat=R.length===1?R[0]:R.map(r=>r[0]);if(R.length>1&&R[0].length>1&&look.height()===1)return R[0][i]??NA();return flat[i]===undefined?NA():flat[i];});}
    textjoin(ast,state){return this.runFunction(ast.args,state,this.metadata('TEXTJOIN'),(d,ign,...rest)=>{const out=[];rest.forEach(a=>vals(a).forEach(v=>{if(typeof v==='symbol'||v===null||v===undefined)v='';if(ign&&v==='')return;out.push(isNum(v)?String(num(v)).replace('.',','):String(v));}));return out.join(d);});}
    intercept(ast,state){return this.runFunction(ast.args,state,this.metadata('INTERCEPT'),(y,x)=>{const P=pairs(y,x);if(!P)return NA();const r=lin(P);return r?r.q:DIV();});}
    forecast(ast,state){return this.runFunction(ast.args,state,this.metadata('FORECAST'),(x0,y,x)=>{const P=pairs(y,x);if(!P)return NA();const r=lin(P);return r?r.q+r.k*x0:DIV();});}
    linest(ast,state){return this.runFunction(ast.args,state,this.metadata('LINEST'),(y,x)=>{const P=pairs(y,x);if(!P)return NA();const r=lin(P);return r?SRV.onlyNumbers([[r.k,r.q]]):DIV();});}
    linestSize(){return new ArraySize(2,1);}
    irr(ast,state){return this.runFunction(ast.args,state,this.metadata('IRR'),(m,g)=>{const c=vals(m).filter(isNum).map(num);if(c.length<2)return DIV();let r=g;
      for(let it=0;it<200;it++){let f=0,df=0;c.forEach((v,t)=>{f+=v/Math.pow(1+r,t);df-=t*v/Math.pow(1+r,t+1);});if(!df)break;const nr=r-f/df;if(!isFinite(nr))break;if(Math.abs(nr-r)<1e-10)return nr;r=nr;}
      return new CellError(ErrorType.NUM,'Výpočet nekonverguje');});}
    sequence(ast,state){return this.runFunction(ast.args,state,this.metadata('SEQUENCE'),(r,c,st,sp)=>{r=Math.trunc(r);c=Math.trunc(c);const o=[];for(let i=0;i<r;i++){o.push([]);for(let j=0;j<c;j++)o[i].push(st+(i*c+j)*sp);}return SRV.onlyNumbers(o);});}
    sequenceSize(ast){const r=litSize(ast,0,1),c=litSize(ast,1,1);if(!r||!c||r<1||c<1||r*c>1e5)return ArraySize.error();return new ArraySize(c,r);}
    sort(ast,state){return this.runFunction(ast.args,state,this.metadata('SORT'),(m,idx,ord)=>{const rows=m.data.map(r=>r.slice());const k=Math.max(0,Math.trunc(idx)-1),o=ord<0?-1:1;
      const key=v=>typeof v==='symbol'?[3,0]:isNum(v)?[0,num(v)]:typeof v==='string'?[1,v.toLowerCase()]:typeof v==='boolean'?[2,+v]:[3,0];
      rows.sort((a,b)=>{const A=key(a[k]),B=key(b[k]);if(A[0]!==B[0])return A[0]-B[0];return (A[1]<B[1]?-1:A[1]>B[1]?1:0)*o;});return SRV.onlyValues(rows);});}
    sortSize(ast,state){const r=this.arraySizeForAst(ast.args[0],arrSt(state));return new ArraySize(r.width,r.height);}
    frequency(ast,state){return this.runFunction(ast.args,state,this.metadata('FREQUENCY'),(d,b)=>{const D=vals(d).filter(isNum).map(num),B=vals(b).filter(isNum).map(num);const S=B.map((v,i)=>[v,i]).sort((x,y)=>x[0]-y[0]);const out=new Array(B.length+1).fill(0);
      D.forEach(v=>{const j=S.find(([lim])=>v<=lim);out[j?j[1]:B.length]++;});return SRV.onlyNumbers(out.map(v=>[v]));});}
    frequencySize(ast,state){if(ast.args.length!==2)return ArraySize.error();const r=this.arraySizeForAst(ast.args[1],arrSt(state));return new ArraySize(1,r.width*r.height+1);}
  }
  const R=FA.RANGE,N=FA.NUMBER,Any=FA.ANY;
  SpanModern.implementedFunctions={
    XLOOKUP:{method:'xlookup',parameters:[{argumentType:Any},{argumentType:R},{argumentType:R},{argumentType:Any,optionalArg:true}],vectorizationForbidden:true},
    TEXTJOIN:{method:'textjoin',parameters:[{argumentType:FA.STRING},{argumentType:FA.BOOLEAN},{argumentType:Any}],repeatLastArgs:1,vectorizationForbidden:true},
    INTERCEPT:{method:'intercept',parameters:[{argumentType:R},{argumentType:R}],vectorizationForbidden:true},
    FORECAST:{method:'forecast',parameters:[{argumentType:N},{argumentType:R},{argumentType:R}]},
    'FORECAST.LINEAR':{method:'forecast',parameters:[{argumentType:N},{argumentType:R},{argumentType:R}]},
    LINEST:{method:'linest',arraySizeMethod:'linestSize',parameters:[{argumentType:R},{argumentType:R}],vectorizationForbidden:true},
    IRR:{method:'irr',parameters:[{argumentType:R},{argumentType:N,defaultValue:0.1}],vectorizationForbidden:true},
    SEQUENCE:{method:'sequence',arraySizeMethod:'sequenceSize',parameters:[{argumentType:N},{argumentType:N,defaultValue:1},{argumentType:N,defaultValue:1},{argumentType:N,defaultValue:1}]},
    SORT:{method:'sort',arraySizeMethod:'sortSize',parameters:[{argumentType:R},{argumentType:N,defaultValue:1},{argumentType:N,defaultValue:1}],vectorizationForbidden:true},
    FREQUENCY:{method:'frequency',arraySizeMethod:'frequencySize',parameters:[{argumentType:R},{argumentType:R}],vectorizationForbidden:true},
  };

  Object.assign(HF.languages.csCZ.functions,cs2);

}
/* ---------- překlad vzorců mezi Excelem (anglicky) a českým zápisem ---------- */
let FN_EN2CS=null,FN_CS2EN=null;
function fnMaps(){if(FN_EN2CS)return;const d=window.HyperFormula.languages.csCZ.functions;FN_EN2CS={};FN_CS2EN={};for(const k in d){FN_EN2CS[k.toUpperCase()]=d[k];FN_CS2EN[d[k].toUpperCase()]=k;}}
function xlTranslate(f,toCs){
  fnMaps();let out='',i=0;const n=f.length;
  while(i<n){
    const ch=f[i];
    if(ch==='"'){let j=i+1;while(j<n){if(f[j]==='"'){if(f[j+1]==='"'){j+=2;continue;}break;}j++;}out+=f.slice(i,j+1);i=j+1;continue;}
    if(ch==="'"){let j=f.indexOf("'",i+1);if(j<0)j=n-1;out+=f.slice(i,j+1);i=j+1;continue;}
    const rest=f.slice(i),m=/^[A-Za-z_À-ſ][A-Za-z0-9_.À-ſ]*/.exec(rest);
    if(m){const w=m[0];if(f[i+w.length]==='('){const up=w.toUpperCase().replace(/^_XLFN\./,'').replace(/^_XLWS\./,'');out+=(toCs?FN_EN2CS[up]:FN_CS2EN[up])||up;}else out+=w;i+=w.length;continue;}
    if(/[0-9]/.test(ch)){const m2=(toCs?/^\d+(\.\d+)?([eE][-+]?\d+)?/:/^\d+(,\d+)?([eE][-+]?\d+)?/).exec(rest);out+=toCs?m2[0].replace('.',','):m2[0].replace(',','.');i+=m2[0].length;continue;}
    out+=toCs&&ch===','?';':(!toCs&&ch===';'?',':ch);i++;
  }
  return out;
}

/* ---------- zobrazení hodnot ---------- */
function xlFmtVal(v,f,dt){
  if(v===null||v===undefined||v==='')return '';
  if(typeof v==='object')return v.value||'#CHYBA';
  if(typeof v==='boolean')return v?'PRAVDA':'NEPRAVDA';
  if(typeof v==='number'){
    let nf=f&&f.nf;const dp=f&&f.dp!=null?f.dp:null;
    if(!nf){if(dt==='NUMBER_DATE')nf='date';else if(dt==='NUMBER_PERCENT')nf='pct';else if(dt==='NUMBER_CURRENCY')nf='czk';else if(dt==='NUMBER_TIME')nf='time';else if(dt==='NUMBER_DATETIME')nf='datetime';}
    const loc=(x,d)=>x.toLocaleString('cs-CZ',{minimumFractionDigits:d,maximumFractionDigits:d});
    switch(nf){
      case 'num2':return loc(v,dp??2);
      case 'int':return loc(v,0);
      case 'pct':return loc(v*100,dp??0)+' %';
      case 'czk':return loc(v,dp??2)+' Kč';
      case 'date':case 'datetime':{try{const d=XL.hf.numberToDate(v);let s=`${d.day}. ${d.month}. ${d.year}`;if(nf==='datetime'){const t=XL.hf.numberToTime(v%1);s+=` ${t.hours}:${String(t.minutes).padStart(2,'0')}`;}return s;}catch(e){return String(v);}}
      case 'time':{try{const t=XL.hf.numberToTime(v%1);return `${t.hours}:${String(t.minutes).padStart(2,'0')}`;}catch(e){return String(v);}}
    }
    if(dp!=null)return loc(v,dp);
    const a=Math.abs(v);if(a!==0&&(a>=1e11||a<1e-9))return v.toExponential(4).replace('.',',');
    return Number(v.toPrecision(11)).toLocaleString('cs-CZ',{maximumFractionDigits:10,useGrouping:false});
  }
  return String(v);
}
function rawText(r,c){
  const s=XL.hf.getCellSerialized(A(r,c));
  if(s===null||s===undefined)return '';
  if(typeof s==='number')return String(s).replace('.',',');
  if(typeof s==='boolean')return s?'PRAVDA':'NEPRAVDA';
  return String(s);
}
function parseInput(raw){
  const s=String(raw==null?'':raw);if(s==='')return {val:null};if(s[0]==='=')return {val:s.split('"').map((x,i)=>i%2?x:x.replace(/(^|[^A-Za-zÀ-ž0-9_.])(PRAVDA|NEPRAVDA)(?![A-Za-zÀ-ž0-9_.(])/gi,(m,p,w)=>p+w.toUpperCase()+'()')).join('"')};
  const t=s.trim(),num=x=>parseFloat(x.replace(/[\s ]/g,'').replace(',','.'));
  let m=t.match(/^(-?[\d\s ]*\d(?:,\d+)?)\s?%$/);if(m)return {val:num(m[1])/100,nf:'pct'};
  m=t.match(/^(-?[\d\s ]*\d(?:,\d+)?)\s?(Kč|,-)$/i);if(m)return {val:num(m[1]),nf:'czk'};
  if(/^-?\d{1,3}([\s ]\d{3})+(,\d+)?$/.test(t))return {val:num(t)};
  if(/^-?\d+,\d+$/.test(t))return {val:num(t)};
  if(/^pravda$/i.test(t))return {val:true};if(/^nepravda$/i.test(t))return {val:false};
  return {val:s};
}

/* ---------- historie (obsah přes HyperFormula, formát a šířky sloupců zvlášť) ---------- */
const imgCopy=()=>(SH().imgs||[]).map(o=>Object.assign({},o));
function xlSnap(hf){XL.undo.push({hf,imgs:imgCopy(),sheet:XL.sheet,fmt:JSON.stringify(SH().fmt),colW:JSON.stringify(SH().colW),rows:SH().rows,cols:SH().cols});if(XL.undo.length>300)XL.undo.shift();XL.redo=[];xlUndoUI();}
function xlHist(from,to,isUndo){
  xlCancel();const e=from.pop();if(!e){toast(isUndo?'Není co vrátit':'Není co opakovat');return;}
  if(e.sheet!==XL.sheet)xlSwitch(e.sheet,true);
  to.push({hf:e.hf,n:e.n,imgs:imgCopy(),sheet:e.sheet,fmt:JSON.stringify(SH().fmt),colW:JSON.stringify(SH().colW),rows:SH().rows,cols:SH().cols});
  if(e.hf){for(let i=0;i<(e.n||1);i++){try{isUndo?XL.hf.undo():XL.hf.redo();}catch(err){}}}
  if(e.imgs)SH().imgs=e.imgs;xlImgSel=null;Object.assign(SH(),{fmt:JSON.parse(e.fmt),colW:JSON.parse(e.colW),rows:e.rows,cols:e.cols});
  xlLayout();xlRender();xlChanged();xlUndoUI();
}
const xlUndo=()=>xlHist(XL.undo,XL.redo,true), xlRedo=()=>xlHist(XL.redo,XL.undo,false);

let xlSaveT=0;
function xlChanged(){if(!XL.doc)return;XL.doc.updated=Date.now();clearTimeout(xlSaveT);xlSaveT=setTimeout(xlSave,700);}
function trim2D(a){const out=a.map(r=>{let e=r.length;while(e>0&&(r[e-1]===null||r[e-1]===undefined||r[e-1]===''))e--;return r.slice(0,e);});let e=out.length;while(e>0&&!out[e-1].length)e--;return out.slice(0,e);}
function xlSave(){
  clearTimeout(xlSaveT);const d=XL.doc;if(!d||!XL.hf)return;
  d.sheets.forEach(sh=>{const id=XL.hf.getSheetId(sh.name);if(id!==undefined)sh.data=trim2D(XL.hf.getSheetSerialized(id));});
  const sh=d.sheets[0],id=XL.hf.getSheetId(sh.name),pv=[];
  if(id!==undefined)for(let r=0;r<16;r++){const row=[];for(let c=0;c<7;c++){const a={sheet:id,row:r,col:c};row.push(xlFmtVal(XL.hf.getCellValue(a),sh.fmt[r+','+c],XL.hf.getCellValueDetailedType(a)));}pv.push(row);}
  d.preview=pv;DB.put(d);
}

/* ---------- mřížka ---------- */
const grid=()=>$('#xlGrid');
function colW(c){return SH().colW[c]||100;}
function findCol(x){const xs=XL.xs;let lo=0,hi=xs.length-2;while(lo<hi){const m=(lo+hi+1)>>1;if(xs[m]<=x)lo=m;else hi=m-1;}return lo;}
let xlRAF=0;
function xlRender(){if(xlRAF)return;xlRAF=requestAnimationFrame(()=>{xlRAF=0;xlDraw();});}
function xlLayout(){
  const sh=SH(),xs=[XL.HW];for(let c=0;c<sh.cols;c++)xs.push(xs[c]+colW(c));XL.xs=xs;
  const fz=sh.fz||{r:0,c:0};

  let h=`<div class="xl-chr"><div class="xl-corner" style="width:${XL.HW}px"></div>`;
  for(let c=0;c<sh.cols;c++)h+=`<div class="xh" data-c="${c}" style="width:${colW(c)}px${c<fz.c?`;position:sticky;left:${xs[c]}px;z-index:4;background:var(--surface-2)`:''}">${colName(c)}<i class="grip" data-grip="${c}"></i></div>`;
  $('#xlCH').innerHTML=h+'</div><div id="xlFzRows"></div>';
  xlImgs();

function xlRowHtml(r,cols,frozen){
  const sh=SH(),id=sid(),s=selN(),fz=sh.fz||{r:0,c:0};
  let h=`<div class="xr${frozen?' xr-fz':''}" style="${frozen?'':`top:${XL.CH+r*XL.RH}px;`}width:${XL.xs[sh.cols]}px"><div class="xrh${r>=s.r1&&r<=s.r2?' on':''}" data-r="${r}" style="width:${XL.HW}px">${r+1}</div>`;
  let x=XL.HW;
  for(const c of cols){
    if(XL.xs[c]>x){h+=`<div style="width:${XL.xs[c]-x}px;flex:none"></div>`;}x=XL.xs[c+1];
    const a={sheet:id,row:r,col:c},v=XL.hf.getCellValue(a),f=sh.fmt[r+','+c];
    let txt='',cls='xc',st='';
    if(v!==null&&v!==undefined){const dt=typeof v==='number'?XL.hf.getCellValueDetailedType(a):null;txt=xlFmtVal(v,f,dt);if(typeof v==='number'||typeof v==='boolean')cls+=' n';if(typeof v==='object')cls+=' err n';}
    if(f){if(f.b)st+='font-weight:700;';if(f.i)st+='font-style:italic;';if(f.al)st+=`text-align:${f.al};`;if(f.bg)st+=`background:${f.bg};`;if(f.fc)st+=`color:${f.fc};`;
      const bs=[];if(f.bt)bs.push('inset 0 1.5px 0 var(--ink)');if(f.bb)bs.push('inset 0 -1.5px 0 var(--ink)');if(f.bl)bs.push('inset 1.5px 0 0 var(--ink)');if(f.br)bs.push('inset -1.5px 0 0 var(--ink)');if(bs.length)st+=`box-shadow:${bs.join(',')};`;}
    if(c<fz.c){st+=`position:sticky;left:${XL.xs[c]}px;z-index:1;`;if(!(f&&f.bg))st+='background:var(--surface);';cls+=' fzc';}
    h+=`<div class="${cls}" style="width:${colW(c)}px;${st}">${esc(txt)}</div>`;
  }
  return h+'</div>';
}
function xlDraw(){
  if(!XL.hf||!XL.doc)return;
  const g=grid(),sh=SH(),RH=XL.RH,fz=sh.fz||{r:0,c:0};
  const r0=Math.max(0,Math.floor(g.scrollTop/RH)-4),r1=Math.min(sh.rows-1,Math.ceil((g.scrollTop+g.clientHeight)/RH)+4);
  const cx0=g.scrollLeft,cx1=g.scrollLeft+g.clientWidth;
  const c0=Math.max(fz.c,findCol(cx0)-1),c1=Math.min(sh.cols-1,findCol(cx1)+1);
  const cols=[];for(let c=0;c<fz.c;c++)cols.push(c);for(let c=c0;c<=c1;c++)cols.push(c);
  const s=selN();let h='';
  for(let r=Math.max(r0,fz.r);r<=r1;r++)h+=xlRowHtml(r,cols,false);
  $('#xlBody').innerHTML=h;
  let fh='';for(let r=0;r<fz.r;r++)fh+=xlRowHtml(r,cols,true);
  const fzEl=$('#xlFzRows');if(fzEl)fzEl.innerHTML=fh;
  document.querySelectorAll('#xlCH .xh').forEach(e=>{const c=+e.dataset.c;e.classList.toggle('on',c>=s.c1&&c<=s.c2);});
  xlSelUI();
  if(g.scrollTop+g.clientHeight>XL.CH+sh.rows*RH-RH*6){sh.rows+=50;xlLayout();xlRender();}
  else if(g.scrollLeft+g.clientWidth>XL.xs[sh.cols]-150&&sh.cols<400){sh.cols+=10;xlLayout();xlRender();}
}
function xlFreeze(r,c){xlCommit();SH().fz={r,c};xlLayout();xlRender();xlChanged();toast(r||c?'Ukotveno':'Ukotvení zrušeno');}
function xlBorder(kind){
  xlCommit();xlSnap(false);const s=selN(),F=SH().fmt;
  eachSel((r,c)=>{const k=r+','+c,o=Object.assign({},F[k]);
    if(kind==='none'){delete o.bt;delete o.bb;delete o.bl;delete o.br;}
    else if(kind==='all'){o.bt=o.bb=o.bl=o.br=true;}
    else if(kind==='outer'){if(r===s.r1)o.bt=true;if(r===s.r2)o.bb=true;if(c===s.c1)o.bl=true;if(c===s.c2)o.br=true;}
    else if(kind==='bottom'){if(r===s.r2)o.bb=true;}
    if(Object.keys(o).length)F[k]=o;else delete F[k];});
  xlChanged();xlRender();
}

  for(let r=0;r<Math.min(dim.height,3000);r++){const a={sheet:id,row:r,col:c},v=XL.hf.getCellValue(a);if(v===null||v===undefined)continue;const f=sh.fmt[r+','+c];mctx.font=(f&&f.b?'700 ':'')+'14px Inter, system-ui, sans-serif';w=Math.max(w,mctx.measureText(xlFmtVal(v,f,typeof v==='number'?XL.hf.getCellValueDetailedType(a):null)).width+18);}

    const id=sid();
    nx.onclick=()=>{const t=norm(q.value);if(!t)return;const dim=XL.hf.getSheetDimensions(id),W_=Math.max(1,dim.width),start=XL.sel.r*W_+XL.sel.c+1,N=dim.height*W_;
      for(let k=0;k<N;k++){const i=(start+k)%N,r=Math.floor(i/W_),c=i%W_;const v=XL.hf.getCellValue({sheet:id,row:r,col:c});if(v==null)continue;
        if(norm(rawText(r,c)).includes(t)||norm(xlFmtVal(v,SH().fmt[r+','+c],null)).includes(t)){xlSelect(r,c);st.textContent='Nalezeno v '+aName(r,c);return;}}

function ensureVisible(r,c){
  const g=grid(),top=XL.CH+r*XL.RH,bot=top+XL.RH,left=XL.xs[c],right=XL.xs[c+1];
  if(top-XL.CH<g.scrollTop)g.scrollTop=top-XL.CH;else if(bot>g.scrollTop+g.clientHeight)g.scrollTop=bot-g.clientHeight;
  if(left-XL.HW<g.scrollLeft)g.scrollLeft=left-XL.HW;else if(right>g.scrollLeft+g.clientWidth)g.scrollLeft=right-g.clientWidth;
}
function xlSelect(r,c,extend){
  const sh=SH();r=clamp(r,0,sh.rows-1);c=clamp(c,0,sh.cols-1);
  if(extend){XL.sel.r2=r;XL.sel.c2=c;}else XL.sel={r,c,r2:r,c2:c};
  ensureVisible(r,c);xlRender();
}

function setCell(r,c,raw){
  const p=parseInput(raw);xlSnap(true);
  try{XL.hf.setCellContents(A(r,c),[[p.val]]);}catch(e){XL.undo.pop();toast('Neplatný vzorec: '+e.message);return false;}
  if(p.nf){const k=r+','+c;SH().fmt[k]=Object.assign({},SH().fmt[k],{nf:p.nf});}
  xlChanged();return true;
}
function xlStartEdit(initial,src){
  const r=XL.sel.r,c=XL.sel.c,ed=$('#xlEd');XL.sel.r2=r;XL.sel.c2=c;
  XL.edit={r,c,src:src||'cell'};
  const val=initial!=null?initial:rawText(r,c);
  if(XL.edit.src==='cell'){ensureVisible(r,c);ed.hidden=false;ed.value=val;ed.style.left=XL.xs[c]+'px';ed.style.top=(XL.CH+r*XL.RH)+'px';ed.style.minWidth=Math.max(colW(c),140)+'px';ed.style.height=XL.RH+'px';
    const f=SH().fmt[r+','+c]||{};ed.style.fontWeight=f.b?'700':'';ed.style.fontStyle=f.i?'italic':'';
    ed.focus();const n=ed.value.length;try{ed.setSelectionRange(n,n);}catch(e){}}
  $('#xlFx').value=val;xlSelUI();
}
function xlCommit(move){
  if(!XL.edit)return;const e=XL.edit;XL.edit=null;XL.ref=null;
  const v=(e.src==='fx'?$('#xlFx'):$('#xlEd')).value;$('#xlEd').hidden=true;
  if(v!==rawText(e.r,e.c))setCell(e.r,e.c,v);
  if(move)xlSelect(e.r+move[0],e.c+move[1]);else xlRender();
}
function xlCancel(){if(!XL.edit)return;XL.edit=null;XL.ref=null;$('#xlEd').hidden=true;xlRender();}
function eachSel(fn){const s=selN();let n=0;for(let r=s.r1;r<=s.r2;r++)for(let c=s.c1;c<=s.c2;c++){if(++n>20000)return;fn(r,c);}}
function xlFmt(patch){
  xlCommit();xlSnap(false);const F=SH().fmt;
  eachSel((r,c)=>{const k=r+','+c,o=Object.assign({},F[k],patch);for(const x in o)if(o[x]===undefined||o[x]===''||o[x]===false||o[x]===null)delete o[x];if(Object.keys(o).length)F[k]=o;else delete F[k];});
  xlChanged();xlRender();
}
function xlClear(){
  xlSnap(true);const s=selN(),rows=[];for(let r=s.r1;r<=s.r2;r++){const row=[];for(let c=s.c1;c<=s.c2;c++)row.push(null);rows.push(row);}
  XL.hf.setCellContents(A(s.r1,s.c1),rows);xlChanged();
}
function curFmt(){return SH().fmt[XL.sel.r+','+XL.sel.c]||{};}
function stepDp(d){const f=curFmt();let dp=f.dp!=null?f.dp:(f.nf==='pct'||f.nf==='int'?0:2);dp=clamp(dp+d,0,10);xlFmt({dp,nf:f.nf&&f.nf!=='int'?f.nf:'num2'});}

/* ---------- výplň (táhlo v rohu výběru), kopírování ---------- */
function fillTo(tr,tc){
  const s=selN(),sh=sid(),F=SH().fmt,fmtBefore=JSON.stringify(F);
  const dDown=tr-s.r2,dUp=s.r1-tr,dRight=tc-s.c2,dLeft=s.c1-tc;
  const vmax=Math.max(dDown,dUp,0),hmax=Math.max(dRight,dLeft,0);
  if(!vmax&&!hmax)return;
  const vert=vmax>=hmax,ops=[],get=(r,c)=>XL.hf.getCellSerialized({sheet:sh,row:r,col:c});
  const series=src=>{if(src.length<2||!src.every(v=>typeof v==='number'))return null;const st=src[1]-src[0];return src.every((v,i)=>i===0||Math.abs(v-src[i-1]-st)<1e-9)?st:null;};
  const copyOp=(r1,c1,r2,c2,tr_,tc_)=>()=>{XL.hf.copy({start:{sheet:sh,row:r1,col:c1},end:{sheet:sh,row:r2,col:c2}});XL.hf.paste({sheet:sh,row:tr_,col:tc_});};
  if(vert){
    const h=s.r2-s.r1+1,down=dDown>0;
    if(down)for(let r=s.r2+1;r<=tr;r+=h){const cnt=Math.min(h,tr-r+1);ops.push(copyOp(s.r1,s.c1,s.r1+cnt-1,s.c2,r,s.c1));}
    else for(let end=s.r1-1;end>=tr;end-=h){const start=Math.max(tr,end-h+1),cnt=end-start+1;ops.push(copyOp(s.r2-cnt+1,s.c1,s.r2,s.c2,start,s.c1));}
    for(let c=s.c1;c<=s.c2;c++){const src=[];for(let r=s.r1;r<=s.r2;r++)src.push(get(r,c));const st=series(src);
      if(st!==null){const vals=[];if(down)for(let k=1;k<=tr-s.r2;k++)vals.push([src[h-1]+st*k]);else for(let r=tr;r<s.r1;r++)vals.push([src[0]-st*(s.r1-r)]);
        ops.push(()=>XL.hf.setCellContents({sheet:sh,row:down?s.r2+1:tr,col:c},vals));}
      const rows=down?range(s.r2+1,tr):range(tr,s.r1-1);rows.forEach(r=>{const off=down?(r-s.r2-1)%h:(h-1-((s.r1-1-r)%h));const sf=F[(s.r1+off)+','+c];if(sf)F[r+','+c]=Object.assign({},sf);else delete F[r+','+c];});}
    if(down){XL.sel.r=s.r1;XL.sel.r2=tr;}else{XL.sel.r=tr;XL.sel.r2=s.r2;}XL.sel.c=s.c1;XL.sel.c2=s.c2;
  }else{
    const w=s.c2-s.c1+1,right=dRight>0;
    if(right)for(let c=s.c2+1;c<=tc;c+=w){const cnt=Math.min(w,tc-c+1);ops.push(copyOp(s.r1,s.c1,s.r2,s.c1+cnt-1,s.r1,c));}
    else for(let end=s.c1-1;end>=tc;end-=w){const start=Math.max(tc,end-w+1),cnt=end-start+1;ops.push(copyOp(s.r1,s.c2-cnt+1,s.r2,s.c2,s.r1,start));}
    for(let r=s.r1;r<=s.r2;r++){const src=[];for(let c=s.c1;c<=s.c2;c++)src.push(get(r,c));const st=series(src);
      if(st!==null){const row=[];if(right)for(let k=1;k<=tc-s.c2;k++)row.push(src[w-1]+st*k);else for(let c=tc;c<s.c1;c++)row.push(src[0]-st*(s.c1-c));
        ops.push(()=>XL.hf.setCellContents({sheet:sh,row:r,col:right?s.c2+1:tc},[row]));}
      const cols=right?range(s.c2+1,tc):range(tc,s.c1-1);cols.forEach(c=>{const off=right?(c-s.c2-1)%w:(w-1-((s.c1-1-c)%w));const sf=F[r+','+(s.c1+off)];if(sf)F[r+','+c]=Object.assign({},sf);else delete F[r+','+c];});}
    if(right){XL.sel.c=s.c1;XL.sel.c2=tc;}else{XL.sel.c=tc;XL.sel.c2=s.c2;}XL.sel.r=s.r1;XL.sel.r2=s.r2;
  }
  // formát už je změněný – snímek historie s původním formátem
  XL.undo.push({hf:true,n:ops.length,sheet:XL.sheet,fmt:fmtBefore,colW:JSON.stringify(SH().colW),rows:SH().rows,cols:SH().cols});XL.redo=[];xlUndoUI();
  ops.forEach(f=>f());xlChanged();xlRender();
}
const range=(a,b)=>{const o=[];for(let i=a;i<=b;i++)o.push(i);return o;};
function xlCopy(cut){
  xlCommit();const s=selN(),sh=sid(),rows=[];
  for(let r=s.r1;r<=s.r2;r++){const row=[];for(let c=s.c1;c<=s.c2;c++)row.push(xlFmtVal(XL.hf.getCellValue({sheet:sh,row:r,col:c}),SH().fmt[r+','+c],null));rows.push(row.join('\t'));}
  const tsv=rows.join('\n');
  XL.hf.copy({start:{sheet:sh,row:s.r1,col:s.c1},end:{sheet:sh,row:s.r2,col:s.c2}});
  const fm={};for(let r=s.r1;r<=s.r2;r++)for(let c=s.c1;c<=s.c2;c++){const f=SH().fmt[r+','+c];if(f)fm[(r-s.r1)+','+(c-s.c1)]=f;}
  XL.clip={tsv,fmt:fm,cut:cut?{sheet:XL.sheet,s}:null};
  try{navigator.clipboard&&navigator.clipboard.writeText(tsv).catch(()=>{});}catch(e){}
  toast(cut?'Vyjmuto – vložte jinam':'Zkopírováno');return tsv;
}
function xlPaste(text){
  xlCommit();const r0=XL.sel.r,c0=XL.sel.c;
  if(XL.clip&&(text==null||text===XL.clip.tsv)){
    xlSnap(true);
    try{XL.hf.paste(A(r0,c0));}catch(e){XL.undo.pop();toast('Vložení se nezdařilo');return;}
    for(const k in XL.clip.fmt){const[dr,dc]=k.split(',').map(Number);SH().fmt[(r0+dr)+','+(c0+dc)]=Object.assign({},XL.clip.fmt[k]);}
    if(XL.clip.cut){const{s,sheet}=XL.clip.cut;if(sheet===XL.sheet){const rows=[];for(let r=s.r1;r<=s.r2;r++){const row=[];for(let c=s.c1;c<=s.c2;c++){const inside=r>=r0&&r<r0+(s.r2-s.r1+1)&&c>=c0&&c<c0+(s.c2-s.c1+1);row.push(inside?XL.hf.getCellSerialized(A(r,c)):null);}rows.push(row);}XL.hf.setCellContents(A(s.r1,s.c1),rows);}XL.clip.cut=null;}

function shiftFmt(axis,at,d){
  const F=SH().fmt,out={},cw=SH().colW,ow={};
  for(const k in F){let[r,c]=k.split(',').map(Number);if(axis==='r'){if(d<0&&r>=at&&r<at-d)continue;if(r>=at)r+=d;}else{if(d<0&&c>=at&&c<at-d)continue;if(c>=at)c+=d;}out[r+','+c]=F[k];}
  SH().fmt=out;
  if(axis==='c'){for(const k in cw){let c=+k;if(d<0&&c>=at&&c<at-d)continue;if(c>=at)c+=d;ow[c]=cw[k];}SH().colW=ow;}
}
function xlRows(op){

function xlSort(asc){
  xlCommit();const id=sid(),dim=XL.hf.getSheetDimensions(id),s=selN();
  let r1,r2,c1,c2,key=XL.sel.c;
  if(s.r2>s.r1){r1=s.r1;r2=s.r2;c1=s.c1;c2=s.c2;}else{r1=0;r2=dim.height-1;c1=0;c2=dim.width-1;const h=XL.hf.getCellValue({sheet:id,row:0,col:key});const b=XL.hf.getCellValue({sheet:id,row:1,col:key});if(typeof h==='string'&&typeof b!=='string')r1=1;}
  if(r2<=r1){toast('Není co řadit');return;}
  const rows=[];for(let r=r1;r<=r2;r++){const ser=[],fm=[];for(let c=c1;c<=c2;c++){ser.push(XL.hf.getCellSerialized({sheet:id,row:r,col:c}));fm.push(SH().fmt[r+','+c]);}rows.push({k:XL.hf.getCellValue({sheet:id,row:r,col:key}),ser,fm});}
  const cmp=(a,b)=>{const x=a.k,y=b.k;if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;if(typeof x==='number'&&typeof y==='number')return asc?x-y:y-x;const r=String(x).localeCompare(String(y),'cs',{numeric:true});return asc?r:-r;};
  rows.sort(cmp);xlSnap(true);
  XL.hf.setCellContents({sheet:id,row:r1,col:c1},rows.map(o=>o.ser));
  rows.forEach((o,i)=>o.fm.forEach((f,j)=>{const k=(r1+i)+','+(c1+j);if(f)SH().fmt[k]=f;else delete SH().fmt[k];}));
  xlChanged();xlRender();toast(asc?'Seřazeno vzestupně':'Seřazeno sestupně');
}
function autoSum(){

function xlImgDrag(e,o,d,mode){
  e.stopPropagation();e.preventDefault();xlCommit&&xlCommit();
  const wasSel=xlImgSel===o.id;const x0=e.clientX,y0=e.clientY,ox=o.x,oy=o.y,ow=o.w,oh=o.h,ratio=o.h/o.w;let moved=false;

    if(mode==='move'){o.x=Math.max(XL.HW,ox+dx);o.y=Math.max(XL.CH,oy+dy);}else{o.w=Math.max(40,ow+dx);o.h=ev.shiftKey?Math.max(30,oh+dy):o.w*ratio;}

function openHelp(){

<li><b>Kolečko nástrojů:</b> přiložte pero a chvíli ho nechte stát. Kolem hrotu se objeví kolečko – přejeďte perem na nástroj, barvu nebo tloušťku a zvedněte. Boční tlačítko pera otevře kolečko okamžitě.</li>

<li><b>Páska na učení:</b> nástroj Páska (v liště vedle zvýrazňovače, klávesa U) – táhněte přes pojem, výsledek nebo slovíčko. Klepnutím perem či prstem pásku odkryjete a zase zakryjete. Menu ⋯ → <i>Opakování s páskou</i> projde všechny pásky jako kartičky (Umím / Neumím, chyby se opakují).</li>
<li><b>Odkazy:</b> označte cokoli lasem a klepněte na řetěz – propojíte to s jinou stránkou nebo webem. Klepnutím na modrou šipku odkaz otevřete, vlevo dole je tlačítko Zpět.</li>
<li><b>Osnova:</b> hvězdička u stránky (panel Stránky) přidá pojmenovanou záložku. Menu ⋯ → <i>Osnova a záložky</i> je rychlý obsah sešitu.</li>
<li><b>Přehled stránek:</b> panel Stránky → mřížka, nebo menu ⋯ → Přehled stránek. Přetažením měníte pořadí (prstem po podržení), tlačítkem Vybrat označíte víc stránek a hromadně je zduplikujete, smažete, přesunete, změníte pozadí nebo vyexportujete do PDF.</li>
<li><b>Historie verzí:</b> menu ⋯ → Historie verzí. Span si sám ukládá verze sešitu (při otevření a každých 10 minut psaní) – starší stav obnovíte, nebo otevřete jako kopii.</li>
<li><b>Nálepky:</b> menu ⋯ → Nálepky (nebo tlačítko obrázku). Lasem je pak zvětšíte a otočíte.</li>
<li><b>Výběr lasem:</b> umí změnit tloušťku čar a uložit nebo zkopírovat výřez jako obrázek (i s průhledným pozadím).</li>
<li><b>Hledání v rukopisu:</b> Ctrl+F nebo menu ⋯ → Hledat – najde i ručně psaný text (offline, toleruje drobné chyby rozpoznání) a místo na stránce zvýrazní.</li>
<li><b>Rychlý přesun prstem:</b> podržte prst na čemkoli napsaném a rovnou to posouvejte.</li>
<li><b>Rovnice a grafy:</b> do kalkulačky (orámovaný příklad nebo menu ⋯ → Kalkulačka a grafy funkcí) napište rovnici s x, např. x^2 − 5x + 6 = 0, a vyřeší ji. Funkci y = … vykreslí jako graf, který vložíte do stránky.</li>
<li><b>Vyšší matematika:</b> int(x^2;0;1) – určitý integrál (i do inf), der(x^3;2) – derivace v bodě (der(f;a;2) druhá), sum(1/x^2;1;100) – součet, lim(sin(x)/x;0) – limita. Proměnná je vždy x.</li>
<li><b>Tabulka a rozvrh:</b> menu ⋯ → Vložit tabulku nakreslí mřížku do stránky. V Pozadí stránky najdete šablony Rozvrh hodin a Týdenní plán.</li>
<li><b>Psaní rukou v tabulce:</b> tlačítko s perem v liště tabulky otevře dole panel. Napište perem text nebo vzorec (např. =SUMA(A1:A5) nebo α = 0,05), po chvilce se převede na znaky a Vložit do buňky ho zapíše a posune se o řádek níž. Rozpoznávání běží offline (číslice, písmena, česká diakritika, matematické znaky – pište znaky odděleně) a učí se vaše písmo: tlačítkem Aa ho natrénujete a každá oprava před vložením se uloží jako nový vzor. Volitelně ho v menu Aa zpřesní Claude. Guma (nebo tlačítko na peru) maže celé tahy. Nad panelem je řada speciálních znaků (řecká písmena, matematika, indexy ², ₁, jednotky) – klepnutím se přidají do buňky.</li>
<li><b>Listování po stránkách:</b> menu ⋯ → Listování po stránkách. Stránky se pak listují tahem prstu do stran jako v knize, na tabletu na šířku vidíte dvoustranu. Zpět na svislé posouvání ve stejném menu nebo v Nastavení.</li>
<li><b>Čmáranice maže:</b> přečmárněte perem cokoli napsaného (cik-cak) a smaže se – bez přepínání na gumu. Vypnout jde v Nastavení.</li>
<li><b>Nahrávka + poznámky:</b> co napíšete během nahrávání, si pamatuje čas. Označte to lasem a klepněte na ▶ – přehraje se, co se v tu chvíli říkalo. Při přehrávání se právě psané poznámky zvýrazní.</li>
<li><b>Tužka a tvary:</b> u pera je nový typ Tužka. Tvary nově umí hvězdu, pěti- a šestiúhelník, pravoúhlý trojúhelník, oboustrannou šipku a osy x, y.</li>
<li><b>Rukopis na text (i offline):</b> označte psaný text lasem a klepněte na T. Text se rozpozná přímo v zařízení, zobrazí se k opravě a z oprav se aplikace učí vaše písmo. Tlačítko Zpřesnit Claudem pomůže u psacího písma (online).</li>
<li><b>Další funkce tabulek:</b> XLOOKUP, TEXTJOIN, SORT, SEQUENCE, ČETNOSTI, LINREGRESE, FORECAST, INTERCEPT, MÍRA.VÝNOSNOSTI.</li>
<li><b>Matice v tabulce:</b> SOUČIN.MATIC, INVERZE, DETERMINANT, TRANSPOZICE, MATICE.JEDNOTKOVÁ – výsledek se sám rozlije do sousedních buněk (napište vzorec jen do levé horní buňky).</li>
<li><b>Obrázky v tabulce:</b> v tabulce tlačítko s obrázkem vloží fotku z galerie nebo z fotoaparátu. Táhnutím ji přesunete, za kulatý roh zvětšíte. Graf z označených dat jde vložit přímo do listu.</li>
<li><b>Záloha všeho:</b> v knihovně tlačítko ⋯ → Zálohovat celou knihovnu uloží všechny sešity, tabulky, složky i kategorie do jednoho souboru.</li>
<li><b>Lepicí poznámky a nahrávky:</b> menu ⋯ → Lepicí poznámka vloží barevný papírek s textem. Nahrát zvuk spustí nahrávání přednášky, nahrávky najdete v menu ⋯ → Nahrávky.</li>
<li><b>Prsty:</b> jeden prst posouvá, dva přibližují. Klepnutí dvěma prsty vrátí krok, třemi ho zopakuje. Dlaň při psaní perem se ignoruje.</li>
<li><b>Kalkulačka:</b> napište příklad, nakreslete kolem něj rámeček (obdélník nebo kruh – podržením pera na konci se srovná) a klepněte na „Spočítat“. Funguje i přes laso. Umí + − × ÷, mocniny, odmocniny, zlomky, závorky i funkce (sin, ln, log…). Pokud příklad přečte špatně, opravte ho – vestavěné rozpoznávání se naučí váš rukopis.</li>
<li><b>Tabulky (Excel):</b> v knihovně „Tabulka“. Vzorce česky (=SUMA, =PRŮMĚR, =KDYŽ…), import a export .xlsx.</li>
<li><b>Pravítko:</b> tlačítko s pravítkem. Posouvejte ho prstem, otáčejte kolečkem na konci; tah perem podél hrany je rovný.</li>
<li><b>Lupa psaní:</b> v nabídce ⋯ → Lupa psaní – pište velkým písmem do spodního panelu, na stránku se zapíše zmenšeně. Rámeček se sám posouvá; prstem ho přesunete jinam.</li>
<li><b>Volby nástroje:</b> podržte tlačítko nástroje (nebo na aktivní klepněte znovu) – tloušťka, tlak, vyhlazení, výplň tvarů, tučný text, barva laseru…</li>
<li><b>Rukopis na text:</b> označte lasem a klepněte na ikonu T v liště výběru.</li>
<li><b>Opakované klepnutí na aktivní nástroj</b> otevře jeho volby (typ pera, režim gumy, tvary, písmo).</li>
<li><b>Klávesy:</b> <span class="kbd">P</span> pero, <span class="kbd">H</span> zvýrazňovač, <span class="kbd">E</span> guma, <span class="kbd">L</span> laso, <span class="kbd">S</span> tvary, <span class="kbd">T</span> text, <span class="kbd">K</span> laser, <span class="kbd">Ctrl+Z</span> zpět. Na počítači otevře kolečko pravé tlačítko myši.</li></ul>`;},[{label:'Rozumím',cls:'primary',value:true}]);

async function importAll(j){
  (j.lib&&j.lib.folders||[]).forEach(f=>{if(!lib.folders.some(x=>x.id===f.id))lib.folders.push(f);});
  (j.lib&&j.lib.cats||[]).forEach(c=>{if(!lib.cats.some(x=>x.id===c.id))lib.cats.push(c);});
  await saveLib();let n=0,skip=0;
  for(const nbk of j.notebooks||[]){if(!nbk||!Array.isArray(nbk.pages))continue;
    const ex=notebooks.find(x=>x.id===nbk.id);if(ex&&(ex.updated||0)>=(nbk.updated||0)){skip++;continue;}
    nbk.pages.forEach(p=>{p.id=p.id||uid();p.items=(p.items||[]).map(finalizeLoaded);});
    await DB.put(nbk);if(ex)notebooks.splice(notebooks.indexOf(ex),1,nbk);else notebooks.push(nbk);n++;}
  renderLib();toast('Obnoveno '+items(n)+(skip?' · '+skip+' už bylo aktuálních':''));
}
