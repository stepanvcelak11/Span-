const REC={mr:null,chunks:[],t0:0,timer:0,stream:null};
function fmtDur(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
async function startRec(){
  if(REC.mr)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('Nahrávání zvuku tento prohlížeč neumí.');return;}
  try{REC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
  catch(e){toast(window.claude&&window.claude.use?'Mikrofon tu není povolen – otevřete aplikaci přes odkaz z GitHub Pages.':'Přístup k mikrofonu byl zamítnut.');return;}
  const type=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  try{REC.mr=new MediaRecorder(REC.stream,type?{mimeType:type,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000});}catch(e){REC.mr=new MediaRecorder(REC.stream);}
  REC.chunks=[];REC.nb=nb;REC.sid=uid();REC.page=nb?curPageIndex():0;REC.mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data);};
  REC.mr.onstop=async()=>{const blob=new Blob(REC.chunks,{type:REC.mr.mimeType||type||'audio/webm'});const dur=(Date.now()-REC.t0)/1000;const target=REC.nb;
    REC.stream.getTracks().forEach(t=>t.stop());REC.mr=null;clearInterval(REC.timer);recBar();
    if(blob.size<200||!target){toast('Nahrávka je prázdná.');return;}
    const src=await readFile(blob);target.audio=(target.audio||[]).concat([{id:REC.sid||uid(),src,dur,created:Date.now(),page:REC.page,name:'Nahrávka '+((target.audio||[]).length+1)}]);
    target.updated=Date.now();if(target===nb)changed();else{nb=target;flushSave();nb=null;}toast('Nahrávka uložena ('+fmtDur(dur)+') – najdete ji v menu ⋯ → Nahrávky');};
  REC.mr.start(1000);REC.t0=Date.now();REC.timer=setInterval(recBar,500);recBar();
}

const thumbCache=new WeakMap();
function pageThumb(p,w){
  let m=thumbCache.get(p);if(!m){m=new Map();thumbCache.set(p,m);}const hit=m.get(w);
  if(hit&&hit.items===p.items&&hit.tpl===p.tpl&&hit.paper===p.paper&&hit.bg===p.bg)return hit.cv;
  const s=w/p.w,k=Math.min(2,devicePixelRatio||1),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(p.h*s*k);
  thumbDraw(c,p,s*k);m.set(w,{items:p.items,tpl:p.tpl,paper:p.paper,bg:p.bg,cv:c});return c;
}
let PG=null;
function openPageGrid(){
  if(!nb)return;clearSel();togglePanel(false);closePops();
  const ov=el('div',{class:'pgrid',id:'pgGrid',role:'dialog','aria-label':'Přehled stránek'});
  ov.innerHTML='<div class="pgrid-bar"><button class="ib" id="pgX" aria-label="Zavřít"></button><b id="pgTitle"></b><span class="sp"></span><div id="pgActs"></div><button class="btn" id="pgSelB">Vybrat</button></div><div class="pgrid-body" id="pgBody"><div class="pgrid-list" id="pgList"></div><p class="lib-note pgrid-tip">Klepnutím otevřete stránku. Pořadí změníte tak, že stránku podržíte a přetáhnete (myší rovnou).</p></div>';
  document.body.append(ov);PG={sel:new Set(),mode:false};
  $('#pgX').innerHTML=ic('close');$('#pgX').onclick=closePageGrid;
  $('#pgSelB').onclick=()=>{PG.mode=!PG.mode;if(!PG.mode)PG.sel.clear();pgRender();};
  const key=e=>{if(e.key==='Escape'&&$('#pgGrid')&&!document.querySelector('.modal-ov'))closePageGrid();};document.addEventListener('keydown',key);PG.key=key;
  pgScroller($('#pgBody'));pgRender();
  const cur=$('#pgList').children[curPageIndex()];if(cur)cur.scrollIntoView({block:'center'});
}
function closePageGrid(){const g=$('#pgGrid');if(!g)return;g.remove();if(PG&&PG.key)document.removeEventListener('keydown',PG.key);PG=null;if(nb){layoutPages();clampView();render();}}
function pgRender(){
  if(!PG)return;const list=$('#pgList');const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const c=e.target,i=+c.dataset.i,p=nb.pages[i];if(p&&!c.querySelector('canvas'))c.querySelector('.pgc-th').append(pageThumb(p,170));io.unobserve(c);}}),{root:$('#pgBody'),rootMargin:'300px'});
  list.innerHTML='';const ci=curPageIndex();
  nb.pages.forEach((p,i)=>{
    const c=el('div',{class:'pgc'+(i===ci?' cur':'')+(PG.sel.has(p.id)?' on':''),'data-i':String(i)});
    c.innerHTML=`<div class="pgc-th" style="aspect-ratio:${p.w}/${p.h}"></div><div class="pgc-l"><b>${i+1}</b>${p.mark?'<span class="pgc-m">★ '+esc(p.title||'')+'</span>':''}</div>`+(PG.mode?`<span class="pgc-ck">${PG.sel.has(p.id)?ic('check'):''}</span>`:'');
    list.append(c);io.observe(c);});
  $('#pgTitle').textContent=PG.mode?(PG.sel.size?'Vybráno: '+PG.sel.size:'Vyberte stránky'):'Stránky ('+nb.pages.length+')';
  $('#pgSelB').textContent=PG.mode?'Hotovo':'Vybrat';
  const A=$('#pgActs');A.innerHTML='';
  const act=(icn,l,fn,cls='')=>{const b=el('button',{class:'ib '+cls,title:l,'aria-label':l},ic(icn));b.onclick=fn;A.append(b);};
  if(PG.mode){
    act('sel',PG.sel.size===nb.pages.length?'Zrušit výběr':'Vybrat vše',()=>{if(PG.sel.size===nb.pages.length)PG.sel.clear();else nb.pages.forEach(p=>PG.sel.add(p.id));pgRender();});
    if(PG.sel.size){
      act('dup','Duplikovat vybrané',pgDup);act('up','Přesunout na začátek',()=>pgMoveSel(0));act('dn','Přesunout na konec',()=>pgMoveSel(1));
      act('tpl','Pozadí vybraných',pgBg);act('down','Exportovat vybrané do PDF',()=>exportPDF({title:nb.title+' (výběr)',pages:nb.pages.filter(p=>PG.sel.has(p.id))}));
      act('trash','Smazat vybrané',pgDel,'del');}
  }else act('plus','Přidat stránku na konec',()=>{addPage(nb.pages.length);pgRender();});
}
const pgSelected=()=>nb.pages.filter(p=>PG.sel.has(p.id));
function pgDup(){snapPages();const out=[];nb.pages.forEach(p=>{out.push(p);if(PG.sel.has(p.id))out.push(Object.assign({},p,{id:uid(),mark:false,title:'',items:p.items.map(it=>Object.assign({},it,{id:uid()}))}));});nb.pages=out;layoutPages();changed();toast('Stránky zduplikovány');pgRender();}

async function pgDel(){
  const n=PG.sel.size;if(n>=nb.pages.length){toast('Sešit musí mít alespoň jednu stránku');return;}
  const ok=await modal('Smazat stránky',b=>b.append(el('p',{},`Smazat ${n} ${n===1?'stránku':n<5?'stránky':'stránek'}? Vrátit to jde tlačítkem Zpět v sešitě.`)),[{label:'Zrušit'},{label:'Smazat',cls:'primary',value:true}]);
  if(!ok||!PG)return;snapPages();nb.pages=nb.pages.filter(p=>!PG.sel.has(p.id));PG.sel.clear();layoutPages();changed();pgRender();toast('Smazáno');
}
async function pgBg(){
  const f=pgSelected()[0];const st={tpl:f.tpl,paper:f.paper};
  const r=await modal('Pozadí vybraných stránek',b=>pickTemplate(b,st),[{label:'Zrušit'},{label:'Použít',cls:'primary',value:true}]);

/* vlastní posouvání + přetahování (prst: podržet, pero/myš: rovnou) */
function pgScroller(body){
  let d=null;
  body.addEventListener('pointerdown',e=>{
    const c=e.target.closest('.pgc');d={id:e.pointerId,x0:e.clientX,y0:e.clientY,ly:e.clientY,st:body.scrollTop,c,moved:false,drag:false,v:0,lt:performance.now(),type:e.pointerType};
    if(e.pointerType==='mouse'){try{body.setPointerCapture(e.pointerId);}catch(_){}}
    if(c&&e.pointerType!=='mouse')d.lp=setTimeout(()=>{if(d&&!d.moved)pgDragStart(d);},380);
  });
  body.addEventListener('pointermove',e=>{if(!d||d.id!==e.pointerId)return;
    const dist=Math.hypot(e.clientX-d.x0,e.clientY-d.y0);
    if(!d.moved&&dist>10){d.moved=true;clearTimeout(d.lp);if(d.c&&d.type==='mouse'&&!d.drag)pgDragStart(d);}
    if(d.drag){pgDragMove(d,e);return;}
  });
  /* posouvá prohlížeč sám (plynule, mimo hlavní vlákno); jen při přetahování stránky se posun zablokuje */
  body.addEventListener('touchmove',e=>{if(d&&d.drag&&e.cancelable)e.preventDefault();},{passive:false});
  const up=e=>{if(!d||d.id!==e.pointerId)return;clearTimeout(d.lp);const D=d;d=null;
    if(D.drag){pgDragEnd(D);return;}
    if(!D.moved&&D.c&&e.type==='pointerup'){const i=+D.c.dataset.i,p=nb.pages[i];if(PG.mode){PG.sel.has(p.id)?PG.sel.delete(p.id):PG.sel.add(p.id);pgRender();}else{closePageGrid();goToPage(i);}}};
  body.addEventListener('pointerup',up);body.addEventListener('pointercancel',up);
}
function pgDragStart(d){d.drag=true;vibrate(10);d.from=+d.c.dataset.i;const r=d.c.getBoundingClientRect();
  const g=d.c.cloneNode(true);g.classList.add('pgc-ghost');g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';d.dx=d.x0-r.left;d.dy=d.y0-r.top;
  const cv=d.c.querySelector('canvas');if(cv){const k=g.querySelector('canvas');if(k)k.getContext('2d').drawImage(cv,0,0);}
  document.body.append(g);d.g=g;d.c.classList.add('dragging');}
function pgDragMove(d,e){d.g.style.left=(e.clientX-d.dx)+'px';d.g.style.top=(e.clientY-d.dy)+'px';
  const body=$('#pgBody'),r=body.getBoundingClientRect();if(e.clientY<r.top+50)body.scrollTop-=12;else if(e.clientY>r.bottom-50)body.scrollTop+=12;
  d.g.style.display='none';const t=document.elementFromPoint(e.clientX,e.clientY);d.g.style.display='';
  document.querySelectorAll('.pgc.drop-b,.pgc.drop-a').forEach(x=>x.classList.remove('drop-b','drop-a'));d.to=null;
  const c=t&&t.closest('.pgc');if(c&&c!==d.c){const cr=c.getBoundingClientRect(),after=e.clientX>cr.left+cr.width/2;c.classList.add(after?'drop-a':'drop-b');d.to=+c.dataset.i+(after?1:0);}}
function pgDragEnd(d){d.g.remove();d.c.classList.remove('dragging');document.querySelectorAll('.pgc.drop-b,.pgc.drop-a').forEach(x=>x.classList.remove('drop-b','drop-a'));
  if(d.to==null)return;let to=d.to;if(to>d.from)to--;if(to===d.from)return;
  snapPages();const a=nb.pages.slice(),[p]=a.splice(d.from,1);a.splice(to,0,p);nb.pages=a;layoutPages();changed();pgRender();toast('Stránka '+(d.from+1)+' přesunuta na pozici '+(to+1));}

/* ---------- historie verzí ---------- */
const VER={MAX:15,EVERY:10*60e3};
const verRange=id=>IDBKeyRange.bound('v:'+id+':','v:'+id+':￿');
function verReq(mode,fn){return new Promise(res=>{if(!DB.db){res(null);return;}try{const r=fn(DB.os(mode,'meta'));r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});}
async function verList(id){const a=await verReq('readonly',os=>os.getAll(verRange(id)));return (a||[]).sort((x,y)=>y.t-x.t);}
async function verSnap(n,why){
  if(!DB.db||!n||n.kind==='sheet'||!n.pages)return false;const t=Date.now();
  const {o,recs}=bgStrip(n);await DB.putBgs(recs);const data=JSON.stringify(o,(k,v)=>k[0]==='_'?undefined:v);
  const ok=await verReq('readwrite',os=>os.put({id:'v:'+n.id+':'+t,t,why,pages:n.pages.length,size:data.length,data}));
  n._lastSnap=t;
  const keys=(await verReq('readonly',os=>os.getAllKeys(verRange(n.id))))||[];
  if(keys.length>VER.MAX){keys.sort();for(const k of keys.slice(0,keys.length-VER.MAX))await verReq('readwrite',os=>os.delete(k));}
  return ok!==null;
}
async function verOnOpen(n){const keys=(await verReq('readonly',os=>os.getAllKeys(verRange(n.id))))||[];keys.sort();const last=keys.length?+String(keys[keys.length-1]).split(':').pop():0;n._lastSnap=last;if(Date.now()-last>VER.EVERY&&nb===n)verSnap(n,'Při otevření');}
function verMaybe(){if(nb&&nb.kind!=='sheet'&&Date.now()-(nb._lastSnap||0)>VER.EVERY)verSnap(nb,'Automaticky');}
const fmtWhen=t=>new Date(t).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
async function openVersions(){
  if(!nb)return;const n=nb;
  if(!DB.db){modal('Historie verzí',b=>b.append(el('p',{},'Historie verzí potřebuje úložiště prohlížeče (IndexedDB), které tady není dostupné.')),[{label:'Zavřít',cls:'primary'}]);return;}
  const list=await verList(n.id);
  const v=await modal('Historie verzí',b=>{
    b.append(el('p',{class:'lib-note'},'Span si sám ukládá verzi sešitu při otevření a pak každých 10 minut psaní (posledních '+VER.MAX+'). Starší verzi můžete obnovit, nebo otevřít jako kopii.'));
    const now=el('button',{class:'btn'},ic('plus')+'Uložit verzi teď');now.style.alignSelf='flex-start';now.onclick=async()=>{flushSave();await verSnap(n,'Ručně');b.closest('.modal-ov').querySelector('.modal-foot .btn').click();toast('Verze uložena');setTimeout(openVersions,60);};b.append(now);
    const L=el('div',{class:'ver-list'});

      const th=el('div',{class:'ver-th'});try{const d=bgResolve(JSON.parse(r.data));const p=d.pages[0];p.items=(p.items||[]).map(finalizeLoaded);th.append(pageThumb(p,64));}catch(e){}
      const info=el('div',{class:'ver-i'},`<b>${fmtWhen(r.t)}</b><span>${esc(r.why||'')} · ${r.pages} ${r.pages===1?'stránka':r.pages<5?'stránky':'stránek'}</span>`);
      const a=el('button',{class:'btn'},'Kopie');a.title='Otevřít jako nový sešit';a.onclick=()=>verAsCopy(r,b);
      const o=el('button',{class:'btn primary'},'Obnovit');o.onclick=()=>verRestore(r,b);
      row.append(th,info,a,o);L.append(row);});
    b.append(L);
  },[{label:'Zavřít'}]);
}
async function verRestore(r,b){
  if(!nb)return;const ok=await modal('Obnovit verzi',x=>x.append(el('p',{},'Obnovit sešit do stavu z '+fmtWhen(r.t)+'? Současný stav se předtím uloží jako verze, takže o nic nepřijdete.')),[{label:'Zrušit'},{label:'Obnovit',cls:'primary',value:true}]);
  if(!ok)return;await verSnap(nb,'Před obnovením');const d=await bgResolveAsync(JSON.parse(r.data));
  nb.pages=d.pages.map(p=>Object.assign(p,{items:(p.items||[]).map(finalizeLoaded)}));nb.audio=d.audio||[];
  H_.undo=[];H_.redo=[];updUndo();pcache.clear();ocrCache.clear();clearSel();layoutPages();clampView();changed();flushSave();render();
  const ov=b.closest('.modal-ov');if(ov)ov.querySelector('.modal-foot .btn').click();toast('Obnoveno – verze z '+fmtWhen(r.t));
}
async function verAsCopy(r,b){
  const d=await bgResolveAsync(JSON.parse(r.data));d.id=uid();d.title=(d.title||'Sešit')+' ('+fmtWhen(r.t)+')';d.created=d.updated=Date.now();d.fav=false;d.trashed=null;
  d.pages.forEach(p=>{p.items=(p.items||[]).map(finalizeLoaded);});await DB.put(d);notebooks.push(d);
  const ov=b.closest('.modal-ov');if(ov)ov.querySelector('.modal-foot .btn').click();toast('Kopie vytvořena v knihovně: '+d.title);

function selWidthPop(anchor){
  if(!sel)return;const pg=sel.page,ids=new Set(sel.ids),orig=new Map();pg.items.forEach(it=>{if(ids.has(it.id)&&it.t==='s')orig.set(it.id,it);});

  openPop(anchor,p=>{p.append(el('h4',{},'Tloušťka vybraných tahů'));
    slider(p,'Násobek',25,400,5,100,v=>v+' %',v=>{if(!snapped){snapItems(pg);snapped=true;}const f=v/100;pg.items=pg.items.map(it=>orig.has(it.id)?finalize(Object.assign({},orig.get(it.id),{w:orig.get(it.id).w*f})):it);sel.bb=selBounds();changed();render();});});

function selCanvas(items,bg){
  let b=[1e9,1e9,-1e9,-1e9];items.forEach(it=>{const g=getBounds(it);b=[Math.min(b[0],g[0]),Math.min(b[1],g[1]),Math.max(b[2],g[2]),Math.max(b[3],g[3])];});
  const pad=16,w=b[2]-b[0]+pad*2,h=b[3]-b[1]+pad*2,sc=Math.min(3,4000/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.max(8,Math.round(w*sc));c.height=Math.max(8,Math.round(h*sc));const x=c.getContext('2d');
  if(bg){x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);}x.setTransform(sc,0,0,sc,(pad-b[0])*sc,(pad-b[1])*sc);
  items.forEach(it=>drawItem(x,it,sel?sel.page:{paper:'white'}));return c;
}

/* =========================================================
   Výkon: pozadí stránek (PDF, učebnice) – dekódování mimo hlavní vlákno,
   zmenšené úrovně podle potřebné velikosti a omezená paměť (LRU)
   ========================================================= */
const BG={par:2,m:new Map(),bytes:0,MAX:((navigator.deviceMemory||4)>=6?220:140)*1e6,q:[],run:0,ok:typeof createImageBitmap==='function'};
const BG_L=[320,640,1280,2048,Infinity];
/* Malé náhledy pozadí (320 px JPEG, uložené v IndexedDB jako 't:<id>'): přehled stránek a panel
   nemusí kvůli každé miniatuře dekódovat celou velkou stránku učebnice. */
const BGT=new Map();
function bgThumbSave(src,canvasOrBmp){try{const id=bgIdOf(src);if(BGT.has(id))return;const w=320,h=Math.round(w*canvasOrBmp.height/canvasOrBmp.width);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(canvasOrBmp,0,0,w,h);
  c.toBlob(b=>{if(!b)return;BGT.set(id,b);DB.putBgs([{id:'t:'+id,data:b}]);},'image/jpeg',0.82);}catch(e){}}
function bgEnt(src){let e=BG.m.get(src);if(!e){e={src,lv:new Map(),pend:new Set(),t:0,ar:1.414,nat:0,blob:null,cb:[]};BG.m.set(src,e);}e.t=performance.now();return e;}
function bgWant(px,e){let L=Infinity;for(const l of BG_L)if(l>=px*0.92){L=l;break;}if(e.nat&&L>=e.nat)L=Infinity;return L;}
/* nejlepší dostupná úroveň (nejmenší dostatečná, jinak největší menší); chybějící se zařadí k dekódování */
function getBg(p,px,prio=1){
  const e=bgEnt(p.bg);e.ar=p.h/p.w;const L=bgWant(px,e);let best=null,bl=-1;
  for(const[l,b] of e.lv){if(l>=L){if(bl<L||l<bl){best=b;bl=l;}}else if(bl<L&&l>bl){best=b;bl=l;}}
  if(bl<L)bgQueue(e,L,prio);
  return best;
}
function bgReady(p,px){return new Promise(res=>{const e=bgEnt(p.bg);const b=getBg(p,px,0);const L=bgWant(px,e);if(b&&[...e.lv.keys()].some(l=>l>=L))return res();e.cb.push(res);setTimeout(res,8000);});}
function bgQueue(e,L,prio){
  if(e.pend.has(L))return;e.pend.add(L);
  const job={e,L};prio?BG.q.unshift(job):BG.q.push(job);bgPump();
}
function bgPump(){
  while(BG.run<BG.par&&BG.q.length){const j=BG.q.shift();BG.run++;bgDecode(j.e,j.L).catch(()=>{}).finally(()=>{BG.run--;j.e.pend.delete(j.L);bgPump();});}
}
async function bgDecode(e,L){
  if(e.lv.has(L))return;
  let bmp=null;
  if(BG.ok){
    try{
      const tid=L<=320&&BGS.id.get(e.src),tb=tid&&BGT.get(tid);
      if(tb){bmp=await createImageBitmap(tb);}
      else{if(!e.blob)e.blob=dataBlob(e.src);
      bmp=L===Infinity?await createImageBitmap(e.blob):await createImageBitmap(e.blob,{resizeWidth:L,resizeHeight:Math.max(1,Math.round(L*e.ar)),resizeQuality:'high'});
      if(!BGT.has(bgIdOf(e.src)))bgThumbSave(e.src,bmp);
      /* velký Blob nedržet v paměti, pokud už nic nečeká na dekódování */
      if(!e.pend.size||e.pend.size===1&&e.pend.has(L))e.blob=null;}
    }catch(err){bmp=null;}
  }
  if(!bmp){/* záloha pro starší prohlížeče: klasický obrázek */
    const im=new Image();im.src=e.src;try{await im.decode();}catch(err){}
    if(!im.naturalWidth)return;bmp=im;L=Infinity;
  }
  if(L===Infinity){e.nat=bmp.width;/* menší úrovně, které jsou větší než originál, už nejsou potřeba */
    for(const[l,b] of [...e.lv])if(l>=e.nat){bgFree(e,l,b);} }
  e.lv.set(L,bmp);BG.bytes+=bmp.width*bmp.height*4;e.t=performance.now();
  bgEvict(e);
  const cbs=e.cb;e.cb=[];cbs.forEach(f=>{try{f();}catch(err){}});
  bgArrived(e.src);
}
function dataBlob(src){src=src.split('#')[0];if(!src.startsWith('data:'))throw new Error('url');const i=src.indexOf(','),meta=src.slice(5,i),d=src.slice(i+1);
  if(!/;base64/.test(meta))return new Blob([decodeURIComponent(d)],{type:meta.split(';')[0]});const bin=atob(d),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type:meta.split(';')[0]});}
function bgFree(e,l,b){e.lv.delete(l);BG.bytes-=b.width*b.height*4;try{b.close&&b.close();}catch(err){}}
function bgEvict(keep){
  if(BG.bytes<=BG.MAX)return;
  /* nejdřív velké úrovně nejdéle nepoužitých stránek, malé náhledové (320) se drží nejdéle */
  const ents=[...BG.m.values()].filter(x=>x!==keep&&x.lv.size).sort((a,b)=>a.t-b.t);
  for(const x of ents){for(const[l,b] of [...x.lv].sort((a,b)=>b[0]-a[0])){if(l<=320&&BG.bytes<BG.MAX*1.3)continue;bgFree(x,l,b);if(BG.bytes<=BG.MAX*0.85)return;}}
}
let bgArrT=0;const bgArrSet=new Set();
function bgArrived(src){bgArrSet.add(src);if(bgArrT)return;bgArrT=requestAnimationFrame(()=>{bgArrT=0;const s=new Set(bgArrSet);bgArrSet.clear();
  if(nb){for(const[id,c] of pcache)if(s.has(c.bgSrc))pcache.delete(id);scheduleRender();}
  thumbWait.forEach((f,cv)=>{if(s.has(f.src)){thumbWait.delete(cv);f.redraw();}});
});}
/* náhledy stránek: kreslí se hned (s tím, co je k dispozici) a dokreslí se, až dorazí pozadí */
const thumbWait=new Map();
function thumbDraw(cv,p,scale){
  const x=cv.getContext('2d');x.setTransform(scale,0,0,scale,0,0);x.clearRect(0,0,p.w,p.h);drawPage(x,p,{print:false,thumb:true,noBadge:true});
  if(p.bg){const e=bgEnt(p.bg),L=bgWant(p.w*scale,e);if(![...e.lv.keys()].some(l=>l>=L))thumbWait.set(cv,{src:p.bg,redraw:()=>{if(cv.isConnected||cv._keep)thumbDraw(cv,p,scale);}});}
}
/* zahřátí: dekódovat pozadí sousedních stránek dřív, než na ně uživatel dojede */
let warmT=0;
function warmNeighbors(){
  clearTimeout(warmT);warmT=setTimeout(()=>{
    if(!nb||fastMode)return;const i=curPageIndex();
    for(const d of (ECO()?[1,-1]:[1,-1,2,-2,3])){const p=nb.pages[i+d];if(p&&p.bg)getBg(p,p.w*z*dpr,0);}
    /* těžké stránky (hodně tahů) předpřipravit jako bitmapu pro plynulý posun */
    const ric=window.requestIdleCallback||(f=>setTimeout(f,60));
    ric(()=>{if(!nb||fastMode||ECO())return;for(const d of [0,1,-1]){const p=nb.pages[i+d];if(p&&heavyPage(p))pageBitmap(p);}});
  },120);
}
const heavyPage=p=>p.items.length>220;

/* plynulá animace pohledu (zoom tlačítky, skok na stránku, dorovnání po gestu) */
let viewRAF=0;
function animView(tz,tox,toy,D=280,done){
  cancelInertia();if(viewRAF)cancelAnimationFrame(viewRAF);
  const z0=z,x0=ox,y0=oy,t0=performance.now();setFast();
  const reduce=ECO()||matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce)D=1;
  const step=now=>{const k=Math.min(1,(now-t0)/D),e=k<1?1-Math.pow(1-k,3):1;
    /* zoom interpolovat logaritmicky – působí rovnoměrně */
    z=z0*Math.pow(tz/z0,e);ox=x0+(tox-x0)*e;oy=y0+(toy-y0)*e;clampView();render();
    if(k<1)viewRAF=requestAnimationFrame(step);else{viewRAF=0;endFast();done&&done();}};
  viewRAF=requestAnimationFrame(step);
}
function zoomAnim(sx,sy,nz,D=240){nz=clamp(nz,0.2,6);const k=nz/z;animView(nz,sx-(sx-ox)*k,sy-(sy-oy)*k,D);}
/* po sevření prsty: mírně pod šířkou obrazovky → dorovnat na šířku; přes limit → vrátit */
function settleZoom(){
  if(!nb||HL())return false;const fz=clamp(W/maxPW,0.2,3);
  if(z<fz&&z>fz*0.8){const cy=(H/2-oy)/z;animView(fz,W/2,H/2-cy*fz,220);return true;}
  return false;
}

/* líný náhled: prázdné plátno správné velikosti, dokreslí se až při zobrazení */
function lazyThumb(p,w,io){
  const m=thumbCache.get(p),hit=m&&m.get(w);
  if(hit&&hit.items===p.items&&hit.tpl===p.tpl&&hit.paper===p.paper&&hit.bg===p.bg)return hit.cv;
  const k=Math.min(2,devicePixelRatio||1),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(p.h*w/p.w*k);c.className='lazy';
  c._fill=()=>{const t=pageThumb(p,w);t.onclick=c.onclick;t.title=c.title;t.className='';if(c.isConnected)c.replaceWith(t);};
  io.observe(c);return c;
}

/* =========================================================
   Offline: service worker uloží aplikaci i všechny knihovny (PDF, Excel, grafy, písma),
   po prvním otevření s internetem pak vše funguje bez připojení.
   ========================================================= */
function offlineCapable(){return 'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude/.test(location.hostname);}
function offlineSetup(){
  if(offlineCapable()){
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='offline-ready'){if(!store.get('offlineOk',false)){store.set('offlineOk',true);toast('Aplikace je připravená i bez internetu ✓');}}});
    navigator.serviceWorker.register('sw.js').then(r=>{r.update&&r.update().catch(()=>{});}).catch(()=>{});
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  }
  const net=()=>{document.documentElement.classList.toggle('offline',!navigator.onLine);};
  addEventListener('online',()=>{net();toast('Připojeno k internetu');});
  addEventListener('offline',()=>{net();toast(offlineCapable()?'Jste offline – sešity, PDF i tabulky fungují dál':'Jste offline – aplikace běží, dokud tuto stránku nezavřete');});
  net();
}
function offlineInfo(){
  const ok=offlineCapable(),ready=ok&&navigator.serviceWorker.controller;
  modal('Offline režim',b=>{b.innerHTML=ok?(ready?'<p>✓ Aplikace je uložená v tabletu a funguje i bez internetu – psaní, sešity, import PDF, tabulky (Excel), grafy, rozpoznávání písma i export do PDF.</p><p>Bez internetu nefunguje jen volitelné upřesnění rukopisu přes Claude.</p>':'<p>Aplikace se právě ukládá pro offline použití. Nechte ji chvíli otevřenou s internetem.</p>')
    :'<p>Tato stránka běží uvnitř claude.ai, a ta bez internetu nejde otevřít.</p><p>Pro práci bez internetu otevřete Span z jeho vlastní adresy (GitHub Pages) a v Chromu zvolte <b>⋮ → Přidat na plochu / Instalovat aplikaci</b>. Pak se spouští z ikony na ploše i bez připojení.</p><p>Vaše sešity jsou uložené v prohlížeči podle adresy – sešity z claude.ai do nainstalované aplikace přenesete přes Zálohu (podržte sešit → Záloha) a Import.</p>';
    if(ok)navigator.serviceWorker.ready.then(r=>r.active&&r.active.postMessage('precache')).catch(()=>{});
  },[{label:'Hotovo',cls:'primary',value:true}]);
}

const BGS={id:new Map(),str:new Map(),saved:new Set()};
function bgIdOf(str){let id=BGS.id.get(str);if(!id){id='b'+uid();BGS.id.set(str,id);BGS.str.set(id,str);}return id;}
const bigBg=p=>typeof p.bg==='string'&&p.bg.length>4096;
/* kopie sešitu pro uložení: místo obrázku pozadí jen odkaz (bgRef) + seznam dosud neuložených obrázků */
function bgStrip(n){if(!n.pages)return {o:n,recs:[]};const recs=[],seen=new Set();
  const pages=n.pages.map(p=>{if(!bigBg(p))return p;const id=bgIdOf(p.bg);if(!BGS.saved.has(id)&&!seen.has(id)){seen.add(id);recs.push({id,data:p.bg});}const q=Object.assign({},p);delete q.bg;q.bgRef=id;return q;});
  return {o:Object.assign({},n,{pages}),recs};}
function bgResolve(n){if(n&&n.pages)n.pages.forEach(p=>{if(p.bgRef){const d=BGS.str.get(p.bgRef);if(d)p.bg=d;delete p.bgRef;}});return n;}
async function bgResolveAsync(n){const miss=(n.pages||[]).filter(p=>p.bgRef&&!BGS.str.has(p.bgRef)).map(p=>p.bgRef);
  if(miss.length&&DB.db)await new Promise(res=>{try{const tx=DB.db.transaction('bg','readonly'),os=tx.objectStore('bg');miss.forEach(id=>os.get(id).onsuccess=e=>{const r=e.target.result;if(r){BGS.str.set(r.id,r.data);BGS.id.set(r.data,r.id);BGS.saved.add(r.id);}});tx.oncomplete=tx.onerror=tx.onabort=()=>res();}catch(e){res();}});
  return bgResolve(n);}
/* úklid: obrázky pozadí, na které už nic neodkazuje (smazané stránky a sešity) */
async function bgCleanup(){if(!DB.db)return;const used=new Set();notebooks.forEach(n=>(n.pages||[]).forEach(p=>{if(bigBg(p)){const id=BGS.id.get(p.bg);if(id)used.add(id);}}));
  const vers=await new Promise(res=>{try{const r=DB.os('readonly','meta').getAll(IDBKeyRange.bound('v:','v:￿'));r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([]);}catch(e){res([]);}});
  vers.forEach(v=>{const re=/"bgRef":"([^"]+)"/g;let m;while((m=re.exec(v.data||'')))used.add(m[1]);});
  const keys=await new Promise(res=>{try{const r=DB.os('readonly','bg').getAllKeys();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([]);}catch(e){res([]);}});
  const dead=keys.filter(k=>!used.has(k.startsWith('t:')?k.slice(2):k));if(!dead.length)return;
  await new Promise(res=>{try{const tx=DB.db.transaction('bg','readwrite'),os=tx.objectStore('bg');dead.forEach(k=>os.delete(k));tx.oncomplete=tx.onerror=tx.onabort=()=>res();}catch(e){res();}});
  dead.forEach(k=>{if(k.startsWith('t:')){BGT.delete(k.slice(2));return;}const d=BGS.str.get(k);BGS.str.delete(k);BGS.saved.delete(k);if(d&&BGS.id.get(d)===k)BGS.id.delete(d);});}
async function init(){
  applyTheme();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}
  await DB.open();
  notebooks=await DB.all();
  const m=await DB.getMeta('lib');
  if(m)lib=Object.assign({id:'lib',folders:[],cats:[]},m);
  else{lib.cats=[{id:uid(),name:'Škola',color:'#2D5BD3'},{id:uid(),name:'Práce',color:'#1F7A5C'},{id:uid(),name:'Osobní',color:'#D9822B'}];await saveLib();}
  if(!notebooks.length&&!store.get('welcomed',false)){const w=makeWelcome();await DB.put(w);notebooks=[w];store.set('welcomed',true);}
  const old=Date.now()-30*864e5;for(const n of notebooks.filter(n=>n.trashed&&n.trashed<old)){await DB.del(n.id);}notebooks=notebooks.filter(n=>!(n.trashed&&n.trashed<old));
  renderLib();setTimeout(()=>bgCleanup().catch(()=>{}),6000);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{tlCache=new WeakMap();if(nb)render();});
  offlineSetup();
}
init();
</script>
